    {id:"1.2",title:"Quantum Numbers & Orbitals",diagram:"orbitalShapes",
     content:`
     <p class="intro-text">The quantum mechanical model describes electrons using <strong>wave functions (ψ)</strong>. The square of the wave function, ψ², gives the probability of finding an electron at a given point. This probability distribution defines the shape of an <strong>orbital</strong>.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Heisenberg Uncertainty Principle</div><div class="term-body">It is fundamentally impossible to know both the <strong>exact position</strong> and <strong>exact momentum</strong> of an electron simultaneously. <div class="term-eq">Δx · Δp ≥ ℏ/2 &nbsp; (ℏ = h/2π)</div>This is why orbitals (probability regions) replace exact orbits in the modern model.</div></div></div>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">de Broglie Wavelength</div><div class="term-body">Matter has wave-like properties. For a particle of mass m moving at speed v: <div class="term-eq">λ = h / mv</div>Electrons' wave nature creates constructive/destructive interference — only certain orbits where standing waves fit are allowed (explaining Bohr's quantization).</div></div></div>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(167,139,250,.12)">🔢</div><div class="sec-title">The Four Quantum Numbers</div></div>
       <div class="card-grid">
         <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">1️⃣</div><h3>Principal Quantum Number (n)</h3><p>Specifies the <strong>shell</strong> (energy level). n = 1, 2, 3, 4… Higher n = larger orbital = higher energy = farther from nucleus. Max electrons in shell n = <strong>2n²</strong>.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">2️⃣</div><h3>Angular Momentum (ℓ)</h3><p>Specifies the <strong>subshell (shape)</strong>. ℓ = 0 to (n−1). ℓ=0 → s (sphere), ℓ=1 → p (dumbbell), ℓ=2 → d (cloverleaf), ℓ=3 → f (complex). Each letter corresponds to a different orbital shape.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--pu)"></div><div class="card-icon">3️⃣</div><h3>Magnetic Quantum Number (mℓ)</h3><p>Specifies <strong>orbital orientation</strong>. mℓ ranges from −ℓ to +ℓ. For p subshell (ℓ=1): mℓ = −1, 0, +1 → three p orbitals (p_x, p_y, p_z). Gives 2ℓ+1 orbitals per subshell.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--gr)"></div><div class="card-icon">4️⃣</div><h3>Spin Quantum Number (ms)</h3><p>Electron <strong>spin</strong>: +½ (↑, "spin up") or −½ (↓, "spin down"). Only two possible values. The Pauli Exclusion Principle states no two electrons in the same atom can have all four quantum numbers identical — so each orbital holds max 2 electrons with opposite spins.</p></div>
       </div>
     </div>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(56,217,217,.12)">📐</div><div class="sec-title">Orbital Summary</div></div>
       <div class="tbl-wrap"><table><thead><tr><th>Subshell</th><th>ℓ</th><th># Orbitals (2ℓ+1)</th><th>Max Electrons</th><th>Shape</th></tr></thead>
       <tbody>
         <tr><td>s</td><td>0</td><td>1</td><td>2</td><td>Sphere</td></tr>
         <tr><td>p</td><td>1</td><td>3</td><td>6</td><td>Dumbbell (3 orientations)</td></tr>
         <tr><td>d</td><td>2</td><td>5</td><td>10</td><td>Cloverleaf / complex</td></tr>
         <tr><td>f</td><td>3</td><td>7</td><td>14</td><td>Very complex</td></tr>
       </tbody></table></div>
     </div>
     <div class="hbox hb-am"><h4>⚠ Nodes</h4><ul>
       <li>A <strong>node</strong> is a region where ψ² = 0 (zero probability of finding electron)</li>
       <li>Radial nodes = n − ℓ − 1. Angular nodes = ℓ. Total nodes = n − 1.</li>
       <li>2s orbital has 1 radial node (a spherical shell of zero density)</li>
       <li>2p orbital has 1 angular node (a plane through the nucleus)</li>
     </ul></div>`},
    {id:"1.3",title:"Electron Configuration",
     content:`
     <p class="intro-text">Electron configuration describes how electrons are distributed among the orbitals of an atom. Three rules govern this filling, and exceptions reveal how stability truly works.</p>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(79,142,247,.12)">📋</div><div class="sec-title">Three Filling Rules</div></div>
       <div class="steps">
         <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Aufbau Principle</h4><p>Fill orbitals in order of increasing energy: 1s → 2s → 2p → 3s → 3p → <strong>4s → 3d</strong> → 4p → 5s → 4d → 5p → 6s → 4f → 5d… The 4s fills before 3d because it has lower energy in the free atom (this surprises students). Memorize using the diagonal rule or periodic table blocks.</p></div></div>
         <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Pauli Exclusion Principle</h4><p>No two electrons in the same atom can have the same four quantum numbers. Since n, ℓ, mℓ define the orbital, ms must differ. Result: each orbital holds a maximum of 2 electrons with opposite spins (↑↓).</p></div></div>
         <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Hund's Rule of Maximum Multiplicity</h4><p>Within a subshell (same ℓ), place one electron in each orbital before pairing. All singly occupied orbitals have the same spin direction. This minimizes electron-electron repulsion and gives lowest energy. Carbon = 1s²2s²2p¹2p¹ (two separate 2p orbitals), NOT 2p²↑↓ in one orbital.</p></div></div>
       </div>
     </div>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(52,211,153,.12)">⚡</div><div class="sec-title">Exceptions to the Aufbau Principle</div></div>
       <div class="card-grid">
         <div class="card"><div class="card-accent" style="background:var(--re)"></div><div class="card-icon">⚠️</div><h3>Chromium (Cr, Z=24)</h3><p><strong>Expected:</strong> [Ar] 3d⁴ 4s²<br><strong>Actual:</strong> [Ar] 3d⁵ 4s¹<br>A half-filled d subshell (5 electrons with same spin) is extra stable — the energy gained outweighs the 4s promotion cost.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">⚠️</div><h3>Copper (Cu, Z=29)</h3><p><strong>Expected:</strong> [Ar] 3d⁹ 4s²<br><strong>Actual:</strong> [Ar] 3d¹⁰ 4s¹<br>A fully filled d subshell (d¹⁰) is extra stable — electrons in a filled subshell are symmetrically distributed, reducing repulsion.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--pu)"></div><div class="card-icon">📝</div><h3>Cation Configurations</h3><p>Transition metals lose 4s electrons <strong>first</strong> (before 3d) when forming cations. Fe³⁺ loses both 4s electrons then one 3d: [Ar] 3d⁵. The 4s is higher energy in a cation because loss of electrons changes orbital energetics.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">📝</div><h3>Noble Gas Notation</h3><p>Write the nearest preceding noble gas in brackets, then the remaining electrons. Na: [Ne] 3s¹. Fe: [Ar] 3d⁶4s². Saves writing — [Ne] replaces 1s²2s²2p⁶. The electrons AFTER the noble gas are the <strong>valence electrons</strong>.</p></div>
       </div>
     </div>
     <div class="hbox hb-bl"><h4>💡 Paramagnetism vs Diamagnetism</h4><ul>
       <li><strong>Paramagnetic:</strong> has unpaired electrons → attracted to magnetic field. e.g., O₂ (2 unpaired e⁻)</li>
       <li><strong>Diamagnetic:</strong> all electrons paired → weakly repelled by magnetic field. e.g., Ne, Zn²⁺</li>
       <li>Count unpaired electrons from electron configuration to determine</li>
     </ul></div>`},
    {id:"1.4",title:"Periodic Trends",diagram:"periodicTrend",diagramArgs:["radius"],
     content:`
     <p class="intro-text">Periodic trends arise from two competing effects: <strong>increasing nuclear charge</strong> (more protons as Z increases) and <strong>electron shielding</strong> (inner electrons partially block the outer electrons from the nuclear attraction). Their balance defines <strong>effective nuclear charge (Z_eff)</strong>.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Effective Nuclear Charge (Z_eff)</div><div class="term-body">The net positive charge felt by a valence electron after accounting for shielding by inner electrons. <div class="term-eq">Z_eff ≈ Z − σ</div>σ = shielding constant. Across a period: Z increases, shielding stays roughly constant → Z_eff increases → electrons held more tightly. This explains nearly all periodic trends.</div></div></div>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(251,191,36,.12)">📊</div><div class="sec-title">All Major Periodic Trends</div></div>
       <div class="tbl-wrap"><table><thead><tr><th>Property</th><th>Across Period →</th><th>Down Group ↓</th><th>Key Reason</th><th>Exception to Know</th></tr></thead>
       <tbody>
         <tr><td><strong>Atomic Radius</strong></td><td>Decreases</td><td>Increases</td><td>Higher Z_eff pulls electrons in; more shells add distance</td><td>None major</td></tr>
         <tr><td><strong>Ionic Radius</strong></td><td>Cations &lt; anions; decreases for isoelectronic series as Z increases</td><td>Increases</td><td>Loss of e⁻ → contraction; gain of e⁻ → expansion</td><td>Isoelectronic: Na⁺ &lt; Mg²⁺ (same e⁻ count, Mg has higher Z)</td></tr>
         <tr><td><strong>Ionization Energy (IE₁)</strong></td><td>Increases</td><td>Decreases</td><td>Higher Z_eff → harder to remove electrons</td><td>B &lt; Be (2p above 2s); O &lt; N (paired 2p e⁻ repel each other)</td></tr>
         <tr><td><strong>Electron Affinity</strong></td><td>Generally increases</td><td>Generally decreases</td><td>Higher Z_eff attracts extra electron more strongly</td><td>Noble gases (EA ≈ 0); N has lower EA than C/O</td></tr>
         <tr><td><strong>Electronegativity</strong></td><td>Increases</td><td>Decreases</td><td>Ability to attract shared electrons in a bond</td><td>F = 4.0 (highest); noble gases often excluded; francium lowest</td></tr>
         <tr><td><strong>Metallic character</strong></td><td>Decreases</td><td>Increases</td><td>Easier to lose electrons → more metallic</td><td>Metalloids along the staircase</td></tr>
       </tbody></table></div>
     </div>
     <div class="hbox hb-re"><h4>🔴 Ionization Energy Exceptions — Memorize!</h4><ul>
       <li><strong>B &lt; Be:</strong> Boron's 2p electron is higher energy (easier to remove) than Beryllium's 2s electron</li>
       <li><strong>O &lt; N:</strong> Oxygen must pair electrons in one 2p orbital — that paired electron experiences extra repulsion, making it slightly easier to remove</li>
       <li>Same exceptions repeat in Period 3: Al &lt; Mg, S &lt; P</li>
       <li>These are a favorite USNCO question type — know them cold</li>
     </ul></div>`},
    {id:"1.5",title:"Photoelectron Spectroscopy",
     content:`
     <p class="intro-text">Photoelectron Spectroscopy (PES) measures the <strong>binding energy</strong> of electrons in each subshell. It directly confirms quantum mechanical electron configuration and shows experimental evidence for Z_eff differences across the periodic table.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">PES Principle — Photoelectric Effect</div><div class="term-body">High-energy photons (UV or X-ray) eject electrons from atoms. The kinetic energy of the ejected electron tells us the binding energy: <div class="term-eq">BE = E_photon − KE_electron</div>Each subshell has a characteristic binding energy. Plotting binding energy vs signal intensity gives the PES spectrum.</div></div></div>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(56,217,217,.12)">📊</div><div class="sec-title">Reading a PES Spectrum</div></div>
       <div class="card-grid">
         <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">📍</div><h3>Peak Position (x-axis)</h3><p>The x-axis shows <strong>binding energy</strong> (in MJ/mol or eV). Peaks to the <strong>right</strong> (higher BE) = electrons closer to nucleus (inner shells). Peaks to the <strong>left</strong> (lower BE) = valence electrons (outer shells). 1s electrons have the highest BE.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">📏</div><h3>Peak Height (y-axis)</h3><p>The <strong>relative height</strong> of a peak is proportional to the <strong>number of electrons</strong> in that subshell. s subshells (max 2e⁻) give shorter peaks. p subshells (max 6e⁻) give taller peaks. The height ratio reveals the electron count.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--pu)"></div><div class="card-icon">🔍</div><h3>Identify the Element</h3><p>Count peaks → number of subshells. Count relative heights → electron distribution. Match to electron configuration. For example, 3 peaks with height ratio 1:1:3 suggests 1s²2s²2p⁶ (Na would show 4 peaks). </p></div>
         <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">📈</div><h3>Z_eff Evidence</h3><p>Across a period, the 1s binding energy <strong>increases</strong> because Z increases — each proton added makes the core electrons more tightly bound. This directly proves that nuclear charge increases across a period.</p></div>
       </div>
     </div>
     <div class="hbox hb-gr"><h4>✓ Worked Example: Na (1s²2s²2p⁶3s¹)</h4><ul>
       <li>PES shows 4 peaks: 1s, 2s, 2p, 3s (from right to left = lowest to highest BE)</li>
       <li>3s peak is smallest (1 electron). 2p peak is tallest (6 electrons). 2s and 1s peaks are equal height to each other (2 electrons each)</li>
       <li>Height ratios from left: 1 : 3 : 1 : 1 (3s : 2p : 2s : 1s)</li>
       <li>The 3s peak (lowest BE) confirms it's the easiest electron to remove — consistent with Na's low first ionization energy</li>
     </ul></div>`}
   ]},

  {id:2,title:"Bonding & Molecular Structure",emoji:"🔗",
   lead:"From electron transfer to electron sharing — understand how and why atoms bond, how to visualize molecular geometry, and how structure drives properties.",
   topics:["Ionic & covalent bonding","Lewis structures","Formal charge","VSEPR","Hybridization","IMFs","Lattice energy"],
   sublessons:[
    {id:"2.1",title:"Types of Chemical Bonds",
     content:`
     <p class="intro-text">Bonding arises from the lowering of potential energy when atoms share or transfer electrons. The type of bond depends on the <strong>electronegativity difference</strong> between atoms — how unequally electrons are shared.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Electronegativity (EN)</div><div class="term-body">A measure of how strongly an atom attracts shared electrons in a bond. Pauling scale: F = 4.0 (highest). Increases up and to the right on the periodic table. <div class="term-eq">ΔEN = |EN_A − EN_B|</div>ΔEN &lt; 0.4: nonpolar covalent · ΔEN 0.4–1.7: polar covalent · ΔEN &gt; 1.7: ionic (general rule)</div></div></div>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">🔵</div><h3>Ionic Bonding</h3><p>Complete transfer of electrons from metal to nonmetal. Forms discrete cations (+) and anions (−). Crystal lattice structure. Properties: high melting point, brittle, conducts when dissolved/melted, hard. Lattice energy measures ionic bond strength.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">🤝</div><h3>Covalent Bonding</h3><p>Sharing of electron pairs between nonmetals. Can be polar (unequal sharing, ΔEN &gt; 0) or nonpolar (equal sharing). Single, double, triple bonds possible. Higher bond order → shorter, stronger bond.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">🏗️</div><h3>Metallic Bonding</h3><p>Metal cations surrounded by a "sea" of delocalized electrons. Electrons not bound to specific atoms — free to flow. Explains: electrical conductivity, thermal conductivity, malleability, luster.</p></div>
     </div>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(251,191,36,.12)">📊</div><div class="sec-title">Bond Properties</div></div>
       <div class="tbl-wrap"><table><thead><tr><th>Bond Type</th><th>Bond Order</th><th>Bond Length</th><th>Bond Energy</th><th>σ and π bonds</th></tr></thead>
       <tbody>
         <tr><td>Single</td><td>1</td><td>Longest</td><td>Weakest</td><td>1 σ bond</td></tr>
         <tr><td>Double</td><td>2</td><td>Medium</td><td>Medium</td><td>1 σ + 1 π bond</td></tr>
         <tr><td>Triple</td><td>3</td><td>Shortest</td><td>Strongest</td><td>1 σ + 2 π bonds</td></tr>
       </tbody></table></div>
     </div>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">σ (sigma) and π (pi) Bonds</div><div class="term-body"><strong>σ bond:</strong> end-to-end orbital overlap along the internuclear axis. The first bond between atoms is always a σ bond. Free rotation possible around a σ bond. <br><strong>π bond:</strong> side-by-side overlap of parallel p orbitals above and below the internuclear axis. The second and third bonds are π bonds. No free rotation around π bonds (explains cis/trans isomers). <div class="term-eq">Single = 1σ &nbsp;· Double = 1σ+1π &nbsp;· Triple = 1σ+2π</div></div></div></div>
     <div class="hbox hb-am"><h4>⚠ Lattice Energy</h4><ul>
       <li>Energy released when gaseous ions come together to form a crystal lattice</li>
       <li>Always negative (exothermic) — formation of lattice is stabilizing</li>
       <li>Lattice energy ∝ |charge₊ × charge₋| / (r₊ + r₋) — bigger charges, smaller radii → stronger lattice</li>
       <li>MgO has much higher lattice energy than NaF (charges: 2+/2− vs 1+/1−)</li>
       <li>Measured via Born-Haber cycle (uses Hess's Law applied to ionic compound formation)</li>
     </ul></div>`},
    {id:"2.2",title:"Lewis Structures & Formal Charge",
     content:`
     <p class="intro-text">A Lewis structure shows the arrangement of valence electrons in a molecule or ion using dots and lines. Mastering them is essential — VSEPR, hybridization, and predicting reactivity all depend on correct Lewis structures.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Valence Electrons</div><div class="term-body">Electrons in the outermost shell (highest n). The only electrons involved in bonding. For main group elements, the number = group number (e.g., O in Group 16 has 6 valence electrons). For Lewis structures, sum all valence electrons from all atoms. <div class="term-eq">total e⁻ = Σ(valence e⁻ per atom) ± charge</div>Add 1 e⁻ per unit of negative charge. Subtract 1 e⁻ per unit of positive charge.</div></div></div>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(52,211,153,.12)">✏️</div><div class="sec-title">Drawing Lewis Structures — Step by Step</div></div>
       <div class="steps">
         <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Count total valence electrons</h4><p>Sum all valence electrons. Adjust for charge (+charge → subtract e⁻, −charge → add e⁻). This is your total electron "budget."</p></div></div>
         <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Place central atom, connect with single bonds</h4><p>Least electronegative atom goes in center (except H always terminal). Single bond = 2 electrons. Subtract 2 for each bond drawn.</p></div></div>
         <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Complete octets on terminal atoms (except H)</h4><p>H needs only 2 electrons. All other atoms need 8. Fill lone pairs on outer atoms first, using remaining electrons from your budget.</p></div></div>
         <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Give remaining electrons to central atom</h4><p>Place any remaining electrons as lone pairs on the central atom.</p></div></div>
         <div class="step"><div class="step-n">5</div><div class="step-body"><h4>Check central atom's octet — form multiple bonds if needed</h4><p>If central atom has less than 8 electrons, convert lone pairs from adjacent atoms into double or triple bonds. Check formal charges to find the best structure.</p></div></div>
       </div>
     </div>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(167,139,250,.12)">🔢</div><div class="sec-title">Formal Charge</div></div>
       <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Formal Charge (FC)</div><div class="term-body">A bookkeeping tool to identify the most realistic Lewis structure. <div class="term-eq">FC = (valence e⁻) − (lone pair e⁻) − ½(bonding e⁻)</div>Best Lewis structure: (1) all FC = 0, or (2) smallest FC values, or (3) negative FC on most electronegative atom. The sum of all formal charges must equal the overall charge of the molecule/ion.</div></div></div>
       <div class="card-grid">
         <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">🌊</div><h3>Resonance Structures</h3><p>When multiple valid Lewis structures exist with different bond placements but same atom arrangement, the molecule is a <strong>hybrid</strong> of all. Neither structure alone is correct — electrons are delocalized. Benzene (C₆H₆) and ozone (O₃) are classic examples.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--pu)"></div><div class="card-icon">⊕</div><h3>Expanded Octets</h3><p>Elements in Period 3 and beyond (S, P, Cl, Xe, etc.) can hold more than 8 electrons using d orbitals. Examples: SF₆ (12e⁻ around S), PCl₅ (10e⁻ around P), XeF₄ (12e⁻ around Xe). Period 2 elements (C, N, O, F) CANNOT expand octets.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--re)"></div><div class="card-icon">⚠️</div><h3>Exceptions to Octet Rule</h3><p>Electron deficient: BH₃, BF₃ (6e⁻ around B) — incomplete octet. Odd-electron species (radicals): NO, NO₂ (one unpaired electron). Both are stable despite not following the octet rule strictly.</p></div>
       </div>
     </div>`},
    {id:"2.3",title:"VSEPR & Molecular Geometry",diagram:"vseprGeometry",
     content:`
     <p class="intro-text">VSEPR (Valence Shell Electron Pair Repulsion) theory predicts molecular geometry based on a simple idea: electron domains (bonding pairs and lone pairs) repel each other and arrange to minimize repulsion.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Electron Domain</div><div class="term-body">Any region of electron density around the central atom: single bond, double bond, triple bond, or lone pair. Each counts as ONE domain regardless of bond order. <div class="term-eq">Domains = σ bonds + lone pairs (count π bonds as part of their σ bond)</div></div></div></div>
     <div class="hbox hb-bl"><h4>💡 Repulsion Order (Strongest → Weakest)</h4><ul>
       <li><strong>Lone pair – Lone pair</strong> repulsion: strongest (lone pairs occupy more space)</li>
       <li><strong>Lone pair – Bonding pair</strong> repulsion: medium</li>
       <li><strong>Bonding pair – Bonding pair</strong> repulsion: weakest</li>
       <li>→ Lone pairs compress bond angles below ideal geometry</li>
       <li>→ Water (2 lone pairs): bent with ~104.5°, not the tetrahedral ideal of 109.5°</li>
     </ul></div>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(56,217,217,.12)">↔️</div><div class="sec-title">Molecular Polarity</div></div>
       <p class="intro-text">A molecule is polar if it has <strong>both</strong> polar bonds AND an <strong>asymmetric</strong> geometry so that bond dipoles don't cancel.</p>
       <div class="card-grid">
         <div class="card"><div class="card-accent" style="background:var(--re)"></div><div class="card-icon">💧</div><h3>Polar Molecules</h3><p>Bond dipoles do not cancel. Has a net dipole moment (μ ≠ 0). Examples: H₂O (bent — dipoles reinforce), NH₃ (trigonal pyramidal — lone pair makes asymmetric), HCl (linear but different atoms).</p></div>
         <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">⚖️</div><h3>Nonpolar Molecules</h3><p>Either all bonds are nonpolar, OR polar bonds cancel due to symmetric geometry. CO₂: two polar C=O bonds, but linear → cancel. CCl₄: polar bonds, but tetrahedral → cancel. BF₃: trigonal planar → cancel.</p></div>
       </div>
       <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Dipole Moment (μ)</div><div class="term-body">A vector quantity representing the degree of charge separation in a molecule. Measured in debye (D). Points from δ+ to δ− in chemistry convention. <div class="term-eq">μ = Q × r</div>Q = charge separated, r = distance. Larger EN difference and/or longer bond → larger μ.</div></div></div>
     </div>`},
    {id:"2.4",title:"Hybridization",
     content:`
     <p class="intro-text">Hybridization explains observed molecular geometries using the quantum mechanical model. Atomic orbitals on the central atom "mix" to form new <strong>hybrid orbitals</strong> with geometrically equivalent shapes and energies.</p>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(167,139,250,.12)">🏗️</div><div class="sec-title">Hybridization Types</div></div>
       <div class="card-grid">
         <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">═</div><h3>sp hybridization</h3><p>1 s + 1 p → 2 sp orbitals. Linear geometry, 180°. Remaining 2 p orbitals perpendicular → form 2 π bonds. Examples: BeCl₂, CO₂, HC≡CH (acetylene), any triple bond or sp-hybridized C.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">△</div><h3>sp² hybridization</h3><p>1 s + 2 p → 3 sp² orbitals. Trigonal planar, 120°. 1 remaining p orbital → 1 π bond. Examples: BF₃, C₂H₄ (ethylene), benzene, any C in a double bond or aromatic ring.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--gr)"></div><div class="card-icon">◆</div><h3>sp³ hybridization</h3><p>1 s + 3 p → 4 sp³ orbitals. Tetrahedral, 109.5°. No unhybridized p orbitals left. Examples: CH₄, NH₃, H₂O, any C with all single bonds. Lone pairs occupy sp³ orbitals in NH₃ and H₂O.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">⬡</div><h3>sp³d and sp³d²</h3><p>sp³d: 1s+3p+1d → 5 orbitals, trigonal bipyramidal, 90°/120°. sp³d²: 1s+3p+2d → 6 orbitals, octahedral, 90°. Only Period 3+ elements (have accessible d orbitals). PCl₅, SF₆.</p></div>
       </div>
     </div>
     <div class="hbox hb-cy"><h4>🔍 Quick Hybridization Method</h4><ul>
       <li>Count electron domains (σ bonds + lone pairs) on central atom</li>
       <li>2 domains → sp · 3 domains → sp² · 4 domains → sp³ · 5 domains → sp³d · 6 domains → sp³d²</li>
       <li>Double and triple bonds count as ONE domain each (each bond has only one σ)</li>
       <li>Example: SO₃ — S has 3 σ bonds to O (using double bond resonance) → sp² hybridized, 120°</li>
     </ul></div>`},
    {id:"2.5",title:"Intermolecular Forces",
     content:`
     <p class="intro-text">Intermolecular forces (IMFs) are attractions <strong>between</strong> molecules (not within them — those are intramolecular bonds). IMFs determine physical properties: boiling point, melting point, viscosity, surface tension, solubility.</p>
     <div class="section">
       <div class="sec-hdr"><div class="sec-icon" style="background:rgba(248,113,113,.12)">🧲</div><div class="sec-title">Types of IMF (Strongest to Weakest)</div></div>
       <div class="card-grid">
         <div class="card"><div class="card-accent" style="background:var(--re)"></div><div class="card-icon">⊕</div><h3>Ion-Dipole</h3><p>Between an ion and a polar molecule. ~10–50 kJ/mol. Strongest IMF. Critical for dissolving ionic compounds in water. The attraction between Na⁺ and H₂O molecules (via oxygen lone pairs) releases enough energy to break apart the NaCl lattice.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--or)"></div><div class="card-icon">💧</div><h3>Hydrogen Bonding</h3><p>H bonded to F, O, or N — interacts with a lone pair on another F, O, or N. ~10–40 kJ/mol. Not a real "bond" — it's a very strong dipole interaction. Explains: water's unusually high boiling point (100°C vs −60°C expected for its mass), DNA base pairing, protein folding, high surface tension of water.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">↕️</div><h3>Dipole-Dipole</h3><p>Between permanent dipoles in polar molecules. ~2–20 kJ/mol. Positive end of one attracts negative end of neighbor. Example: HCl molecules align δ+H → Clδ− ... δ+H → Clδ−. Requires a net dipole moment.</p></div>
         <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">🌐</div><h3>London Dispersion Forces (LDF)</h3><p>Temporary dipoles in ALL molecules. ~0.1–40 kJ/mol. Arise from instantaneous electron fluctuations creating momentary dipoles that induce dipoles in neighboring molecules. Strength ∝ molar mass (more electrons = more polarizable). Surface area matters: longer, straighter molecules have stronger LDF than branched ones (pentane bp 36°C vs neopentane bp 9°C).</p></div>
       </div>
     </div>
     <div class="hbox hb-gr"><h4>✓ Comparing Boiling Points</h4><ul>
       <li><strong>Same functional group/shape:</strong> higher molar mass → stronger LDF → higher bp</li>
       <li><strong>Polar vs nonpolar (similar mass):</strong> polar has dipole-dipole → higher bp</li>
       <li><strong>H-bonding:</strong> dramatically raises bp — H₂O (100°C) vs H₂S (−60°C)</li>
       <li><strong>Branching:</strong> decreases surface area → weaker LDF → lower bp vs straight-chain isomer</li>
     </ul></div>`}
   ]},

  {id:3,title:"Stoichiometry & Chemical Reactions",emoji:"⚗️",
   lead:"The quantitative language of chemistry — from mole calculations to reaction types, limiting reagents, and net ionic equations.",
   topics:["Mole concept","Balancing equations","Limiting reagents","Percent yield","Reaction types","Net ionic equations"],
   sublessons:[
    {id:"3.1",title:"The Mole Concept",
     content:`
     <p class="intro-text">The mole is the bridge between the atomic scale and laboratory scale. Because atoms have no directly measurable mass, chemists count them in groups of 6.022×10²³ — one mole. This connects atomic mass units (amu) to grams.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Avogadro's Number (Nₐ)</div><div class="term-body">6.022 × 10²³ particles per mole. Defined by IUPAC as exactly this value since 2019. Originally measured by multiple methods (electrolysis, X-ray diffraction, etc.) as the number of atoms in exactly 12 grams of carbon-12. <div class="term-eq">1 mol = 6.022 × 10²³ particles</div></div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">n = m / M</div><div class="fdesc"><strong>Moles from mass.</strong> n = moles (mol), m = mass (g), M = molar mass (g/mol). Molar mass = sum of atomic masses from periodic table.</div></div>
       <div class="f-row"><div class="feq">n = N / Nₐ</div><div class="fdesc"><strong>Moles from particle count.</strong> N = number of particles, Nₐ = 6.022×10²³. Use to convert atoms/molecules ↔ moles.</div></div>
       <div class="f-row"><div class="feq">n = C × V(L)</div><div class="fdesc"><strong>Moles from concentration.</strong> C = molarity (mol/L), V = volume in liters. Essential for solution stoichiometry.</div></div>
       <div class="f-row"><div class="feq">n = PV / RT</div><div class="fdesc"><strong>Moles of gas.</strong> From ideal gas law. R = 0.08206 L·atm/mol·K. T in Kelvin. STP: 1 mol = 22.4 L.</div></div>
     </div>
     <div class="hbox hb-bl"><h4>💡 Molar Mass Calculation</h4><ul>
       <li>Sum the atomic masses of all atoms (from periodic table) in the chemical formula</li>
       <li>H₂SO₄: 2(1.008) + 32.07 + 4(16.00) = 98.09 g/mol</li>
       <li>Ca(NO₃)₂: 40.08 + 2(14.01 + 3×16.00) = 40.08 + 2(46.01) = 132.10 g/mol</li>
       <li>Hydrates: include the water molecules in the formula mass</li>
     </ul></div>`},
    {id:"3.2",title:"Reaction Types & Balancing",
     content:`
     <p class="intro-text">A balanced chemical equation has equal numbers of each type of atom on both sides. The coefficients give the mole ratios for stoichiometry calculations. Understanding reaction types lets you predict products before running the experiment.</p>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(52,211,153,.12)">🔥</div><div class="sec-title">Reaction Types</div></div>
     <div class="card-grid">
       <div class="card"><div class="card-icon">➕</div><h3>Synthesis (Combination)</h3><p>A + B → AB. Two or more substances combine to form one product. Example: N₂ + 3H₂ → 2NH₃ (Haber process). Often exothermic. Common in industrial chemistry.</p></div>
       <div class="card"><div class="card-icon">✂️</div><h3>Decomposition</h3><p>AB → A + B. One compound breaks into simpler products. Requires energy input (heat, light, electricity). Example: 2H₂O₂ → 2H₂O + O₂. 2KClO₃ → 2KCl + 3O₂ (Δ).</p></div>
       <div class="card"><div class="card-icon">🔄</div><h3>Single Displacement</h3><p>A + BC → AC + B. More reactive element displaces less reactive one. Use <strong>activity series</strong>: metals higher on the list displace those below. Example: Zn + 2HCl → ZnCl₂ + H₂↑.</p></div>
       <div class="card"><div class="card-icon">↔️</div><h3>Double Displacement (Metathesis)</h3><p>AB + CD → AD + CB. Ions swap partners. Reaction occurs if: precipitate forms, gas escapes, or water (weak electrolyte) forms. Use solubility rules to identify precipitate.</p></div>
       <div class="card"><div class="card-icon">🔥</div><h3>Combustion</h3><p>Fuel + O₂ → products. Complete: hydrocarbons → CO₂ + H₂O. Incomplete: CO (toxic) or C(s) also produced. Always exothermic. Balance in order: C, H, then O last.</p></div>
       <div class="card"><div class="card-icon">⚡</div><h3>Oxidation-Reduction (Redox)</h3><p>Electron transfer between species. OIL RIG: Oxidation Is Loss (of electrons), Reduction Is Gain. Oxidizing agent gets reduced; reducing agent gets oxidized. Assign oxidation states to identify which atoms change.</p></div>
     </div></div>
     <div class="hbox hb-am"><h4>⚠ Balancing Redox by Half-Reactions (Acidic Solution)</h4><ul>
       <li>1. Split into oxidation and reduction half-reactions</li>
       <li>2. Balance atoms other than O and H</li>
       <li>3. Add H₂O to balance O atoms</li>
       <li>4. Add H⁺ to balance H atoms</li>
       <li>5. Add e⁻ to balance charge</li>
       <li>6. Multiply so electrons in both half-reactions are equal; then add and cancel</li>
       <li>Basic solution: complete as acidic, then add OH⁻ to both sides to neutralize H⁺</li>
     </ul></div>`},
    {id:"3.3",title:"Limiting Reagents & Yield",
     content:`
     <p class="intro-text">In almost every real reaction, one reactant runs out before the others — the <strong>limiting reagent</strong>. It determines the maximum amount of product that can form (theoretical yield). Understanding this is essential for calculating percent yield in any experiment.</p>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(52,211,153,.12)">⚙️</div><div class="sec-title">Limiting Reagent — Complete Method</div></div>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Balance the equation first</h4><p>Every stoichiometry calculation requires correct mole ratios from a balanced equation.</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Convert all reactants to moles</h4><p>Use n = m/M (from grams) or n = C×V (from solution). Gases: use n = PV/RT.</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Find the limiting reagent</h4><p>Divide moles of each reactant by its stoichiometric coefficient. The reactant with the SMALLEST value is the limiting reagent.</p></div></div>
       <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Calculate theoretical yield from LR</h4><p>Use mole ratio: mol LR × (coeff product / coeff LR) = mol product. Convert to grams: mol × molar mass.</p></div></div>
       <div class="step"><div class="step-n">5</div><div class="step-body"><h4>Calculate percent yield</h4><p>% yield = (actual yield / theoretical yield) × 100. Actual yield is measured experimentally. Always ≤ 100% (in theory).</p></div></div>
     </div>
     <div class="hbox hb-bl"><h4>💡 Empirical & Molecular Formulas</h4><ul>
       <li><strong>Empirical formula:</strong> simplest whole-number ratio of atoms. Obtained from percent composition.</li>
       <li>Steps: % → assume 100g → grams → divide by molar mass → moles → divide by smallest → whole number ratio</li>
       <li><strong>Molecular formula:</strong> actual atom count. Molecular formula = (empirical formula) × n</li>
       <li>n = molar mass / empirical formula mass (molar mass usually given from mass spectrometry)</li>
     </ul></div>`},
    {id:"3.4",title:"Net Ionic Equations",
     content:`
     <p class="intro-text">Net ionic equations reveal the actual chemical change occurring in solution by removing spectator ions — those that appear unchanged on both sides and don't participate in the reaction.</p>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Write the full molecular equation (balanced)</h4><p>Example: NaCl(aq) + AgNO₃(aq) → AgCl(s) + NaNO₃(aq)</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Write the complete ionic equation</h4><p>Dissociate all strong electrolytes into their ions. Leave weak electrolytes, precipitates, gases, and pure solids/liquids intact. Strong electrolytes = strong acids, strong bases, and most ionic compounds (check solubility rules).</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Cancel spectator ions</h4><p>Ions that appear identically on both sides are spectators — they don't react. Cross them out.</p></div></div>
       <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Write the net ionic equation</h4><p>What remains is the net ionic equation. For AgCl precipitation: Ag⁺(aq) + Cl⁻(aq) → AgCl(s)</p></div></div>
     </div>
     <div class="hbox hb-gr"><h4>✓ Solubility Rules — Must Memorize</h4><ul>
       <li>Always soluble: NO₃⁻, ClO₄⁻, CH₃COO⁻, Group 1 (Li⁺,Na⁺,K⁺,Rb⁺,Cs⁺), NH₄⁺</li>
       <li>Usually soluble: Cl⁻, Br⁻, I⁻ — except with Ag⁺, Pb²⁺, Hg₂²⁺</li>
       <li>Usually soluble: SO₄²⁻ — except BaSO₄, PbSO₄, CaSO₄, Ag₂SO₄ (slightly soluble)</li>
       <li>Usually insoluble: CO₃²⁻, PO₄³⁻, CrO₄²⁻, S²⁻, OH⁻ — except Group 1 + NH₄⁺, and Ca²⁺/Sr²⁺/Ba²⁺ hydroxides</li>
     </ul></div>`}
   ]},

  {id:4,title:"Gases",emoji:"💨",
   lead:"Model gas behavior from Boyle's Law to kinetic theory and real gas corrections. Understand the molecular basis of pressure and temperature.",
   topics:["Gas laws","Ideal gas law","Dalton's law","KMT","Maxwell-Boltzmann","Real gases"],
   sublessons:[
    {id:"4.1",title:"The Gas Laws",
     content:`
     <p class="intro-text">Before the ideal gas law, chemists discovered individual relationships between P, V, n, and T. Each is a special case of PV = nRT where two variables are held constant.</p>
     <div class="formula-list">
       <div class="f-row"><div class="feq">P₁V₁ = P₂V₂</div><div class="fdesc"><strong>Boyle's Law.</strong> Constant n, T. Pressure and volume are inversely proportional. Compress a gas → pressure rises. Used for: syringe problems, pressure-volume work.</div></div>
       <div class="f-row"><div class="feq">V₁/T₁ = V₂/T₂</div><div class="fdesc"><strong>Charles's Law.</strong> Constant n, P. Volume and temperature (in Kelvin!) are directly proportional. Heating a gas at constant pressure → it expands. T must ALWAYS be in Kelvin.</div></div>
       <div class="f-row"><div class="feq">P₁/T₁ = P₂/T₂</div><div class="fdesc"><strong>Gay-Lussac's Law.</strong> Constant n, V. Pressure and temperature directly proportional. Heating a closed container (rigid) → pressure rises. Used for: tire pressure, autoclave problems.</div></div>
       <div class="f-row"><div class="feq">P₁V₁/T₁ = P₂V₂/T₂</div><div class="fdesc"><strong>Combined Gas Law.</strong> Combines all three. Use when n is constant but P, V, T change. Drop any variable that stays constant.</div></div>
       <div class="f-row"><div class="feq">V₁/n₁ = V₂/n₂</div><div class="fdesc"><strong>Avogadro's Law.</strong> Constant P, T. Equal volumes of all gases (at same P, T) contain equal numbers of moles. At STP: 1 mol = 22.414 L (molar volume).</div></div>
     </div>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">STP vs Standard State</div><div class="term-body">STP (Standard Temperature and Pressure): <strong>0°C (273.15 K) and 1 atm</strong>. At STP: 1 mol ideal gas = 22.4 L. Note: older definition used 1 atm; IUPAC now defines STP as 0°C and 100 kPa (1 bar), giving 22.7 L/mol. Know both for exams — most USNCO problems use the 22.4 L/mol value. <div class="term-eq">Standard state (thermodynamics): 25°C (298 K), 1 atm — different from STP!</div></div></div></div>`},
    {id:"4.2",title:"Ideal Gas Law & Dalton's Law",
     content:`
     <div class="formula-list">
       <div class="f-row"><div class="feq">PV = nRT</div><div class="fdesc"><strong>Ideal Gas Law.</strong> R = 0.08206 L·atm/mol·K or 8.314 J/mol·K. Use 0.08206 for PV=nRT problems. Use 8.314 when energy is involved (KE, Arrhenius). T always in Kelvin: K = °C + 273.15.</div></div>
       <div class="f-row"><div class="feq">Pₜₒₜₐₗ = P₁ + P₂ + P₃ + …</div><div class="fdesc"><strong>Dalton's Law of Partial Pressures.</strong> Each gas exerts pressure independently. Total pressure = sum of partial pressures. Valid because ideal gas molecules don't interact.</div></div>
       <div class="f-row"><div class="feq">Pᵢ = χᵢ × Pₜₒₜₐₗ</div><div class="fdesc"><strong>Partial pressure from mole fraction.</strong> χᵢ (chi) = moles of gas i / total moles. Dimensionless. Useful for gas mixtures and collecting gases over water.</div></div>
       <div class="f-row"><div class="feq">P_gas = P_total − P_water</div><div class="fdesc"><strong>Collecting gas over water.</strong> Water vapor is always present. Subtract water's vapor pressure (temperature-dependent, given in tables) to get the pure gas pressure.</div></div>
       <div class="f-row"><div class="feq">d = PM / RT</div><div class="fdesc"><strong>Gas density.</strong> d = density (g/L), M = molar mass (g/mol). Higher molar mass or pressure → denser gas. Useful for identifying unknown gases from density measurements.</div></div>
     </div>
     <div class="hbox hb-cy"><h4>🔵 Unit Conversions to Know</h4><ul>
       <li>1 atm = 101.325 kPa = 760 mmHg = 760 torr = 14.696 psi</li>
       <li>1 bar = 100 kPa ≈ 0.987 atm (nearly identical to 1 atm)</li>
       <li>T(K) = T(°C) + 273.15 — ALWAYS convert before using in gas equations</li>
       <li>R = 0.08206 L·atm/mol·K — use this with pressures in atm, volumes in liters</li>
     </ul></div>`},
    {id:"4.3",title:"Kinetic Molecular Theory",diagram:"maxwellBoltzmann",
     content:`
     <p class="intro-text">Kinetic Molecular Theory (KMT) explains WHY the gas laws work by describing the microscopic behavior of gas particles. It makes 5 simplifying assumptions about ideal gases.</p>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(251,191,36,.12)">⚡</div><div class="sec-title">The 5 KMT Postulates</div></div>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Negligible particle volume</h4><p>Gas particles are so tiny relative to the space between them that their own volume is negligible. Mostly empty space. This is why gases are highly compressible.</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Constant random motion</h4><p>Particles move in straight lines at constant speeds until they collide. All directions are equally probable. No preferred direction of motion.</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>No intermolecular forces</h4><p>No attractions or repulsions between particles. Between collisions, particles move completely freely. This is the key "ideal" assumption that breaks down for real gases.</p></div></div>
       <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Elastic collisions</h4><p>All collisions (particle-particle and particle-wall) are perfectly elastic — total kinetic energy is conserved. No energy is lost to heat or sound. Individual particles can speed up or slow down after collisions.</p></div></div>
       <div class="step"><div class="step-n">5</div><div class="step-body"><h4>KE proportional to T</h4><p>Average kinetic energy is directly proportional to absolute temperature: KE_avg = (3/2)RT per mole. This is the microscopic definition of temperature. ALL gases at the same temperature have the same average KE, regardless of molar mass.</p></div></div>
     </div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">KE_avg = (3/2)RT</div><div class="fdesc"><strong>Average molar kinetic energy.</strong> R = 8.314 J/mol·K (use this R — energy units!). Depends ONLY on temperature. H₂ and UF₆ have the same average KE at the same T.</div></div>
       <div class="f-row"><div class="feq">u_rms = √(3RT/M)</div><div class="fdesc"><strong>Root-mean-square speed.</strong> M = molar mass in kg/mol! R = 8.314 J/mol·K. Heavier molecules are slower. At 25°C: N₂ ≈ 515 m/s, H₂ ≈ 1920 m/s.</div></div>
       <div class="f-row"><div class="feq">v_mp = √(2RT/M)</div><div class="fdesc"><strong>Most probable speed</strong> (peak of Maxwell-Boltzmann distribution). v_mp &lt; v_avg &lt; v_rms (the distribution is slightly right-skewed).</div></div>
       <div class="f-row"><div class="feq">r₁/r₂ = √(M₂/M₁)</div><div class="fdesc"><strong>Graham's Law of Effusion.</strong> Rate of effusion inversely proportional to √M. Lighter gases effuse faster. At same T and P.</div></div>
     </div>`},
    {id:"4.4",title:"Real Gases & van der Waals",
     content:`
     <p class="intro-text">Real gases deviate from ideal behavior — especially at high pressures and low temperatures — because KMT assumptions break down: molecules do have volume, and they do attract each other.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Compressibility Factor (Z)</div><div class="term-body">A measure of how much a real gas deviates from ideal behavior. <div class="term-eq">Z = PV / nRT</div>For an ideal gas: Z = 1 always. Z &gt; 1: repulsions dominate (high P — molecules forced together). Z &lt; 1: attractions dominate (moderate P, low T — molecules attract each other, reducing pressure below ideal).</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">(P + an²/V²)(V − nb) = nRT</div><div class="fdesc"><strong>van der Waals equation.</strong> <strong>a</strong> = intermolecular attraction correction (adds pressure back that was lost to attractions). <strong>b</strong> = molecular volume correction (subtracts the actual volume the molecules occupy from V). Larger a → stronger IMFs. Larger b → larger molecular volume.</div></div>
     </div>
     <div class="tbl-wrap"><table><thead><tr><th>Condition</th><th>Behavior</th><th>Which Term Dominates</th><th>Z</th></tr></thead>
     <tbody>
       <tr><td>Low P, high T</td><td>Nearly ideal</td><td>Neither</td><td>≈ 1</td></tr>
       <tr><td>High P (any T)</td><td>Z &gt; 1 (above ideal)</td><td>b term (volume)</td><td>&gt; 1</td></tr>
       <tr><td>Moderate P, low T</td><td>Z &lt; 1 (below ideal)</td><td>a term (attractions)</td><td>&lt; 1</td></tr>
     </tbody></table></div>
     <div class="hbox hb-am"><h4>⚠ USNCO Tips</h4><ul>
       <li>Noble gases have very small a and b (weakest IMFs, smallest atoms). He ≈ ideal at most conditions.</li>
       <li>Polar gases (HF, H₂O vapor) have large a — strong attractions. High b = big molecules (SF₆, C₆H₁₄)</li>
       <li>USNCO sometimes asks to compare gases' behavior — think about which of a or b dominates for the conditions given</li>
     </ul></div>`}
   ]},

  {id:5,title:"Thermochemistry",emoji:"🔥",
   lead:"Quantify heat flow in chemical reactions. From calorimetry to Hess's law and heating curves — understand energy changes at constant pressure.",
   topics:["Enthalpy","Calorimetry","Hess's law","Formation enthalpies","Bond energies","Heating curves"],
   sublessons:[
    {id:"5.1",title:"Enthalpy & Calorimetry",
     content:`
     <p class="intro-text">Enthalpy (H) is a thermodynamic state function that equals the heat exchanged at constant pressure. Since most lab reactions run at constant atmospheric pressure, ΔH is the most practical measure of "heat of reaction."</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Enthalpy (H)</div><div class="term-body">Defined as H = U + PV, where U = internal energy, P = pressure, V = volume. At constant pressure (most lab conditions): <div class="term-eq">ΔH = q_p (heat at constant pressure)</div>ΔH &lt; 0 → exothermic (releases heat, system loses energy). ΔH &gt; 0 → endothermic (absorbs heat, system gains energy). H is a state function — ΔH depends only on initial and final state, not the path taken.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">q = mcΔT</div><div class="fdesc"><strong>Heat transfer.</strong> m = mass (g), c = specific heat capacity (J/g·K), ΔT = T_final − T_initial. For dilute aqueous solutions: assume c ≈ 4.184 J/g·K, density ≈ 1.00 g/mL.</div></div>
       <div class="f-row"><div class="feq">q_rxn = −q_calorimeter</div><div class="fdesc"><strong>Conservation of energy.</strong> Heat from reaction = heat absorbed by calorimeter/solution. Sign flip. Exothermic rxn heats solution: q_soln &gt; 0, q_rxn &lt; 0.</div></div>
       <div class="f-row"><div class="feq">q = nΔH_rxn</div><div class="fdesc"><strong>Molar enthalpy.</strong> n = moles of substance reacting per the written equation. Converts ΔH per mole to actual heat evolved in an experiment.</div></div>
       <div class="f-row"><div class="feq">q_bomb = C_cal × ΔT</div><div class="fdesc"><strong>Bomb calorimeter.</strong> C_cal = heat capacity of the entire calorimeter apparatus (given, J/°C). Measures ΔE (constant volume). Correction: ΔH = ΔE + Δn_gas × RT.</div></div>
     </div>
     <div class="tbl-wrap"><table><thead><tr><th>Calorimeter Type</th><th>Constant</th><th>Measures</th><th>Use for</th></tr></thead>
     <tbody>
       <tr><td>Coffee-cup (constant P)</td><td>Pressure</td><td>q_p ≈ ΔH</td><td>Acid-base, dissolution, any aqueous rxn</td></tr>
       <tr><td>Bomb (constant V)</td><td>Volume</td><td>q_v = ΔU</td><td>Combustion, high-energy reactions</td></tr>
     </tbody></table></div>`},
    {id:"5.2",title:"Hess's Law & ΔH°f",
     content:`
     <p class="intro-text">Hess's Law states that enthalpy is a state function — ΔH for a reaction is the same regardless of how many steps it takes to get there. This lets us calculate ΔH for reactions we can't measure directly.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Standard Enthalpy of Formation (ΔH°f)</div><div class="term-body">The enthalpy change when 1 mol of a compound forms from its elements in their standard states (25°C, 1 atm). The standard state is the most stable form of the element (e.g., O₂(g) not O(g), C(graphite) not C(diamond)). <div class="term-eq">ΔH°f of any element in standard state = 0</div></div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">ΔH°_rxn = Σ ΔH°f(products) − Σ ΔH°f(reactants)</div><div class="fdesc"><strong>Using standard enthalpies.</strong> Multiply each ΔH°f by the stoichiometric coefficient. This uses Hess's Law conceptually: the reaction = formation of products minus "un-formation" of reactants.</div></div>
       <div class="f-row"><div class="feq">ΔH_rxn = Σ BE(bonds broken) − Σ BE(bonds formed)</div><div class="fdesc"><strong>Bond energy method.</strong> Approximate (averages used). Breaking bonds = endothermic (+ sign). Forming bonds = exothermic (−). Only valid for gas-phase reactions. Less accurate than ΔH°f method.</div></div>
     </div>
     <div class="hbox hb-pu"><h4>🗺 Born-Haber Cycle</h4><ul>
       <li>A special application of Hess's Law to calculate <strong>lattice energy</strong> of ionic compounds</li>
       <li>Steps: element(s) → gaseous atoms → gaseous ions → ionic solid</li>
       <li>Uses: sublimation energy, bond dissociation energy, ionization energy, electron affinity, and the unknown lattice energy</li>
       <li>Sum of all ΔH values = ΔH°f of ionic compound (known experimentally)</li>
       <li>Solve algebraically for the lattice energy term</li>
     </ul></div>`},
    {id:"5.3",title:"Heating Curves & Phase Changes",diagram:"heatingCurve",
     content:`
     <p class="intro-text">A heating curve shows temperature vs heat added for a pure substance. The shape reveals phase transitions, latent heat, and specific heats — all governed by intermolecular forces.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Latent Heat (ΔH_phase)</div><div class="term-body">The heat required to change phase at constant temperature and pressure. "Latent" = hidden — energy goes into overcoming IMFs, not raising temperature. <div class="term-eq">q = n × ΔH_fus (melting) &nbsp;or&nbsp; q = n × ΔH_vap (boiling)</div>For water: ΔH_fus = 6.01 kJ/mol at 0°C. ΔH_vap = 40.7 kJ/mol at 100°C. ΔH_vap &gt; ΔH_fus because more IMFs broken going liquid→gas.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">q = mcΔT &nbsp;(sloped regions)</div><div class="fdesc"><strong>Single-phase heating.</strong> Temperature rises. c_ice = 2.09, c_liquid = 4.18, c_steam = 2.01 J/g·K for water. Different phases have different specific heats.</div></div>
       <div class="f-row"><div class="feq">q = n × ΔH_phase &nbsp;(flat regions)</div><div class="fdesc"><strong>Phase transitions.</strong> Temperature constant — all energy breaks or forms IMFs. Steeper plateau = more energy required. ΔH_vap &gt;&gt; ΔH_fus for most substances.</div></div>
     </div>
     <div class="hbox hb-bl"><h4>💡 Clausius-Clapeyron Equation</h4><ul>
       <li>Relates vapor pressure at two temperatures using ΔH_vap:</li>
       <li style="list-style:none"><code style="color:var(--cy);font-family:'JetBrains Mono',monospace">ln(P₂/P₁) = −(ΔH_vap/R) × (1/T₂ − 1/T₁)</code></li>
       <li>R = 8.314 J/mol·K. T in Kelvin. Allows predicting boiling point at different pressures</li>
       <li>Explains why food takes longer to cook at altitude (lower P → lower bp of water)</li>
     </ul></div>`}
   ]},

  {id:6,title:"Solutions & Properties",emoji:"🧪",
   lead:"Master concentration units, colligative properties, and the factors that govern how and how much substances dissolve.",
   topics:["Concentration units","Solubility","Colligative properties","Raoult's law","Factors affecting solubility"],
   sublessons:[
    {id:"6.1",title:"Concentration & Colligative Properties",
     content:`
     <p class="intro-text">Concentration tells us how much solute is in a given amount of solution. Different units are needed for different purposes — molarity for stoichiometry, molality for colligative properties, mole fraction for vapor pressure.</p>
     <div class="tbl-wrap"><table><thead><tr><th>Unit</th><th>Symbol</th><th>Formula</th><th>Temperature Dependent?</th><th>Use</th></tr></thead>
     <tbody>
       <tr><td>Molarity</td><td>M</td><td>mol solute / L solution</td><td>Yes (V changes)</td><td>Stoichiometry, titrations</td></tr>
       <tr><td>Molality</td><td>m</td><td>mol solute / kg solvent</td><td>No</td><td>Colligative properties</td></tr>
       <tr><td>Mass percent</td><td>%</td><td>g solute / g solution × 100</td><td>No</td><td>Commercial reagents, mixtures</td></tr>
       <tr><td>Mole fraction</td><td>χ (chi)</td><td>mol A / mol total</td><td>No</td><td>Raoult's law, partial pressure</td></tr>
       <tr><td>ppm</td><td>ppm</td><td>mg solute / kg solution</td><td>No</td><td>Trace analysis, environmental</td></tr>
     </tbody></table></div>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(56,217,217,.12)">📐</div><div class="sec-title">Colligative Property Formulas</div></div>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Colligative Properties</div><div class="term-body">Properties that depend on the <strong>number of solute particles</strong> (moles), not their chemical identity. Four colligative properties: vapor pressure lowering, boiling point elevation, freezing point depression, osmotic pressure. <div class="term-eq">i = van't Hoff factor = actual moles of particles per mole of solute</div>For nonelectrolytes: i = 1. For NaCl: i ≈ 2. For MgCl₂: i ≈ 3. Theoretical; real i slightly less due to ion pairing.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">ΔT_b = i · K_b · m</div><div class="fdesc"><strong>Boiling point elevation.</strong> K_b(water) = 0.512°C·kg/mol. T_b increases. Normal bp of water (100°C) + ΔT_b = new bp. Never forget i for electrolytes!</div></div>
       <div class="f-row"><div class="feq">ΔT_f = i · K_f · m</div><div class="fdesc"><strong>Freezing point depression.</strong> K_f(water) = 1.86°C·kg/mol. T_f decreases. Why roads are salted: NaCl lowers bp to −3.7°C (in dilute solutions). Why salt water freezes at lower temp.</div></div>
       <div class="f-row"><div class="feq">π = iMRT</div><div class="fdesc"><strong>Osmotic pressure.</strong> π (pi) = osmotic pressure (atm), M = molarity, R = 0.08206, T = Kelvin. Most sensitive colligative property — used to determine molar mass of large molecules (polymers, proteins).</div></div>
       <div class="f-row"><div class="feq">P_A = χ_A · P°_A</div><div class="fdesc"><strong>Raoult's Law.</strong> Vapor pressure of solvent A above a solution equals its mole fraction times its pure vapor pressure P°_A. Adding solute lowers vapor pressure (fewer solvent molecules escape).</div></div>
     </div></div>`},
    {id:"6.2",title:"Solubility & Solution Formation",
     content:`
     <p class="intro-text">Why do some substances dissolve and others don't? The answer lies in thermodynamics and intermolecular forces. A substance dissolves when the interaction between solute and solvent is favorable enough to compensate for disrupting both structures.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Enthalpy of Solution (ΔH_soln)</div><div class="term-body">The enthalpy change when 1 mol of solute dissolves. For ionic compounds: <div class="term-eq">ΔH_soln = ΔH_lattice + ΔH_hydration</div>ΔH_lattice: energy to break apart ionic lattice (+, endothermic). ΔH_hydration: energy released when ions surrounded by water molecules (−, exothermic). If |ΔH_hydration| &gt; |ΔH_lattice|: dissolving is exothermic. If reversed: endothermic (like NH₄NO₃, used in cold packs).</div></div></div>
     <div class="hbox hb-gr"><h4>✓ Factors Affecting Solubility</h4><ul>
       <li><strong>Temperature (solids in liquids):</strong> usually solubility increases with T (dissolution is endothermic). Exception: CaSO₄, Ce₂(SO₄)₃ decrease with T.</li>
       <li><strong>Temperature (gases in liquids):</strong> always decreases with T. Gas molecules escape more easily at higher T. (Why fish die in warm water — less dissolved O₂)</li>
       <li><strong>Pressure (gases):</strong> Henry's Law: C = k_H × P. More pressure → more gas dissolves. (Carbonated drinks: CO₂ dissolved under pressure)</li>
       <li><strong>"Like dissolves like":</strong> polar solvents dissolve polar/ionic solutes. Nonpolar solvents dissolve nonpolar solutes.</li>
     </ul></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">C = k_H × P</div><div class="fdesc"><strong>Henry's Law.</strong> C = concentration of dissolved gas, k_H = Henry's law constant (mol/L·atm, substance-specific), P = partial pressure of gas above solution. Used for gas dissolution in water.</div></div>
       <div class="f-row"><div class="feq">M₁V₁ = M₂V₂</div><div class="fdesc"><strong>Dilution equation.</strong> Moles of solute are conserved upon dilution. M₁V₁ = initial state, M₂V₂ = final (diluted) state. Solve for any unknown.</div></div>
     </div>`}
   ]},

  {id:7,title:"Chemical Equilibrium",emoji:"⚖️",
   lead:"Most reactions don't go to completion — they reach equilibrium. Master K expressions, ICE tables, Le Châtelier's principle, and Ksp.",
   topics:["Kc, Kp","Q and K comparison","ICE tables","Le Chatelier","Ksp","Common ion effect","Complex ions"],
   sublessons:[
    {id:"7.1",title:"Equilibrium Constants",
     content:`
     <p class="intro-text">At equilibrium, forward and reverse reactions occur at equal rates — concentrations stay constant but the reaction hasn't stopped. The equilibrium constant K describes the ratio of products to reactants at this state.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Law of Mass Action</div><div class="term-body">For the reaction aA + bB ⇌ cC + dD at equilibrium: <div class="term-eq">Kc = [C]^c [D]^d / [A]^a [B]^b</div>Pure solids and pure liquids are omitted (their "concentration" is constant). K is dimensionless. Only temperature changes K.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">Kp = Kc(RT)^Δn</div><div class="fdesc"><strong>Kp from Kc.</strong> Δn = moles gas products − moles gas reactants. R = 0.08206 L·atm/mol·K. T in Kelvin. Only gases count in Δn.</div></div>
       <div class="f-row"><div class="feq">Q < K → forward; Q > K → reverse</div><div class="fdesc"><strong>Reaction quotient Q.</strong> Same expression as K, but uses CURRENT concentrations (not equilibrium). Compare Q to K to predict direction of shift to reach equilibrium.</div></div>
       <div class="f-row"><div class="feq">K_overall = K₁ × K₂ × …</div><div class="fdesc"><strong>Coupled equilibria.</strong> When reactions are added, K values multiply. If reversed: K_new = 1/K. If multiplied by n: K_new = K^n.</div></div>
     </div>
     <div class="hbox hb-bl"><h4>💡 Interpreting K Values</h4><ul>
       <li>K >> 1 (e.g. K = 10⁶): equilibrium lies far to the right — essentially complete reaction</li>
       <li>K << 1 (e.g. K = 10⁻⁶): equilibrium lies far to the left — barely any product forms</li>
       <li>K ≈ 1: significant amounts of both reactants and products at equilibrium</li>
       <li>K does NOT tell you about rate — a large K reaction could still be very slow</li>
     </ul></div>`},
    {id:"7.2",title:"ICE Tables & Le Châtelier's Principle",diagram:"iceTables",
     content:`
     <p class="intro-text">ICE tables are the systematic tool for finding equilibrium concentrations from initial conditions and K. Le Châtelier's principle lets you predict qualitatively how a system at equilibrium responds to a disturbance.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Le Châtelier's Principle</div><div class="term-body">When a system at equilibrium is disturbed, it shifts in the direction that <strong>partially counteracts</strong> the disturbance — to re-establish equilibrium. It doesn't fully undo the change — just partially opposes it.</div></div></div>
     <div class="tbl-wrap"><table><thead><tr><th>Stress</th><th>Shift Direction</th><th>Effect on K</th></tr></thead>
     <tbody>
       <tr><td>Add reactant</td><td>→ (forward)</td><td>None</td></tr>
       <tr><td>Remove product</td><td>→ (forward)</td><td>None</td></tr>
       <tr><td>Increase [product]</td><td>← (reverse)</td><td>None</td></tr>
       <tr><td>Increase pressure (decrease volume)</td><td>Toward fewer moles of gas</td><td>None</td></tr>
       <tr><td>Decrease pressure</td><td>Toward more moles of gas</td><td>None</td></tr>
       <tr><td>Increase temperature</td><td>Toward endothermic direction</td><td>Changes K</td></tr>
       <tr><td>Decrease temperature</td><td>Toward exothermic direction</td><td>Changes K</td></tr>
       <tr><td>Add inert gas (constant V)</td><td>No shift</td><td>None</td></tr>
       <tr><td>Add catalyst</td><td>No shift (equilibrium faster)</td><td>None</td></tr>
     </tbody></table></div>
     <div class="hbox hb-am"><h4>⚠ Small-x Approximation</h4><ul>
       <li>If K is very small (&lt; 10⁻³ or so), assume x « [initial]</li>
       <li>Then: Ka ≈ x² / [HA]₀ → x ≈ √(Ka × [HA]₀)</li>
       <li>Verify: if x / [initial] &lt; 5%, approximation is valid</li>
       <li>If not valid: use the quadratic formula instead</li>
     </ul></div>`},
    {id:"7.3",title:"Ksp & Solubility Equilibria",
     content:`
     <p class="intro-text">For sparingly soluble ionic compounds, the equilibrium between the solid and its dissolved ions is described by the solubility product constant K_sp. Understanding K_sp lets you predict when precipitation will occur.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Solubility Product (K_sp)</div><div class="term-body">For dissolution of ionic solid MₘXₙ(s) ⇌ mM^m+(aq) + nX^n−(aq): <div class="term-eq">Ksp = [M^m+]^m [X^n−]^n</div>The solid is omitted. A larger K_sp means more dissolution (more soluble). But K_sp depends on temperature. Do NOT confuse molar solubility (s) with K_sp — they're related but not equal.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">Ksp = (ms)^m (ns)^n</div><div class="fdesc"><strong>Ksp from molar solubility (s).</strong> s = moles of MₘXₙ that dissolve per liter. Example: CaF₂ → Ca²⁺ + 2F⁻. Ksp = (s)(2s)² = 4s³. Solve for s given Ksp.</div></div>
       <div class="f-row"><div class="feq">Q > Ksp → precipitates; Q < Ksp → dissolves</div><div class="fdesc"><strong>Ion product Q.</strong> Calculate Q = [M^m+]^m [X^n−]^n from given concentrations. If Q exceeds Ksp, precipitation occurs until equilibrium.</div></div>
     </div>
     <div class="hbox hb-cy"><h4>🔵 Common Ion Effect & Complex Ion Formation</h4><ul>
       <li><strong>Common ion:</strong> Adding an ion already present in the equilibrium shifts it ← (reverse), reducing solubility. Adding NaCl to AgCl solution: extra Cl⁻ suppresses Ag⁺ solubility.</li>
       <li><strong>Complex ion formation:</strong> Adding ligands (like NH₃, CN⁻) that form stable complexes with the metal ion can dramatically increase solubility by removing M^n+ from solution. K_f (formation constant) describes complex stability.</li>
       <li>AgCl(s) + 2NH₃(aq) → [Ag(NH₃)₂]⁺(aq) + Cl⁻(aq) — complex formation dissolves otherwise insoluble AgCl</li>
     </ul></div>`}
   ]},

  {id:8,title:"Acids & Bases",emoji:"🧫",
   lead:"Master proton transfer, pH calculations, buffers, and titration curves for all acid-base combinations.",
   topics:["Strong vs weak","Ka Kb","pH pOH","Polyprotic","Buffers","Henderson-Hasselbalch","Titrations","Indicators"],
   sublessons:[
    {id:"8.1",title:"Acid-Base Theories & pH",diagram:"phScale",
     content:`
     <p class="intro-text">Acids and bases are defined by three progressively broader theories. Each explains more types of reactions. The Brønsted-Lowry theory is most used in AP/USNCO; Lewis theory broadens the concept to all electron pair chemistry.</p>
     <div class="tbl-wrap"><table><thead><tr><th>Theory</th><th>Acid</th><th>Base</th><th>Scope</th></tr></thead>
     <tbody>
       <tr><td><strong>Arrhenius</strong></td><td>Produces H⁺ in water</td><td>Produces OH⁻ in water</td><td>Aqueous solutions only</td></tr>
       <tr><td><strong>Brønsted-Lowry</strong></td><td>Proton (H⁺) donor</td><td>Proton acceptor</td><td>Any protic solvent</td></tr>
       <tr><td><strong>Lewis</strong></td><td>Electron pair acceptor</td><td>Electron pair donor</td><td>Broadest — all coordination chemistry</td></tr>
     </tbody></table></div>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Conjugate Acid-Base Pairs</div><div class="term-body">When HA donates H⁺, it becomes A⁻ (the conjugate base). When B accepts H⁺, it becomes BH⁺ (the conjugate acid). They differ by exactly one H⁺. <div class="term-eq">Ka × Kb = Kw = 1.0 × 10⁻¹⁴ (at 25°C)</div>Stronger acid → weaker conjugate base (and vice versa). This relationship is critical for calculating buffer pH.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">pH = −log[H⁺] = −log[H₃O⁺]</div><div class="fdesc"><strong>pH definition.</strong> H⁺ and H₃O⁺ used interchangeably. At 25°C: pH + pOH = 14. Kw = [H⁺][OH⁻] = 10⁻¹⁴. Pure water: [H⁺] = [OH⁻] = 10⁻⁷ M, pH = 7.</div></div>
       <div class="f-row"><div class="feq">pKa = −log Ka</div><div class="fdesc"><strong>pKa.</strong> Lower pKa = stronger acid (higher Ka). Acetic acid pKa = 4.74. HF pKa = 3.17. NH₄⁺ pKa = 9.25. Essential for buffer design and determining acid strength.</div></div>
     </div>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--re)"></div><div class="card-icon">⚡</div><h3>6 Strong Acids</h3><p>HCl, HBr, HI, HNO₃, H₂SO₄ (first proton), HClO₄. Fully dissociate in water: [H⁺] = initial [acid]. No equilibrium calculation needed.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">⚡</div><h3>Strong Bases</h3><p>Group 1 hydroxides (LiOH, NaOH, KOH, RbOH, CsOH) and heavy Group 2 (Ca(OH)₂, Sr(OH)₂, Ba(OH)₂). [OH⁻] = initial [base] × stoichiometry.</p></div>
     </div>`},
    {id:"8.2",title:"Weak Acid/Base Calculations",
     content:`
     <p class="intro-text">Weak acids and bases only partially dissociate, establishing an equilibrium. This requires ICE table calculations to find pH. The key insight: for weak acids, approximate [H⁺] using the small-x assumption when Ka is small.</p>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Write the dissociation equilibrium</h4><p>HA ⇌ H⁺ + A⁻ with Ka = [H⁺][A⁻]/[HA]. For weak base B + H₂O ⇌ BH⁺ + OH⁻ with Kb = [BH⁺][OH⁻]/[B].</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Set up ICE table</h4><p>I = initial concentrations, C = change (−x for HA, +x for products), E = equilibrium (0.1−x, x, x).</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Substitute into Ka and solve</h4><p>Ka = x²/(0.1−x). If Ka &lt; 10⁻³: assume x « 0.1 → x ≈ √(Ka × 0.1). Verify x/0.1 &lt; 5% or use quadratic.</p></div></div>
       <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Calculate pH</h4><p>pH = −log(x). For weak base: find x = [OH⁻], pOH = −log[OH⁻], pH = 14 − pOH.</p></div></div>
     </div>
     <div class="hbox hb-pu"><h4>🧪 Polyprotic Acids</h4><ul>
       <li>H₂SO₄: Ka₁ = ∞ (strong), Ka₂ = 0.012. Treat 2nd dissociation separately as weak acid.</li>
       <li>H₃PO₄: Ka₁ = 7.5×10⁻³, Ka₂ = 6.2×10⁻⁸, Ka₃ = 4.8×10⁻¹³</li>
       <li>Ka₁ >> Ka₂ >> Ka₃ — each successive ionization is ~10⁴−10⁵ times harder</li>
       <li>For pH calculations, only Ka₁ contributes significantly (ignore Ka₂, Ka₃)</li>
     </ul></div>`},
    {id:"8.3",title:"Buffers & Titration Curves",diagram:"titrationCurve",
     content:`
     <p class="intro-text">A buffer solution resists changes in pH upon addition of small amounts of acid or base. It contains a weak acid and its conjugate base (or weak base and conjugate acid) in similar concentrations.</p>
     <div class="term-def"><div class="term-icon">📖</div><div><div class="term-name">Henderson-Hasselbalch Equation</div><div class="term-body">Simplified pH calculation for buffer solutions: <div class="term-eq">pH = pKa + log([A⁻]/[HA])</div>Valid when [A⁻]/[HA] is between 0.1 and 10 (i.e., pH within ±1 of pKa). This is the buffer range. Best buffering capacity when [A⁻] = [HA] → pH = pKa exactly.</div></div></div>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Choose the right acid for desired pH</h4><p>Select a weak acid whose pKa is within ±1 of target pH. Acetic acid (pKa 4.74): buffers pH 3.7–5.7. NH₄⁺/NH₃ (pKa 9.25): buffers pH 8.25–10.25.</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Add strong acid to buffer</h4><p>H⁺ + A⁻ → HA. Reduces [A⁻], increases [HA]. Recalculate ratio for new pH with Henderson-Hasselbalch.</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Add strong base to buffer</h4><p>OH⁻ + HA → A⁻ + H₂O. Reduces [HA], increases [A⁻]. Recalculate ratio.</p></div></div>
     </div>
     <div class="hbox hb-re"><h4>🔴 Titration Key Points</h4><ul>
       <li><strong>Strong + Strong:</strong> Equival
