    {id:"1.4",title:"Periodic Trends",diagram:"periodicTrend",diagramArgs:["radius"],
     content:`
     <p class="intro-text">Periodic trends arise from two competing effects: increasing nuclear charge (more protons) and electron shielding (inner electrons partially block nuclear attraction). Their balance defines <strong>effective nuclear charge (Zeff)</strong>.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Effective Nuclear Charge (Zeff)</div><div class="term-body">The net positive charge felt by a valence electron after inner-shell shielding.<div class="term-eq">Zeff &#8776; Z &#8722; &#963;</div>Across a period: Z increases, shielding roughly constant &#8594; Zeff increases &#8594; electrons held more tightly.</div></div></div>
     <div class="tbl-wrap"><table><thead><tr><th>Property</th><th>Across Period &#8594;</th><th>Down Group &#8595;</th><th>Key Reason</th><th>Exception</th></tr></thead>
     <tbody>
       <tr><td><strong>Atomic Radius</strong></td><td>Decreases</td><td>Increases</td><td>Higher Zeff pulls electrons in; more shells add distance</td><td>None major</td></tr>
       <tr><td><strong>Ionization Energy</strong></td><td>Increases</td><td>Decreases</td><td>Higher Zeff &#8594; harder to remove electrons</td><td>B &#60; Be (2p above 2s); O &#60; N (paired 2p repels)</td></tr>
       <tr><td><strong>Electron Affinity</strong></td><td>Generally increases</td><td>Generally decreases</td><td>Higher Zeff attracts extra electron more strongly</td><td>Noble gases (EA &#8776; 0); N lower than C/O</td></tr>
       <tr><td><strong>Electronegativity</strong></td><td>Increases</td><td>Decreases</td><td>Ability to attract shared electrons in a bond</td><td>F = 4.0 (highest); Fr = lowest</td></tr>
     </tbody></table></div>
     <div class="hbox hb-re"><h4>&#128308; IE Exceptions &#8212; Memorize!</h4><ul>
       <li><strong>B &#60; Be:</strong> Boron's 2p electron is higher energy (easier to remove) than Beryllium's 2s</li>
       <li><strong>O &#60; N:</strong> Oxygen pairs two electrons in one 2p orbital &#8212; extra repulsion makes it easier to remove</li>
       <li>Same pattern repeats in Period 3: Al &#60; Mg, S &#60; P</li>
     </ul></div>`},
    {id:"1.5",title:"Photoelectron Spectroscopy",
     content:`
     <p class="intro-text">PES measures the <strong>binding energy</strong> of electrons in each subshell. It directly confirms electron configuration and provides experimental evidence for Zeff differences across the periodic table.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">PES Principle (Photoelectric Effect)</div><div class="term-body">High-energy photons (UV or X-ray) eject electrons. The kinetic energy of ejected electrons reveals the binding energy:<div class="term-eq">BE = E_photon &#8722; KE_electron</div>Each subshell has a characteristic binding energy.</div></div></div>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">&#128205;</div><h3>Peak Position (x-axis)</h3><p>Binding energy. Peaks to the <strong>right</strong> = inner shells (high BE). Peaks to the <strong>left</strong> = valence electrons (low BE). 1s has highest BE.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">&#128207;</div><h3>Peak Height (y-axis)</h3><p>Proportional to <strong>number of electrons</strong> in that subshell. s (max 2e&#8315;) = shorter peak. p (max 6e&#8315;) = taller peak.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">&#128202;</div><h3>Zeff Evidence</h3><p>Across a period, the 1s binding energy <strong>increases</strong> because Z increases &#8212; each proton makes core electrons more tightly bound. Direct experimental proof.</p></div>
     </div>
     <div class="hbox hb-gr"><h4>&#10003; Worked Example: Na (1s&#178;2s&#178;2p&#8310;3s&#185;)</h4><ul>
       <li>PES shows 4 peaks: 1s, 2s, 2p, 3s (right to left = highest to lowest BE)</li>
       <li>3s peak = smallest (1 electron). 2p peak = tallest (6 electrons)</li>
       <li>Height ratios from left: 1:3:1:1 (3s:2p:2s:1s)</li>
       <li>The 3s peak (lowest BE) is the easiest electron to remove &#8212; consistent with Na's low IE</li>
     </ul></div>`}
   ]},

  {id:2,title:"Bonding & Molecular Structure",emoji:"&#128279;",
   lead:"From electron transfer to electron sharing &#8212; understand how and why atoms bond, how to visualize molecular geometry, and how structure drives properties.",
   topics:["Ionic & covalent bonding","Lewis structures","Formal charge","VSEPR","Hybridization","IMFs","Lattice energy"],
   sublessons:[
    {id:"2.1",title:"Types of Chemical Bonds",
     content:`
     <p class="intro-text">Bonding arises from the lowering of potential energy when atoms share or transfer electrons. The type of bond depends on <strong>electronegativity difference</strong> between atoms.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Electronegativity (EN)</div><div class="term-body">How strongly an atom attracts shared electrons. Pauling scale: F = 4.0 (highest). Increases up and to the right on the periodic table.<div class="term-eq">&#916;EN: &lt;0.4 nonpolar covalent | 0.4&#8211;1.7 polar covalent | &gt;1.7 ionic</div></div></div></div>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">&#128309;</div><h3>Ionic Bonding</h3><p>Complete transfer of electrons from metal to nonmetal. Forms cation/anion pairs. Crystal lattice structure. Properties: high mp, brittle, conducts when dissolved/melted. Lattice energy measures strength.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">&#129309;</div><h3>Covalent Bonding</h3><p>Sharing of electron pairs between nonmetals. Can be polar (&#916;EN &#62; 0) or nonpolar (equal sharing). Single, double, triple bonds possible. Higher bond order &#8594; shorter, stronger bond.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">&#127959;&#65039;</div><h3>Metallic Bonding</h3><p>Metal cations in a "sea" of delocalized electrons. Explains: electrical conductivity, thermal conductivity, malleability, luster. Electrons not bound to specific atoms.</p></div>
     </div>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">&#963; (sigma) and &#960; (pi) Bonds</div><div class="term-body"><strong>&#963; bond:</strong> end-to-end orbital overlap. The first bond between atoms is always &#963;. Free rotation around &#963;. <br><strong>&#960; bond:</strong> side-by-side overlap of parallel p orbitals. Second and third bonds are &#960;. No free rotation around &#960; (explains cis/trans isomers).<div class="term-eq">Single = 1&#963; &nbsp;&#183;&nbsp; Double = 1&#963;+1&#960; &nbsp;&#183;&nbsp; Triple = 1&#963;+2&#960;</div></div></div></div>
     <div class="hbox hb-am"><h4>&#9888; Lattice Energy</h4><ul>
       <li>Energy released when gaseous ions form a crystal lattice. Always negative (exothermic)</li>
       <li>Lattice energy &#8733; |charge&#8314; &#215; charge&#8315;| / (r&#8314; + r&#8315;) &#8212; bigger charges, smaller radii &#8594; stronger lattice</li>
       <li>MgO has far higher lattice energy than NaF (charges 2+/2&#8722; vs 1+/1&#8722;)</li>
       <li>Measured via Born-Haber cycle using Hess's Law</li>
     </ul></div>`},
    {id:"2.2",title:"Lewis Structures & Formal Charge",
     content:`
     <p class="intro-text">A Lewis structure shows the arrangement of valence electrons using dots and lines. Mastering them is essential &#8212; VSEPR, hybridization, and reactivity all depend on correct Lewis structures.</p>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Count total valence electrons</h4><p>Sum all valence electrons. +charge &#8594; subtract e&#8315;; &#8722;charge &#8594; add e&#8315;. This is your "budget."</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Place central atom, connect with single bonds</h4><p>Least electronegative atom in center (except H always terminal). Subtract 2 for each bond drawn.</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Complete octets on terminal atoms (except H)</h4><p>H needs only 2 electrons. Fill lone pairs on outer atoms first.</p></div></div>
       <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Give remaining electrons to central atom</h4><p>Place any leftover electrons as lone pairs on the central atom.</p></div></div>
       <div class="step"><div class="step-n">5</div><div class="step-body"><h4>Form multiple bonds if needed</h4><p>If central atom lacks an octet, convert lone pairs from adjacent atoms into double/triple bonds. Check formal charges.</p></div></div>
     </div>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Formal Charge (FC)</div><div class="term-body">Bookkeeping tool to identify the most realistic Lewis structure.<div class="term-eq">FC = (valence e&#8315;) &#8722; (lone pair e&#8315;) &#8722; &#189;(bonding e&#8315;)</div>Best structure: all FC = 0, or smallest FC, or negative FC on most electronegative atom. Sum of all FC = overall charge.</div></div></div>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">&#127754;</div><h3>Resonance Structures</h3><p>When multiple valid Lewis structures exist with different bond placements, the molecule is a <strong>hybrid</strong> of all. Electrons are delocalized. Benzene (C&#8326;H&#8326;) and ozone (O&#8323;) are classic examples.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--pu)"></div><div class="card-icon">&#8853;</div><h3>Expanded Octets</h3><p>Period 3+ elements (S, P, Cl, Xe) can hold more than 8 electrons using d orbitals. SF&#8326; (12e&#8315; around S), PCl&#8325; (10e&#8315;). Period 2 elements (C, N, O, F) <strong>cannot</strong> expand octets.</p></div>
     </div>`},
    {id:"2.3",title:"VSEPR & Molecular Geometry",diagram:"vseprGeometry",
     content:`
     <p class="intro-text">VSEPR (Valence Shell Electron Pair Repulsion) predicts geometry based on a simple idea: electron domains repel each other and arrange to minimize repulsion.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Electron Domain</div><div class="term-body">Any region of electron density: single bond, double bond, triple bond, or lone pair. Each counts as ONE domain regardless of bond order.<div class="term-eq">Domains = &#963; bonds + lone pairs</div></div></div></div>
     <div class="hbox hb-bl"><h4>&#128161; Repulsion Order (Strongest &#8594; Weakest)</h4><ul>
       <li><strong>Lone pair &#8211; Lone pair:</strong> strongest (lone pairs occupy more space)</li>
       <li><strong>Lone pair &#8211; Bonding pair:</strong> medium</li>
       <li><strong>Bonding pair &#8211; Bonding pair:</strong> weakest</li>
       <li>Lone pairs compress bond angles below ideal geometry</li>
       <li>H&#8322;O (2 lone pairs): 104.5&#176;, not the tetrahedral ideal of 109.5&#176;</li>
     </ul></div>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--re)"></div><div class="card-icon">&#128167;</div><h3>Polar Molecules</h3><p>Bond dipoles do NOT cancel. Net dipole moment &#956; &#8800; 0. Examples: H&#8322;O (bent, dipoles reinforce), NH&#8323; (trigonal pyramidal), HCl.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">&#9878;&#65039;</div><h3>Nonpolar Molecules</h3><p>Either all bonds nonpolar, OR polar bonds cancel due to symmetric geometry. CO&#8322; (linear), CCl&#8324; (tetrahedral), BF&#8323; (trigonal planar) &#8212; all nonpolar despite polar bonds.</p></div>
     </div>`},
    {id:"2.4",title:"Hybridization",
     content:`
     <p class="intro-text">Hybridization explains observed molecular geometries. Atomic orbitals "mix" to form new <strong>hybrid orbitals</strong> with geometrically equivalent shapes and energies.</p>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">&#9587;</div><h3>sp hybridization</h3><p>1s + 1p &#8594; 2 sp orbitals. Linear, 180&#176;. Remaining 2 p orbitals form 2 &#960; bonds. Examples: BeCl&#8322;, CO&#8322;, HC&#8801;CH, any triple bond.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">&#9651;</div><h3>sp&#178; hybridization</h3><p>1s + 2p &#8594; 3 sp&#178; orbitals. Trigonal planar, 120&#176;. 1 remaining p orbital &#8594; 1 &#960; bond. Examples: BF&#8323;, C&#8322;H&#8324; (ethylene), benzene, any C in a double bond.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--gr)"></div><div class="card-icon">&#9670;</div><h3>sp&#179; hybridization</h3><p>1s + 3p &#8594; 4 sp&#179; orbitals. Tetrahedral, 109.5&#176;. No unhybridized p orbitals. Examples: CH&#8324;, NH&#8323;, H&#8322;O, any C with all single bonds.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">&#11041;</div><h3>sp&#179;d / sp&#179;d&#178;</h3><p>sp&#179;d: 5 orbitals, trigonal bipyramidal (PCl&#8325;). sp&#179;d&#178;: 6 orbitals, octahedral (SF&#8326;). Only Period 3+ elements using d orbitals.</p></div>
     </div>
     <div class="hbox hb-cy"><h4>&#128269; Quick Hybridization Method</h4><ul>
       <li>Count electron domains (&#963; bonds + lone pairs) on central atom</li>
       <li>2 domains &#8594; sp &nbsp;&#183;&nbsp; 3 &#8594; sp&#178; &nbsp;&#183;&nbsp; 4 &#8594; sp&#179; &nbsp;&#183;&nbsp; 5 &#8594; sp&#179;d &nbsp;&#183;&nbsp; 6 &#8594; sp&#179;d&#178;</li>
       <li>Double and triple bonds count as ONE domain each</li>
     </ul></div>`},
    {id:"2.5",title:"Intermolecular Forces",
     content:`
     <p class="intro-text">Intermolecular forces (IMFs) are attractions <strong>between</strong> molecules. IMFs determine physical properties: boiling point, melting point, viscosity, surface tension, solubility.</p>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--re)"></div><div class="card-icon">&#8853;</div><h3>Ion-Dipole (~10&#8211;50 kJ/mol)</h3><p>Between an ion and a polar molecule. Strongest IMF. Critical for dissolving ionic compounds in water. Na&#8314; interacts strongly with O lone pairs in H&#8322;O.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--or)"></div><div class="card-icon">&#128167;</div><h3>Hydrogen Bonding (~10&#8211;40 kJ/mol)</h3><p>H bonded to F, O, or N interacts with lone pair on another F, O, or N. Explains water's unusually high bp (100&#176;C vs &#8722;60&#176;C expected), DNA base pairing, protein folding.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">&#8597;&#65039;</div><h3>Dipole-Dipole (~2&#8211;20 kJ/mol)</h3><p>Between permanent dipoles in polar molecules. Positive end of one attracts negative end of neighbor. Requires a net dipole moment. Example: HCl&#8230;HCl.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">&#127758;</div><h3>London Dispersion (~0.1&#8211;40 kJ/mol)</h3><p>Temporary dipoles in ALL molecules from electron fluctuations. Strength &#8733; molar mass (more electrons = more polarizable). Surface area matters: straight chain &gt; branched.</p></div>
     </div>
     <div class="hbox hb-gr"><h4>&#10003; Comparing Boiling Points</h4><ul>
       <li><strong>Same functional group/shape:</strong> higher molar mass &#8594; stronger LDF &#8594; higher bp</li>
       <li><strong>Polar vs nonpolar (similar mass):</strong> polar has dipole-dipole &#8594; higher bp</li>
       <li><strong>H-bonding dramatically raises bp:</strong> H&#8322;O (100&#176;C) vs H&#8322;S (&#8722;60&#176;C)</li>
       <li><strong>Branching:</strong> decreases surface area &#8594; weaker LDF &#8594; lower bp vs straight-chain</li>
     </ul></div>`}
   ]},

  {id:3,title:"Stoichiometry & Chemical Reactions",emoji:"&#9879;&#65039;",
   lead:"The quantitative language of chemistry &#8212; from mole calculations to reaction types, limiting reagents, and net ionic equations.",
   topics:["Mole concept","Balancing equations","Limiting reagents","Percent yield","Reaction types","Net ionic equations"],
   sublessons:[
    {id:"3.1",title:"The Mole Concept",
     content:`
     <p class="intro-text">The mole bridges the atomic and laboratory scales. Because atoms are too small to weigh individually, chemists count them in groups of 6.022&#215;10&#178;&#179; &#8212; one mole.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Avogadro's Number (N&#8336;)</div><div class="term-body">6.022 &#215; 10&#178;&#179; particles per mole. One mole of carbon-12 atoms has a mass of exactly 12 grams.<div class="term-eq">1 mol = 6.022 &#215; 10&#178;&#179; particles</div></div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">n = m / M</div><div class="fdesc"><strong>Moles from mass.</strong> n = moles, m = mass (g), M = molar mass (g/mol). Molar mass = sum of atomic masses from periodic table.</div></div>
       <div class="f-row"><div class="feq">n = N / N&#8336;</div><div class="fdesc"><strong>Moles from particle count.</strong> N = number of particles, N&#8336; = 6.022&#215;10&#178;&#179;.</div></div>
       <div class="f-row"><div class="feq">n = C &#215; V(L)</div><div class="fdesc"><strong>Moles from concentration.</strong> C = molarity (mol/L), V = volume in liters.</div></div>
       <div class="f-row"><div class="feq">n = PV / RT</div><div class="fdesc"><strong>Moles of gas.</strong> From ideal gas law. R = 0.08206 L&#183;atm/mol&#183;K. T in Kelvin. STP: 1 mol = 22.4 L.</div></div>
     </div>`},
    {id:"3.2",title:"Reaction Types & Balancing",
     content:`
     <p class="intro-text">A balanced chemical equation has equal numbers of each atom on both sides. Coefficients give the mole ratios for stoichiometry calculations.</p>
     <div class="card-grid">
       <div class="card"><div class="card-icon">&#10133;</div><h3>Synthesis</h3><p>A + B &#8594; AB. Two substances combine. Example: N&#8322; + 3H&#8322; &#8594; 2NH&#8323; (Haber process). Often exothermic.</p></div>
       <div class="card"><div class="card-icon">&#9986;&#65039;</div><h3>Decomposition</h3><p>AB &#8594; A + B. One compound breaks into simpler products. Requires energy input. 2H&#8322;O&#8322; &#8594; 2H&#8322;O + O&#8322;.</p></div>
       <div class="card"><div class="card-icon">&#8635;</div><h3>Single Displacement</h3><p>A + BC &#8594; AC + B. Use activity series. More reactive displaces less reactive. Zn + 2HCl &#8594; ZnCl&#8322; + H&#8322;&#8593;.</p></div>
       <div class="card"><div class="card-icon">&#8646;</div><h3>Double Displacement</h3><p>AB + CD &#8594; AD + CB. Ions swap partners. Occurs if: precipitate forms, gas escapes, or water forms.</p></div>
       <div class="card"><div class="card-icon">&#128293;</div><h3>Combustion</h3><p>Fuel + O&#8322; &#8594; CO&#8322; + H&#8322;O (complete). Always exothermic. Balance C, H, then O last.</p></div>
       <div class="card"><div class="card-icon">&#9889;</div><h3>Redox</h3><p>Electron transfer. OIL RIG: Oxidation Is Loss, Reduction Is Gain. Oxidizing agent gets reduced; reducing agent gets oxidized.</p></div>
     </div>
     <div class="hbox hb-am"><h4>&#9888; Balancing Redox by Half-Reactions (Acidic Solution)</h4><ul>
       <li>1. Split into oxidation and reduction half-reactions</li>
       <li>2. Balance atoms other than O and H</li>
       <li>3. Add H&#8322;O to balance O</li>
       <li>4. Add H&#8314; to balance H</li>
       <li>5. Add e&#8315; to balance charge</li>
       <li>6. Multiply so electrons cancel; add half-reactions</li>
       <li>Basic solution: complete as acidic, then add OH&#8315; to both sides to neutralize H&#8314;</li>
     </ul></div>`},
    {id:"3.3",title:"Limiting Reagents & Yield",
     content:`
     <p class="intro-text">In most real reactions, one reactant runs out first &#8212; the <strong>limiting reagent</strong>. It determines the maximum amount of product that can form (theoretical yield).</p>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Balance the equation</h4><p>Every stoichiometry calculation requires correct mole ratios from a balanced equation.</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Convert all reactants to moles</h4><p>Use n = m/M (from grams) or n = C&#215;V (from solution). Gases: n = PV/RT.</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Find the limiting reagent</h4><p>Divide moles of each reactant by its stoichiometric coefficient. The reactant with the SMALLEST value is the limiting reagent.</p></div></div>
       <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Calculate theoretical yield</h4><p>mol LR &#215; (coeff product / coeff LR) = mol product. Convert to grams using molar mass.</p></div></div>
       <div class="step"><div class="step-n">5</div><div class="step-body"><h4>Percent yield</h4><p>% yield = (actual yield / theoretical yield) &#215; 100. Always &#8804; 100% in theory.</p></div></div>
     </div>
     <div class="hbox hb-bl"><h4>&#128161; Empirical &amp; Molecular Formulas</h4><ul>
       <li><strong>Empirical formula:</strong> simplest whole-number ratio. From % composition: % &#8594; assume 100g &#8594; g &#8594; mol &#8594; divide by smallest &#8594; ratio</li>
       <li><strong>Molecular formula:</strong> actual atom count = (empirical formula) &#215; n</li>
       <li>n = molar mass / empirical formula mass</li>
     </ul></div>`},
    {id:"3.4",title:"Net Ionic Equations",
     content:`
     <p class="intro-text">Net ionic equations show the actual chemical change by removing spectator ions &#8212; those that appear unchanged on both sides and don't participate in the reaction.</p>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Write the full molecular equation (balanced)</h4><p>Example: NaCl(aq) + AgNO&#8323;(aq) &#8594; AgCl(s) + NaNO&#8323;(aq)</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Write the complete ionic equation</h4><p>Dissociate all strong electrolytes into ions. Leave weak electrolytes, precipitates, gases, and pure solids/liquids intact.</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Cancel spectator ions and write net ionic equation</h4><p>For AgCl precipitation: Ag&#8314;(aq) + Cl&#8315;(aq) &#8594; AgCl(s)</p></div></div>
     </div>
     <div class="hbox hb-gr"><h4>&#10003; Solubility Rules &#8212; Memorize!</h4><ul>
       <li>Always soluble: NO&#8323;&#8315;, ClO&#8324;&#8315;, CH&#8323;COO&#8315;, Group 1 ions, NH&#8324;&#8314;</li>
       <li>Usually soluble: Cl&#8315;, Br&#8315;, I&#8315; &#8212; except with Ag&#8314;, Pb&#178;&#8314;, Hg&#8322;&#178;&#8314;</li>
       <li>Usually soluble: SO&#8324;&#178;&#8315; &#8212; except BaSO&#8324;, PbSO&#8324;, CaSO&#8324;, Ag&#8322;SO&#8324;</li>
       <li>Usually insoluble: CO&#8323;&#178;&#8315;, PO&#8324;&#179;&#8315;, S&#178;&#8315;, OH&#8315; &#8212; except Group 1+NH&#8324;&#8314;, and Ca/Sr/Ba hydroxides</li>
     </ul></div>`}
   ]},

  {id:4,title:"Gases",emoji:"&#128168;",
   lead:"Model gas behavior from Boyle's Law to kinetic theory and real gas corrections. Understand the molecular basis of pressure and temperature.",
   topics:["Gas laws","Ideal gas law","Dalton's law","KMT","Maxwell-Boltzmann","Real gases"],
   sublessons:[
    {id:"4.1",title:"The Gas Laws",
     content:`
     <p class="intro-text">Before the ideal gas law, chemists discovered individual relationships between P, V, n, and T. Each is a special case of PV = nRT where two variables are held constant.</p>
     <div class="formula-list">
       <div class="f-row"><div class="feq">P&#8321;V&#8321; = P&#8322;V&#8322;</div><div class="fdesc"><strong>Boyle's Law.</strong> Constant n, T. Pressure and volume are inversely proportional. Compress a gas &#8594; pressure rises.</div></div>
       <div class="f-row"><div class="feq">V&#8321;/T&#8321; = V&#8322;/T&#8322;</div><div class="fdesc"><strong>Charles's Law.</strong> Constant n, P. Volume and temperature (in Kelvin!) are directly proportional. T must ALWAYS be in Kelvin.</div></div>
       <div class="f-row"><div class="feq">P&#8321;/T&#8321; = P&#8322;/T&#8322;</div><div class="fdesc"><strong>Gay-Lussac's Law.</strong> Constant n, V. Pressure and temperature directly proportional. Heating a closed rigid container &#8594; pressure rises.</div></div>
       <div class="f-row"><div class="feq">P&#8321;V&#8321;/T&#8321; = P&#8322;V&#8322;/T&#8322;</div><div class="fdesc"><strong>Combined Gas Law.</strong> Use when n is constant but P, V, T all change. Drop any constant variable.</div></div>
       <div class="f-row"><div class="feq">V&#8321;/n&#8321; = V&#8322;/n&#8322;</div><div class="fdesc"><strong>Avogadro's Law.</strong> Constant P, T. Equal volumes of all gases (same P, T) contain equal moles. At STP: 1 mol = 22.414 L.</div></div>
     </div>`},
    {id:"4.2",title:"Ideal Gas Law & Dalton's Law",
     content:`
     <div class="formula-list">
       <div class="f-row"><div class="feq">PV = nRT</div><div class="fdesc"><strong>Ideal Gas Law.</strong> R = 0.08206 L&#183;atm/mol&#183;K or 8.314 J/mol&#183;K. Use 0.08206 for PV=nRT. Use 8.314 when energy is involved. T always in Kelvin.</div></div>
       <div class="f-row"><div class="feq">P&#7511;&#8338;&#7511;&#8336;&#8343; = P&#8321; + P&#8322; + &#8230;</div><div class="fdesc"><strong>Dalton's Law of Partial Pressures.</strong> Each gas exerts pressure independently. Total pressure = sum of partial pressures.</div></div>
       <div class="f-row"><div class="feq">P&#7522; = &#967;&#7522; &#215; P&#7511;&#8338;&#7511;&#8336;&#8343;</div><div class="fdesc"><strong>Partial pressure from mole fraction.</strong> &#967;&#7522; = moles of gas i / total moles. Dimensionless.</div></div>
       <div class="f-row"><div class="feq">P_gas = P_total &#8722; P_water</div><div class="fdesc"><strong>Collecting gas over water.</strong> Water vapor always present. Subtract water's vapor pressure to get pure gas pressure.</div></div>
       <div class="f-row"><div class="feq">d = PM / RT</div><div class="fdesc"><strong>Gas density.</strong> d = density (g/L), M = molar mass (g/mol). Useful for identifying unknown gases from density measurements.</div></div>
     </div>
     <div class="hbox hb-cy"><h4>&#128309; Unit Conversions</h4><ul>
       <li>1 atm = 101.325 kPa = 760 mmHg = 760 torr</li>
       <li>1 bar = 100 kPa &#8776; 0.987 atm</li>
       <li>T(K) = T(&#176;C) + 273.15 &#8212; ALWAYS convert before using in gas equations</li>
     </ul></div>`},
    {id:"4.3",title:"Kinetic Molecular Theory",diagram:"maxwellBoltzmann",
     content:`
     <p class="intro-text">Kinetic Molecular Theory (KMT) explains WHY the gas laws work by describing the microscopic behavior of gas particles. It makes 5 simplifying assumptions about ideal gases.</p>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Negligible particle volume</h4><p>Gas particles are tiny relative to the space between them. Mostly empty space &#8212; why gases are compressible.</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Constant random motion</h4><p>Particles move in straight lines at constant speeds until they collide. All directions equally probable.</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>No intermolecular forces</h4><p>No attractions or repulsions between particles. This is the key "ideal" assumption that breaks down for real gases.</p></div></div>
       <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Elastic collisions</h4><p>All collisions conserve total kinetic energy. Individual particles can speed up or slow down after collisions.</p></div></div>
       <div class="step"><div class="step-n">5</div><div class="step-body"><h4>KE proportional to T</h4><p>Average KE is directly proportional to absolute temperature. KE_avg = (3/2)RT per mole. ALL gases at the same temperature have the same average KE regardless of molar mass.</p></div></div>
     </div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">u_rms = &#8730;(3RT/M)</div><div class="fdesc"><strong>Root-mean-square speed.</strong> M = molar mass in <strong>kg/mol</strong>! R = 8.314 J/mol&#183;K. Heavier molecules are slower at the same T.</div></div>
       <div class="f-row"><div class="feq">r&#8321;/r&#8322; = &#8730;(M&#8322;/M&#8321;)</div><div class="fdesc"><strong>Graham's Law of Effusion.</strong> Rate of effusion inversely proportional to &#8730;M. Lighter gases effuse faster at the same T and P.</div></div>
     </div>`},
    {id:"4.4",title:"Real Gases & van der Waals",
     content:`
     <p class="intro-text">Real gases deviate from ideal behavior at high pressures and low temperatures because KMT assumptions break down: molecules do have volume and they do attract each other.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Compressibility Factor (Z)</div><div class="term-body">Measures deviation from ideal behavior.<div class="term-eq">Z = PV / nRT</div>Z = 1: ideal. Z &gt; 1: repulsions dominate (high P). Z &lt; 1: attractions dominate (moderate P, low T).</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">(P + an&#178;/V&#178;)(V &#8722; nb) = nRT</div><div class="fdesc"><strong>van der Waals equation.</strong> <strong>a</strong> = attraction correction (larger a = stronger IMFs). <strong>b</strong> = molecular volume correction (larger b = bigger molecules).</div></div>
     </div>
     <div class="tbl-wrap"><table><thead><tr><th>Condition</th><th>Behavior</th><th>Dominant Term</th><th>Z</th></tr></thead>
     <tbody>
       <tr><td>Low P, high T</td><td>Nearly ideal</td><td>Neither</td><td>&#8776; 1</td></tr>
       <tr><td>High P (any T)</td><td>Above ideal</td><td>b term (volume)</td><td>&gt; 1</td></tr>
       <tr><td>Moderate P, low T</td><td>Below ideal</td><td>a term (attractions)</td><td>&lt; 1</td></tr>
     </tbody></table></div>`}
   ]},

  {id:5,title:"Thermochemistry",emoji:"&#128293;",
   lead:"Quantify heat flow in chemical reactions. From calorimetry to Hess's law and heating curves &#8212; understand energy changes at constant pressure.",
   topics:["Enthalpy","Calorimetry","Hess's law","Formation enthalpies","Bond energies","Heating curves"],
   sublessons:[
    {id:"5.1",title:"Enthalpy & Calorimetry",
     content:`
     <p class="intro-text">Enthalpy (H) is a state function equal to heat exchanged at constant pressure. Since most lab reactions run at constant atmospheric pressure, &#916;H is the most practical measure of "heat of reaction."</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Enthalpy (H)</div><div class="term-body">H = U + PV. At constant pressure: &#916;H = q_p. &#916;H &lt; 0 &#8594; exothermic. &#916;H &gt; 0 &#8594; endothermic. H is a <strong>state function</strong> &#8212; path independent.<div class="term-eq">&#916;H = q_p (heat at constant pressure)</div></div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">q = mc&#916;T</div><div class="fdesc"><strong>Heat transfer.</strong> m = mass (g), c = specific heat (J/g&#183;K), &#916;T = T_final &#8722; T_initial. For dilute aqueous solutions: c &#8776; 4.184 J/g&#183;K.</div></div>
       <div class="f-row"><div class="feq">q_rxn = &#8722;q_calorimeter</div><div class="fdesc"><strong>Conservation of energy.</strong> Exothermic rxn heats solution: q_soln &gt; 0, q_rxn &lt; 0.</div></div>
       <div class="f-row"><div class="feq">q_bomb = C_cal &#215; &#916;T</div><div class="fdesc"><strong>Bomb calorimeter.</strong> C_cal = heat capacity of entire calorimeter (J/&#176;C). Measures &#916;E (constant volume).</div></div>
     </div>`},
    {id:"5.2",title:"Hess's Law & &#916;H&#176;f",
     content:`
     <p class="intro-text">Hess's Law: &#916;H for a reaction is the same regardless of how many steps it takes. This lets us calculate &#916;H for reactions we can't measure directly.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Standard Enthalpy of Formation (&#916;H&#176;f)</div><div class="term-body">&#916;H when 1 mol of a compound forms from its elements in their standard states (25&#176;C, 1 atm). Standard state = most stable form of element (O&#8322;(g), C(graphite)).<div class="term-eq">&#916;H&#176;f of any element in standard state = 0</div></div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">&#916;H&#176;_rxn = &#931;&#916;H&#176;f(products) &#8722; &#931;&#916;H&#176;f(reactants)</div><div class="fdesc"><strong>Using standard enthalpies.</strong> Multiply each &#916;H&#176;f by stoichiometric coefficient. Most accurate method.</div></div>
       <div class="f-row"><div class="feq">&#916;H_rxn = &#931;BE(broken) &#8722; &#931;BE(formed)</div><div class="fdesc"><strong>Bond energy method.</strong> Approximate (averages used). Breaking bonds = endothermic (+). Forming bonds = exothermic (&#8722;). Only valid for gas-phase reactions.</div></div>
     </div>
     <div class="hbox hb-pu"><h4>&#128506; Born-Haber Cycle</h4><ul>
       <li>Special application of Hess's Law to calculate <strong>lattice energy</strong> of ionic compounds</li>
       <li>Steps: elements &#8594; gaseous atoms &#8594; gaseous ions &#8594; ionic solid</li>
       <li>Sum of all &#916;H values = &#916;H&#176;f of ionic compound (measured experimentally)</li>
       <li>Solve algebraically for the lattice energy term</li>
     </ul></div>`},
    {id:"5.3",title:"Heating Curves & Phase Changes",diagram:"heatingCurve",
     content:`
     <p class="intro-text">A heating curve shows temperature vs heat added for a pure substance. The shape reveals phase transitions, latent heat, and specific heats.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Latent Heat (&#916;H_phase)</div><div class="term-body">Heat required to change phase at constant temperature. Energy goes into breaking IMFs, not raising temperature.<div class="term-eq">q = n &#215; &#916;H_fus &nbsp;or&nbsp; q = n &#215; &#916;H_vap</div>For water: &#916;H_fus = 6.01 kJ/mol at 0&#176;C. &#916;H_vap = 40.7 kJ/mol at 100&#176;C.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">q = mc&#916;T &nbsp;(sloped)</div><div class="fdesc"><strong>Single-phase heating.</strong> c_ice = 2.09, c_liquid = 4.18, c_steam = 2.01 J/g&#183;K for water.</div></div>
       <div class="f-row"><div class="feq">ln(P&#8322;/P&#8321;) = &#8722;(&#916;H_vap/R)(1/T&#8322; &#8722; 1/T&#8321;)</div><div class="fdesc"><strong>Clausius-Clapeyron Equation.</strong> R = 8.314 J/mol&#183;K. T in Kelvin. Predicts boiling point at different pressures. Explains why cooking takes longer at high altitude.</div></div>
     </div>`}
   ]},

  {id:6,title:"Solutions & Properties",emoji:"&#129514;",
   lead:"Master concentration units, colligative properties, and the factors that govern how and how much substances dissolve.",
   topics:["Concentration units","Solubility","Colligative properties","Raoult's law","Henry's law","Factors affecting solubility"],
   sublessons:[
    {id:"6.1",title:"Concentration Units",
     content:`
     <p class="intro-text">Concentration tells us how much solute is in a given amount of solution. Different units are needed for different purposes &#8212; molarity for stoichiometry, molality for colligative properties.</p>
     <div class="tbl-wrap"><table><thead><tr><th>Unit</th><th>Symbol</th><th>Formula</th><th>Temp Dependent?</th><th>Use</th></tr></thead>
     <tbody>
       <tr><td>Molarity</td><td>M</td><td>mol solute / L solution</td><td>Yes (V changes)</td><td>Stoichiometry, titrations</td></tr>
       <tr><td>Molality</td><td>m</td><td>mol solute / kg solvent</td><td>No</td><td>Colligative properties</td></tr>
       <tr><td>Mass percent</td><td>%</td><td>g solute / g solution &#215; 100</td><td>No</td><td>Commercial reagents</td></tr>
       <tr><td>Mole fraction</td><td>&#967;</td><td>mol A / mol total</td><td>No</td><td>Raoult's law</td></tr>
     </tbody></table></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">M&#8321;V&#8321; = M&#8322;V&#8322;</div><div class="fdesc"><strong>Dilution equation.</strong> Moles of solute are conserved upon dilution. Solve for any unknown.</div></div>
     </div>`},
    {id:"6.2",title:"Colligative Properties",
     content:`
     <p class="intro-text">Colligative properties depend on the <strong>number of solute particles</strong>, not their identity. The van't Hoff factor i accounts for dissociation of electrolytes.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">van't Hoff Factor (i)</div><div class="term-body">Actual moles of particles per mole of solute. Nonelectrolytes: i = 1. NaCl: i &#8776; 2. MgCl&#8322;: i &#8776; 3. Theoretical; real i slightly less due to ion pairing.<div class="term-eq">i = moles of particles in solution / moles of solute dissolved</div></div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">&#916;T_b = i &#183; K_b &#183; m</div><div class="fdesc"><strong>Boiling point elevation.</strong> K_b(water) = 0.512&#176;C&#183;kg/mol. T_b increases. Never forget i for electrolytes!</div></div>
       <div class="f-row"><div class="feq">&#916;T_f = i &#183; K_f &#183; m</div><div class="fdesc"><strong>Freezing point depression.</strong> K_f(water) = 1.86&#176;C&#183;kg/mol. T_f decreases. Why roads are salted &#8212; NaCl lowers freezing point.</div></div>
       <div class="f-row"><div class="feq">&#960; = iMRT</div><div class="fdesc"><strong>Osmotic pressure.</strong> &#960; = osmotic pressure (atm), R = 0.08206, T = Kelvin. Most sensitive colligative property &#8212; used to determine molar mass of large molecules.</div></div>
       <div class="f-row"><div class="feq">P_A = &#967;_A &#183; P&#176;_A</div><div class="fdesc"><strong>Raoult's Law.</strong> Vapor pressure of solvent A above a solution. Adding solute lowers vapor pressure (fewer solvent molecules escape).</div></div>
     </div>`},
    {id:"6.3",title:"Solubility & Solution Formation",
     content:`
     <p class="intro-text">A substance dissolves when the solute-solvent interaction is favorable enough to compensate for disrupting both structures. "Like dissolves like" is the guiding principle.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Enthalpy of Solution (&#916;H_soln)</div><div class="term-body">For ionic compounds: &#916;H_soln = &#916;H_lattice + &#916;H_hydration. If |&#916;H_hydration| &gt; |&#916;H_lattice|: exothermic dissolution. If reversed: endothermic (like NH&#8324;NO&#8323; in cold packs).</div></div></div>
     <div class="hbox hb-gr"><h4>&#10003; Factors Affecting Solubility</h4><ul>
       <li><strong>Temperature (solids):</strong> usually increases with T. Exceptions: CaSO&#8324; decreases with T.</li>
       <li><strong>Temperature (gases):</strong> always decreases with T &#8212; why fish die in warm water (less dissolved O&#8322;)</li>
       <li><strong>Pressure (gases):</strong> Henry's Law: C = k&#8347; &#215; P. More pressure &#8594; more gas dissolves (carbonated drinks)</li>
       <li><strong>"Like dissolves like":</strong> polar solvents dissolve polar/ionic solutes. Nonpolar dissolves nonpolar.</li>
     </ul></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">C = k&#8347; &#215; P</div><div class="fdesc"><strong>Henry's Law.</strong> C = concentration of dissolved gas, k&#8347; = Henry's law constant (mol/L&#183;atm, substance-specific), P = partial pressure of gas above solution.</div></div>
     </div>`}
   ]},

  {id:7,title:"Chemical Equilibrium",emoji:"&#9878;&#65039;",
   lead:"Most reactions don't go to completion &#8212; they reach equilibrium. Master K expressions, ICE tables, Le Ch&#226;telier's principle, and Ksp.",
   topics:["Kc, Kp","Q and K comparison","ICE tables","Le Chatelier","Ksp","Common ion effect"],
   sublessons:[
    {id:"7.1",title:"Equilibrium Constants",
     content:`
     <p class="intro-text">At equilibrium, forward and reverse reactions occur at equal rates &#8212; concentrations stay constant but the reaction hasn't stopped. K describes the ratio of products to reactants at this state.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Law of Mass Action</div><div class="term-body">For aA + bB &#8652; cC + dD at equilibrium:<div class="term-eq">Kc = [C]&#7580; [D]&#7496; / [A]&#7491; [B]&#7495;</div>Pure solids and pure liquids are omitted. Only temperature changes K.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">Kp = Kc(RT)&#8710;n</div><div class="fdesc"><strong>Kp from Kc.</strong> &#916;n = moles gas products &#8722; moles gas reactants. R = 0.08206 L&#183;atm/mol&#183;K. T in Kelvin.</div></div>
       <div class="f-row"><div class="feq">Q &lt; K &#8594; forward; Q &gt; K &#8594; reverse</div><div class="fdesc"><strong>Reaction quotient Q.</strong> Same expression as K but uses CURRENT concentrations. Compare Q to K to predict direction of shift.</div></div>
       <div class="f-row"><div class="feq">K_overall = K&#8321; &#215; K&#8322; &#215; &#8230;</div><div class="fdesc"><strong>Coupled equilibria.</strong> When reactions are added, K values multiply. If reversed: K_new = 1/K. If multiplied by n: K_new = K&#8319;.</div></div>
     </div>
     <div class="hbox hb-bl"><h4>&#128161; Interpreting K Values</h4><ul>
       <li>K &#8811; 1 (e.g. 10&#8310;): equilibrium far right &#8212; essentially complete reaction</li>
       <li>K &#8810; 1 (e.g. 10&#8315;&#8310;): equilibrium far left &#8212; barely any product forms</li>
       <li>K &#8776; 1: significant amounts of both at equilibrium</li>
       <li>K does NOT tell you about rate &#8212; a large K reaction could still be very slow</li>
     </ul></div>`},
    {id:"7.2",title:"ICE Tables & Le Ch&#226;telier",diagram:"iceTables",
     content:`
     <p class="intro-text">ICE tables systematically find equilibrium concentrations. Le Ch&#226;telier's principle lets you predict qualitatively how a system responds to a disturbance.</p>
     <div class="tbl-wrap"><table><thead><tr><th>Stress</th><th>Shift Direction</th><th>Effect on K</th></tr></thead>
     <tbody>
       <tr><td>Add reactant</td><td>&#8594; (forward)</td><td>None</td></tr>
       <tr><td>Remove product</td><td>&#8594; (forward)</td><td>None</td></tr>
       <tr><td>Increase pressure (decrease V)</td><td>Toward fewer moles of gas</td><td>None</td></tr>
       <tr><td>Increase temperature</td><td>Toward endothermic direction</td><td><strong>Changes K</strong></td></tr>
       <tr><td>Add inert gas (constant V)</td><td>No shift</td><td>None</td></tr>
       <tr><td>Add catalyst</td><td>No shift (reaches equilibrium faster)</td><td>None</td></tr>
     </tbody></table></div>
     <div class="hbox hb-am"><h4>&#9888; Small-x Approximation</h4><ul>
       <li>If K is very small (&lt; 10&#8315;&#179;), assume x &#171; [initial]</li>
       <li>Then: Ka &#8776; x&#178; / [HA]&#8320; &#8594; x &#8776; &#8730;(Ka &#215; [HA]&#8320;)</li>
       <li>Verify: if x / [initial] &lt; 5%, approximation is valid</li>
       <li>If not valid: use the quadratic formula</li>
     </ul></div>`},
    {id:"7.3",title:"Ksp & Solubility Equilibria",
     content:`
     <p class="intro-text">For sparingly soluble ionic compounds, the equilibrium between solid and dissolved ions is described by K_sp. Understanding K_sp lets you predict when precipitation will occur.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Solubility Product (Ksp)</div><div class="term-body">For MmXn(s) &#8652; mM&#7504;&#8314;(aq) + nX&#8319;&#8315;(aq):<div class="term-eq">Ksp = [M&#7504;&#8314;]&#7504; [X&#8319;&#8315;]&#8319;</div>The solid is omitted. Larger Ksp = more soluble.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">Ksp = (ms)&#7504; (ns)&#8319;</div><div class="fdesc"><strong>Ksp from molar solubility (s).</strong> Example: CaF&#8322; &#8594; Ca&#178;&#8314; + 2F&#8315;. Ksp = (s)(2s)&#178; = 4s&#179;.</div></div>
       <div class="f-row"><div class="feq">Q &gt; Ksp &#8594; precipitates; Q &lt; Ksp &#8594; dissolves</div><div class="fdesc"><strong>Ion product Q.</strong> Calculate Q from given concentrations. If Q exceeds Ksp, precipitation occurs.</div></div>
     </div>
     <div class="hbox hb-cy"><h4>&#128309; Common Ion Effect &amp; Complex Ions</h4><ul>
       <li><strong>Common ion:</strong> Adding an ion already present shifts equilibrium &#8592;, reducing solubility</li>
       <li><strong>Complex ion formation:</strong> Adding ligands (NH&#8323;, CN&#8315;) that form stable complexes removes M&#8319;&#8314; from solution, dramatically increasing solubility</li>
       <li>AgCl(s) + 2NH&#8323; &#8594; [Ag(NH&#8323;)&#8322;]&#8314; + Cl&#8315; &#8212; complex formation dissolves otherwise insoluble AgCl</li>
     </ul></div>`}
   ]},

  {id:8,title:"Acids & Bases",emoji:"&#129515;",
   lead:"Master proton transfer, pH calculations, buffers, and titration curves for all acid-base combinations.",
   topics:["Strong vs weak","Ka Kb","pH pOH","Polyprotic","Buffers","Henderson-Hasselbalch","Titrations","Indicators"],
   sublessons:[
    {id:"8.1",title:"Acid-Base Theories & pH",diagram:"phScale",
     content:`
     <p class="intro-text">Acids and bases are defined by three progressively broader theories. The Br&#248;nsted-Lowry theory is most used in USNCO; Lewis theory broadens the concept to all electron pair chemistry.</p>
     <div class="tbl-wrap"><table><thead><tr><th>Theory</th><th>Acid</th><th>Base</th><th>Scope</th></tr></thead>
     <tbody>
       <tr><td><strong>Arrhenius</strong></td><td>Produces H&#8314; in water</td><td>Produces OH&#8315; in water</td><td>Aqueous solutions only</td></tr>
       <tr><td><strong>Br&#248;nsted-Lowry</strong></td><td>Proton (H&#8314;) donor</td><td>Proton acceptor</td><td>Any protic solvent</td></tr>
       <tr><td><strong>Lewis</strong></td><td>Electron pair acceptor</td><td>Electron pair donor</td><td>Broadest &#8212; all coordination chemistry</td></tr>
     </tbody></table></div>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Conjugate Acid-Base Pairs</div><div class="term-body">HA donates H&#8314; to become A&#8315; (conjugate base). B accepts H&#8314; to become BH&#8314; (conjugate acid). They differ by exactly one H&#8314;.<div class="term-eq">Ka &#215; Kb = Kw = 1.0 &#215; 10&#8315;&#185;&#8308; (at 25&#176;C)</div>Stronger acid &#8594; weaker conjugate base.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">pH = &#8722;log[H&#8314;]</div><div class="fdesc"><strong>pH definition.</strong> At 25&#176;C: pH + pOH = 14. Kw = [H&#8314;][OH&#8315;] = 10&#8315;&#185;&#8308;. Pure water: pH = 7.</div></div>
       <div class="f-row"><div class="feq">pKa = &#8722;log Ka</div><div class="fdesc"><strong>pKa.</strong> Lower pKa = stronger acid. Acetic acid pKa = 4.74. HF pKa = 3.17. NH&#8324;&#8314; pKa = 9.25.</div></div>
     </div>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--re)"></div><div class="card-icon">&#9889;</div><h3>6 Strong Acids</h3><p>HCl, HBr, HI, HNO&#8323;, H&#8322;SO&#8324; (1st proton), HClO&#8324;. Fully dissociate: [H&#8314;] = initial [acid]. No ICE table needed.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--am)"></div><div class="card-icon">&#9889;</div><h3>Strong Bases</h3><p>Group 1 hydroxides (NaOH, KOH, etc.) and heavy Group 2 (Ca(OH)&#8322;, Sr(OH)&#8322;, Ba(OH)&#8322;). [OH&#8315;] = initial [base] &#215; stoichiometry.</p></div>
     </div>`},
    {id:"8.2",title:"Weak Acid/Base Calculations",
     content:`
     <p class="intro-text">Weak acids and bases only partially dissociate, establishing an equilibrium. This requires ICE table calculations. The key: for weak acids, approximate [H&#8314;] using the small-x assumption when Ka is small.</p>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Write the dissociation equilibrium</h4><p>HA &#8652; H&#8314; + A&#8315; with Ka = [H&#8314;][A&#8315;]/[HA]. For weak base: B + H&#8322;O &#8652; BH&#8314; + OH&#8315; with Kb.</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Set up ICE table</h4><p>I = initial concentrations, C = change (&#8722;x for HA, +x for products), E = equilibrium (0.1&#8722;x, x, x).</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Substitute into Ka and solve</h4><p>Ka = x&#178;/(0.1&#8722;x). If Ka &lt; 10&#8315;&#179;: assume x &#171; 0.1 &#8594; x &#8776; &#8730;(Ka &#215; 0.1). Verify x/0.1 &lt; 5% or use quadratic.</p></div></div>
       <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Calculate pH</h4><p>pH = &#8722;log(x). For weak base: find x = [OH&#8315;], pOH = &#8722;log[OH&#8315;], pH = 14 &#8722; pOH.</p></div></div>
     </div>
     <div class="hbox hb-pu"><h4>&#129514; Polyprotic Acids</h4><ul>
       <li>H&#8322;SO&#8324;: Ka&#8321; = &#8734; (strong), Ka&#8322; = 0.012</li>
       <li>H&#8323;PO&#8324;: Ka&#8321; = 7.5&#215;10&#8315;&#179;, Ka&#8322; = 6.2&#215;10&#8315;&#8312;, Ka&#8323; = 4.8&#215;10&#8315;&#185;&#179;</li>
       <li>Each successive ionization is ~10&#8308;&#8722;10&#8309; times harder</li>
       <li>For pH calculations, only Ka&#8321; contributes significantly (ignore Ka&#8322;, Ka&#8323;)</li>
     </ul></div>`},
    {id:"8.3",title:"Buffers & Titration Curves",diagram:"titrationCurve",
     content:`
     <p class="intro-text">A buffer solution resists pH changes. It contains a weak acid and its conjugate base (or weak base and conjugate acid) in similar concentrations.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Henderson-Hasselbalch Equation</div><div class="term-body">Simplified pH calculation for buffer solutions:<div class="term-eq">pH = pKa + log([A&#8315;]/[HA])</div>Valid when [A&#8315;]/[HA] is between 0.1 and 10. Best buffering when [A&#8315;] = [HA] &#8594; pH = pKa exactly.</div></div></div>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Choose the right acid for desired pH</h4><p>Select weak acid whose pKa is within &#177;1 of target pH. Acetic acid (pKa 4.74): buffers pH 3.7&#8211;5.7.</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Add strong acid to buffer</h4><p>H&#8314; + A&#8315; &#8594; HA. Reduces [A&#8315;], increases [HA]. Recalculate ratio.</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Add strong base to buffer</h4><p>OH&#8315; + HA &#8594; A&#8315; + H&#8322;O. Reduces [HA], increases [A&#8315;]. Recalculate ratio.</p></div></div>
     </div>
     <div class="hbox hb-re"><h4>&#128308; Titration Key Points</h4><ul>
       <li><strong>Strong + Strong:</strong> Equivalence point at pH 7. No buffering. Very steep jump at equivalence.</li>
       <li><strong>Weak acid + Strong base:</strong> Equivalence point at pH &gt; 7 (conjugate base A&#8315; hydrolyzes). Half-equivalence: pH = pKa.</li>
       <li><strong>Weak base + Strong acid:</strong> Equivalence point at pH &lt; 7. Buffer region above equivalence point.</li>
       <li><strong>Indicators:</strong> Choose indicator whose pKa &#8776; equivalence point pH. Color changes within &#177;1 of pKa.</li>
     </ul></div>`}
   ]},

  {id:9,title:"Chemical Kinetics",emoji:"&#9889;",
   lead:"How fast do reactions occur and why? Master rate laws, integrated rate laws, the Arrhenius equation, and reaction mechanisms.",
   topics:["Rate laws","Method of initial rates","Integrated rate laws","Half-life","Arrhenius equation","Reaction mechanisms","Catalysis"],
   sublessons:[
    {id:"9.1",title:"Rate Laws & Concentration",diagram:"rateOrders",
     content:`
     <p class="intro-text">The <strong>rate of a reaction</strong> is how quickly reactant concentrations decrease (or product concentrations increase) over time. The rate law shows how concentration affects this speed &#8212; and must be determined experimentally, not from stoichiometry.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Rate of Reaction</div><div class="term-body">For aA + bB &#8594; cC + dD:<div class="term-eq">rate = &#8722;(1/a) d[A]/dt = &#8722;(1/b) d[B]/dt = (1/c) d[C]/dt</div>Units: mol/L&#183;s or M/s. The negative sign for reactants indicates decreasing concentration.</div></div></div>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Rate Law</div><div class="term-body">The experimentally determined relationship between rate and concentration:<div class="term-eq">rate = k[A]&#7504; [B]&#8319;</div>k = rate constant (temperature dependent). m, n = reaction orders (can be 0, 1, 2, or fractions). Overall order = m + n. These CANNOT be determined from balanced equation &#8212; they come from experiments only.</div></div></div>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(79,142,247,.12)">&#128200;</div><div class="sec-title">Method of Initial Rates</div></div>
     <p class="intro-text">To determine reaction orders experimentally, compare experiments where one concentration is changed while others are held constant.</p>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Find two experiments where [B] is constant</h4><p>If [A] doubles and rate quadruples &#8594; 2&#7504; = 4 &#8594; m = 2 (second order in A)</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Use the ratio formula</h4><p>rate&#8322;/rate&#8321; = (k[A&#8322;]&#7504;[B&#8322;]&#8319;)/(k[A&#8321;]&#7504;[B&#8321;]&#8319;). Cancel constants and solve for the exponent.</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Find k from any experiment</h4><p>Substitute a complete set of rate, concentration, and orders into the rate law. Solve for k. Verify with another experiment.</p></div></div>
     </div></div>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(251,191,36,.12)">&#128290;</div><div class="sec-title">Units of the Rate Constant k</div></div>
     <div class="tbl-wrap"><table><thead><tr><th>Overall Order</th><th>Units of k</th><th>Rate Law Form</th></tr></thead>
     <tbody>
       <tr><td>0</td><td>M/s (or mol&#183;L&#8315;&#185;&#183;s&#8315;&#185;)</td><td>rate = k</td></tr>
       <tr><td>1</td><td>s&#8315;&#185;</td><td>rate = k[A]</td></tr>
       <tr><td>2</td><td>L&#183;mol&#8315;&#185;&#183;s&#8315;&#185; (M&#8315;&#185;&#183;s&#8315;&#185;)</td><td>rate = k[A]&#178; or k[A][B]</td></tr>
       <tr><td>3</td><td>L&#178;&#183;mol&#8315;&#178;&#183;s&#8315;&#185;</td><td>rate = k[A]&#178;[B]</td></tr>
     </tbody></table></div></div>
     <div class="hbox hb-am"><h4>&#9888; Pseudo-First Order Reactions</h4><ul>
       <li>When one reactant is in large excess, its concentration barely changes &#8212; it appears constant</li>
       <li>rate = k[A][B] where [B] &#8811; [A] becomes rate = k'[A] where k' = k[B]</li>
       <li>k' = observed (pseudo) first-order rate constant. Useful simplification in kinetics experiments.</li>
     </ul></div>`},
    {id:"9.2",title:"Integrated Rate Laws & Half-Life",
     content:`
     <p class="intro-text">Integrated rate laws give the concentration of a reactant as a function of time &#8212; essential for calculating how long a reaction has run, or predicting concentration at any future time. The graphical linearization method lets you determine order experimentally.</p>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(52,211,153,.12)">&#128200;</div><div class="sec-title">Integrated Rate Laws</div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">[A]&#7511; = [A]&#8320; &#8722; kt</div><div class="fdesc"><strong>Zero order.</strong> Concentration decreases linearly with time. Plot [A] vs t &#8594; straight line with slope = &#8722;k. Half-life: t&#189; = [A]&#8320;/2k (depends on initial concentration).</div></div>
       <div class="f-row"><div class="feq">ln[A]&#7511; = ln[A]&#8320; &#8722; kt</div><div class="fdesc"><strong>First order.</strong> Exponential decay. Plot ln[A] vs t &#8594; straight line with slope = &#8722;k. Half-life: <strong>t&#189; = 0.693/k = ln2/k</strong>. Constant half-life &#8212; independent of concentration! Radioactive decay, many drug clearance.</div></div>
       <div class="f-row"><div class="feq">1/[A]&#7511; = 1/[A]&#8320; + kt</div><div class="fdesc"><strong>Second order.</strong> Plot 1/[A] vs t &#8594; straight line with slope = k. Half-life: t&#189; = 1/(k[A]&#8320;) &#8212; doubles each half-life as [A] decreases.</div></div>
     </div></div>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(167,139,250,.12)">&#128293;</div><div class="sec-title">Graphical Method to Determine Order</div></div>
     <div class="card-grid">
       <div class="card"><div class="card-accent" style="background:var(--re)"></div><div class="card-icon">&#128200;</div><h3>0th Order Test</h3><p>Plot [A] vs time. If straight line &#8594; 0th order. Slope = &#8722;k. Occurs when catalyst is saturated (enzymatic reactions at high substrate concentration).</p></div>
       <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">&#128200;</div><h3>1st Order Test</h3><p>Plot <strong>ln[A] vs time</strong>. If straight line &#8594; 1st order. Slope = &#8722;k. The most common order for radioactive decay, many gas-phase decompositions.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--gr)"></div><div class="card-icon">&#128200;</div><h3>2nd Order Test</h3><p>Plot <strong>1/[A] vs time</strong>. If straight line &#8594; 2nd order. Slope = k. Bimolecular reactions often follow second-order kinetics.</p></div>
     </div></div>
     <div class="hbox hb-bl"><h4>&#128161; Half-Life Summary</h4><ul>
       <li><strong>0th order:</strong> t&#189; = [A]&#8320;/(2k) &#8212; decreases as reaction progresses (shorter each half-life)</li>
       <li><strong>1st order:</strong> t&#189; = 0.693/k &#8212; CONSTANT, independent of concentration</li>
       <li><strong>2nd order:</strong> t&#189; = 1/(k[A]&#8320;) &#8212; increases as reaction progresses (longer each half-life)</li>
       <li>After n half-lives: [A] = [A]&#8320; &#215; (1/2)&#8319;</li>
     </ul></div>`},
    {id:"9.3",title:"Arrhenius Equation & Activation Energy",diagram:"reactionCoordinate",
     content:`
     <p class="intro-text">The rate constant k is not truly constant &#8212; it depends strongly on temperature. The Arrhenius equation quantifies this dependence through the <strong>activation energy (Ea)</strong>, the minimum energy barrier reactants must overcome.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Activation Energy (Ea)</div><div class="term-body">The minimum energy that colliding molecules must have for a reaction to occur. Even if the reaction is highly exothermic, molecules must first "climb over" this energy barrier.<div class="term-eq">Ea = energy of transition state &#8722; energy of reactants</div>Higher Ea &#8594; slower reaction. Catalyst lowers Ea &#8594; faster reaction.</div></div></div>
     <div class="formula-list">
       <div class="f-row"><div class="feq">k = A &#183; e&#8315;&#8311;&#803;&#806;/&#8319;&#8319;</div><div class="fdesc"><strong>Arrhenius Equation.</strong> A = pre-exponential factor (frequency factor, related to collision frequency and geometry). R = 8.314 J/mol&#183;K. T in Kelvin. Ea in J/mol.</div></div>
       <div class="f-row"><div class="feq">ln(k&#8322;/k&#8321;) = &#8722;(Ea/R)(1/T&#8322; &#8722; 1/T&#8321;)</div><div class="fdesc"><strong>Two-temperature form.</strong> Used when you know k at two temperatures and want to find Ea, or find k at a new temperature. Derived by taking ln of Arrhenius equation at two temperatures and subtracting.</div></div>
       <div class="f-row"><div class="feq">ln k = &#8722;Ea/RT + ln A</div><div class="fdesc"><strong>Linear form.</strong> Plot ln k vs 1/T &#8594; straight line. Slope = &#8722;Ea/R. Intercept = ln A. Use this to determine Ea graphically from kinetics data at multiple temperatures.</div></div>
     </div>
     <div class="hbox hb-cy"><h4>&#128309; Collision Theory</h4><ul>
       <li>For a reaction to occur, molecules must (1) collide, (2) with sufficient energy (&#8805; Ea), and (3) with proper orientation</li>
       <li>Rate &#8733; (collision frequency) &#215; (fraction with E &#8805; Ea) &#215; (orientation factor)</li>
       <li>Fraction with E &#8805; Ea = e&#8315;&#7491;&#803;/&#8319;&#8311; &#8212; this is the Boltzmann factor</li>
       <li>Doubling T does NOT double the rate &#8212; it increases it by a factor of e&#916;(Ea/R)(1/T)</li>
       <li>Rule of thumb: rate roughly doubles per 10&#176;C rise (for Ea &#8776; 50 kJ/mol)</li>
     </ul></div>`},
    {id:"9.4",title:"Mechanisms & Catalysis",
     content:`
     <p class="intro-text">A reaction mechanism describes the step-by-step sequence of <strong>elementary steps</strong> by which reactants transform into products. The overall rate law is dictated by the slowest step &#8212; the rate-determining step.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Elementary Step</div><div class="term-
