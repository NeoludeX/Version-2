<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChemMaster — USNCO Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07090f;--bg2:#0c0f1d;--bg3:#111527;--bg4:#181d35;--bg5:#1f2544;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --txt:#e2e8f7;--mut:#7a85a3;--dim:#3d4566;
  --acc:#4f8ef7;--acc2:#6fa3ff;--acc-s:rgba(79,142,247,.12);
  --cy:#38d9d9;--gr:#34d399;--am:#fbbf24;--pu:#a78bfa;--pk:#f472b6;--re:#f87171;--or:#fb923c;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-size:15px;line-height:1.65;overflow-x:hidden}
.shell{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:270px;min-width:270px;background:var(--bg2);border-right:1px solid var(--bd);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.sidebar::-webkit-scrollbar{width:3px}.sidebar::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px}
.logo-area{padding:22px 18px 14px;border-bottom:1px solid var(--bd)}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--acc),var(--cy));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.logo-txt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.2px}
.logo-sub{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.prog-box{background:var(--bg3);border-radius:10px;padding:11px 13px}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:7px}
.prog-track{height:3px;background:var(--bd2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--cy));border-radius:99px;transition:width .5s}
.nav-sec{padding:12px 18px 5px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:500}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;transition:all .15s;margin:1px 7px;user-select:none}
.nav-item:hover{background:var(--bg3)}
.nav-item.active{background:var(--acc-s);border:1px solid rgba(79,142,247,.22)}
.nav-item.active .nav-num{background:var(--acc);color:#fff}
.nav-item.done .nav-num{background:var(--gr);color:#000}
.nav-num{width:22px;height:22px;border-radius:6px;background:var(--bg4);font-size:10.5px;font-weight:600;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;color:var(--mut);flex-shrink:0;transition:all .15s}
.nav-lbl{font-size:12px;color:var(--mut);line-height:1.3;transition:color .15s}
.nav-item:hover .nav-lbl,.nav-item.active .nav-lbl{color:var(--txt)}
.sidebar-foot{margin-top:auto;padding:12px 18px;border-top:1px solid var(--bd);font-size:11px;color:var(--dim)}

/* MAIN */
.main{margin-left:270px;flex:1;display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--bd);padding:13px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:12px}
.topbar-l{display:flex;align-items:center;gap:10px;min-width:0}
.hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;padding:6px;background:var(--bg3);border:1px solid var(--bd2);border-radius:7px;flex-shrink:0}
.hamburger span{width:15px;height:1.5px;background:var(--mut);border-radius:99px;display:block}
.tb-crumb{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.tb-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-r{display:flex;gap:7px;flex-shrink:0}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:none;font-family:'Inter',sans-serif;white-space:nowrap}
.btn-ghost{background:transparent;color:var(--mut);border:1px solid var(--bd2)}.btn-ghost:hover{color:var(--txt);background:var(--bg3)}
.btn-primary{background:var(--acc);color:#fff}.btn-primary:hover{background:var(--acc2)}
.btn-done{background:rgba(52,211,153,.13);color:var(--gr);border:1px solid rgba(52,211,153,.22)}.btn-done:hover{background:rgba(52,211,153,.22)}

/* CONTENT */
.content-wrap{padding:32px 36px;max-width:960px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.unit-badge{display:inline-flex;align-items:center;gap:6px;background:var(--acc-s);border:1px solid rgba(79,142,247,.2);color:var(--acc);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:5px 11px;border-radius:99px;margin-bottom:12px}
.unit-hero h1{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;letter-spacing:-.4px;line-height:1.18;margin-bottom:10px}
.hero-lead{font-size:15px;color:var(--mut);line-height:1.7;max-width:680px;margin-bottom:16px}
.hero-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px}
.htag{background:var(--bg3);border:1px solid var(--bd);color:var(--mut);font-size:11.5px;padding:3px 10px;border-radius:99px}

/* SUB-LESSON TABS */
.sublesson-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;border-bottom:1px solid var(--bd);padding-bottom:16px}
.sl-tab{padding:7px 14px;border-radius:8px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;color:var(--mut);border:1px solid transparent;user-select:none}
.sl-tab:hover{background:var(--bg3);color:var(--txt)}
.sl-tab.active{background:var(--acc-s);color:var(--acc2);border-color:rgba(79,142,247,.2)}

/* SECTION */
.section{margin-bottom:40px}
.sec-hdr{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.sec-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.sec-title{font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.divider{height:1px;background:var(--bd);margin:32px 0}
.intro-text{font-size:14.5px;color:var(--mut);line-height:1.72;margin-bottom:20px}
.intro-text strong{color:var(--txt);font-weight:500}

/* CARDS */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:17px;transition:all .18s;cursor:default;position:relative;overflow:hidden}
.card:hover{background:var(--bg3);border-color:var(--bd2);transform:translateY(-2px)}
.card-accent{position:absolute;top:0;left:0;right:0;height:2px}
.card-icon{font-size:18px;margin-bottom:9px}
.card h3{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;margin-bottom:7px}
.card p{font-size:12.5px;color:var(--mut);line-height:1.62}
.card p strong{color:var(--txt);font-weight:500}

/* FORMULAS */
.formula-list{display:flex;flex-direction:column;gap:9px}
.f-row{background:var(--bg2);border:1px solid var(--bd);border-radius:11px;padding:15px 19px;display:flex;align-items:flex-start;gap:15px;transition:border-color .15s}
.f-row:hover{border-color:var(--bd2)}
.feq{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:var(--cy);min-width:210px;flex-shrink:0;line-height:1.5}
.fdesc{font-size:12.5px;color:var(--mut);line-height:1.62}
.fdesc strong{color:var(--txt);font-weight:500}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--bg3);color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:9px 13px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--bd2)}
td{padding:9px 13px;border-top:1px solid var(--bd);color:var(--txt);vertical-align:top;line-height:1.5}
tr:hover td{background:rgba(255,255,255,.02)}

/* HIGHLIGHT BOXES */
.hbox{border-radius:10px;padding:15px 18px;margin-bottom:13px;border-left:3px solid}
.hb-bl{background:rgba(79,142,247,.06);border-color:var(--acc)}.hb-bl h4{color:var(--acc)}
.hb-gr{background:rgba(52,211,153,.06);border-color:var(--gr)}.hb-gr h4{color:var(--gr)}
.hb-am{background:rgba(251,191,36,.06);border-color:var(--am)}.hb-am h4{color:var(--am)}
.hb-pu{background:rgba(167,139,250,.06);border-color:var(--pu)}.hb-pu h4{color:var(--pu)}
.hb-re{background:rgba(248,113,113,.06);border-color:var(--re)}.hb-re h4{color:var(--re)}
.hb-cy{background:rgba(56,217,217,.06);border-color:var(--cy)}.hb-cy h4{color:var(--cy)}
.hbox h4{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.hbox p,.hbox li{font-size:13px;color:var(--mut);line-height:1.65}
.hbox ul{padding-left:17px}.hbox li{margin-bottom:4px}

/* TERM DEFINITION */
.term-def{background:var(--bg3);border:1px solid var(--bd2);border-radius:10px;padding:13px 16px;margin:14px 0;display:flex;align-items:flex-start;gap:12px}
.term-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.term-name{font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:var(--am);margin-bottom:3px}
.term-body{font-size:12.5px;color:var(--mut);line-height:1.6}
.term-body strong{color:var(--txt);font-weight:500}
.term-eq{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--cy);background:var(--bg4);padding:2px 7px;border-radius:5px;display:inline-block;margin-top:4px}

/* STEPS */
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:14px;position:relative}
.step:not(:last-child)::before{content:'';position:absolute;left:13px;top:30px;bottom:0;width:1px;background:var(--bd2)}
.step-n{width:26px;height:26px;border-radius:50%;background:var(--bg4);border:1px solid var(--bd2);font-size:11.5px;font-weight:600;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;color:var(--acc);flex-shrink:0;margin-top:2px}
.step-body{padding-bottom:22px;flex:1}
.step-body h4{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;margin-bottom:5px}
.step-body p{font-size:12.5px;color:var(--mut);line-height:1.6}

/* DIAGRAMS */
.diagram-wrap{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin:20px 0}
.diagram-head{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px}
.diagram-head-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600}
.diagram-head-sub{font-size:12px;color:var(--mut);margin-left:auto}
.diagram-body{padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.diagram-body svg{max-width:100%;display:block}
.diagram-controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;padding:12px 0 0}
.diagram-controls label{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:8px}
.diagram-controls input[type=range]{width:180px;accent-color:var(--acc);cursor:pointer}
.diagram-controls button{padding:6px 14px;border-radius:7px;background:var(--bg4);border:1px solid var(--bd2);color:var(--mut);font-size:12px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.diagram-controls button:hover{background:var(--bg5);color:var(--txt)}
.diagram-controls button.active{background:var(--acc-s);border-color:rgba(79,142,247,.3);color:var(--acc2)}
.diagram-legend{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap;justify-content:center}
.legend-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.diagram-caption{font-size:12px;color:var(--dim);text-align:center;padding:0 20px 16px;line-height:1.5}

/* ORBITAL GALLERY */
.orbital-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.orbital-card{background:var(--bg3);border:1px solid var(--bd);border-radius:10px;padding:14px;text-align:center}
.orbital-card svg{display:block;margin:0 auto 8px}
.orbital-name{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:var(--txt)}
.orbital-desc{font-size:11px;color:var(--mut);margin-top:3px}

/* BOHR ANIMATION */
.bohr-wrap{position:relative;width:280px;height:280px;margin:0 auto}
.bohr-nucleus{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,#f87171,#c53030);box-shadow:0 0 20px rgba(248,113,113,.4);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;color:#fff;z-index:5}
.bohr-orbit{position:absolute;top:50%;left:50%;border-radius:50%;border:1px solid rgba(79,142,247,.2)}
.bohr-orbit-1{width:80px;height:80px;margin-left:-40px;margin-top:-40px}
.bohr-orbit-2{width:140px;height:140px;margin-left:-70px;margin-top:-70px}
.bohr-orbit-3{width:210px;height:210px;margin-left:-105px;margin-top:-105px}
.bohr-electron{position:absolute;width:10px;height:10px;background:var(--acc);border-radius:50%;box-shadow:0 0 8px var(--acc);margin-left:-5px;margin-top:-5px}
@keyframes orbit1{from{transform:rotate(0deg) translateX(40px) rotate(0deg)}to{transform:rotate(360deg) translateX(40px) rotate(-360deg)}}
@keyframes orbit2{from{transform:rotate(0deg) translateX(70px) rotate(0deg)}to{transform:rotate(360deg) translateX(70px) rotate(-360deg)}}
@keyframes orbit3{from{transform:rotate(0deg) translateX(105px) rotate(0deg)}to{transform:rotate(360deg) translateX(105px) rotate(-360deg)}}
.e-1a{animation:orbit1 1.5s linear infinite;top:50%;left:50%}
.e-1b{animation:orbit1 1.5s linear infinite;top:50%;left:50%;animation-delay:-.75s}
.e-2a{animation:orbit2 3s linear infinite;top:50%;left:50%}
.e-2b{animation:orbit2 3s linear infinite;top:50%;left:50%;animation-delay:-1s}
.e-2c{animation:orbit2 3s linear infinite;top:50%;left:50%;animation-delay:-2s}
.e-2d{animation:orbit2 3s linear infinite;top:50%;left:50%;animation-delay:-1.5s}
.e-3a{animation:orbit3 5s linear infinite;top:50%;left:50%}
.bohr-label{position:absolute;font-size:10px;color:var(--mut);font-family:'Space Grotesk',sans-serif;font-weight:500}

/* HOME GRID */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.hc{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.hc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--acc-bar,var(--acc));opacity:0;transition:opacity .2s}
.hc:hover{background:var(--bg3);border-color:var(--bd2);transform:translateY(-2px)}
.hc:hover::before{opacity:1}
.hc-num{font-size:10.5px;color:var(--dim);font-weight:500;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.hc-title{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;margin-bottom:5px}
.hc-topics{font-size:12px;color:var(--mut);line-height:1.5}
.hc-status{display:inline-block;margin-top:9px;font-size:10.5px;padding:3px 8px;border-radius:99px}
.status-done{background:rgba(52,211,153,.13);color:var(--gr)}
.status-todo{background:var(--bg4);color:var(--dim)}

/* PILL TAGS */
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:500;margin:2px}
.p-bl{background:rgba(79,142,247,.15);color:var(--acc2)}
.p-gr{background:rgba(52,211,153,.15);color:var(--gr)}
.p-am{background:rgba(251,191,36,.15);color:var(--am)}
.p-re{background:rgba(248,113,113,.15);color:var(--re)}
.p-pu{background:rgba(167,139,250,.15);color:var(--pu)}
.p-cy{background:rgba(56,217,217,.15);color:var(--cy)}

/* DECAY CHAIN ANIMATION */
@keyframes pulse-glow{0%,100%{box-shadow:0 0 8px currentColor}50%{box-shadow:0 0 20px currentColor}}
.decay-node{animation:pulse-glow 2s ease-in-out infinite}

/* OVERLAY / RESPONSIVE */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
.overlay.show{display:block}
canvas{border-radius:8px;display:block}
@media(max-width:820px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0}.content-wrap{padding:22px 16px}.unit-hero h1{font-size:26px}
  .topbar{padding:12px 16px}.hamburger{display:flex}
  .f-row{flex-direction:column;gap:6px}.feq{min-width:unset}
}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="shell">

<nav class="sidebar" id="sidebar">
  <div class="logo-area">
    <div class="logo-row" onclick="loadHome()">
      <div class="logo-icon">⚗️</div>
      <div><div class="logo-txt">ChemMaster</div><div class="logo-sub">USNCO Prep</div></div>
    </div>
    <div class="prog-box">
      <div class="prog-row"><span>Progress</span><span id="prog-txt">0 / 15</span></div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="nav-sec">15 Units</div>
  <div id="nav-list"></div>
  <div class="sidebar-foot">USNCO Chemistry · Study Guide</div>
</nav>

<div class="main">
  <header class="topbar">
    <div class="topbar-l">
      <div class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></div>
      <div>
        <div class="tb-crumb" id="tb-crumb">USNCO Prep</div>
        <div class="tb-title" id="tb-title">All Units</div>
      </div>
    </div>
    <div class="topbar-r">
      <button class="btn btn-ghost" id="btn-prev" onclick="navUnit(-1)">&#8592; Prev</button>
      <button class="btn btn-done" id="btn-done" onclick="toggleDone()">&#10003; Mark Done</button>
      <button class="btn btn-primary" id="btn-next" onclick="navUnit(1)">Next &#8594;</button>
    </div>
  </header>
  <div id="content-area"></div>
</div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   DIAGRAM RENDERERS
══════════════════════════════════════════════════════════════ */
const Diagrams = {

  bohrModel: function(id) {
    const el = document.getElementById(id); if(!el) return;
    el.innerHTML = `<div class="diagram-wrap">
      <div class="diagram-head"><span>&#9883;</span><span class="diagram-head-title">Bohr Model — Hydrogen-like Atom</span><span class="diagram-head-sub">electrons orbit in discrete shells</span></div>
      <div class="diagram-body">
        <div class="bohr-wrap">
          <div class="bohr-orbit bohr-orbit-1"></div>
          <div class="bohr-orbit bohr-orbit-2"></div>
          <div class="bohr-orbit bohr-orbit-3"></div>
          <div class="bohr-nucleus">+</div>
          <div class="bohr-electron e-1a"></div><div class="bohr-electron e-1b"></div>
          <div class="bohr-electron e-2a"></div><div class="bohr-electron e-2b"></div>
          <div class="bohr-electron e-2c"></div>
          <div class="bohr-electron e-2d" style="background:var(--cy);box-shadow:0 0 8px var(--cy)"></div>
          <div class="bohr-electron e-3a" style="background:var(--gr);box-shadow:0 0 8px var(--gr)"></div>
          <div class="bohr-label" style="right:12px;top:48%">n=1</div>
          <div class="bohr-label" style="right:-2px;top:28%">n=2</div>
          <div class="bohr-label" style="right:-8px;top:10%">n=3</div>
        </div>
        <div class="diagram-legend">
          <span><span class="legend-dot" style="background:var(--acc)"></span>n=1 shell (max 2e&#8315;)</span>
          <span><span class="legend-dot" style="background:var(--cy)"></span>n=2 shell (max 8e&#8315;)</span>

  maxwellBoltzmann: function(id) {
    const el = document.getElementById(id); if(!el) return;
    el.innerHTML = `<div class="diagram-wrap">
      <div class="diagram-head"><span>&#128202;</span><span class="diagram-head-title">Maxwell&#8211;Boltzmann Speed Distribution</span><span class="diagram-head-sub">interactive &#8212; drag the slider</span></div>
      <div class="diagram-body">
        <canvas id="mb-canvas" width="560" height="270" style="background:var(--bg3);border-radius:8px"></canvas>
        <div class="diagram-controls">
          <label>Temperature: <strong id="mb-T" style="color:var(--am);min-width:50px;display:inline-block">300 K</strong>
            <input type="range" id="mb-slider" min="100" max="1500" value="300" step="10">
          </label>
          <div class="diagram-legend">
            <span><span class="legend-dot" style="background:#4f8ef7"></span>H&#8322; (2 g/mol)</span>
            <span><span class="legend-dot" style="background:#34d399"></span>N&#8322; (28 g/mol)</span>
            <span><span class="legend-dot" style="background:#fbbf24"></span>Ar (40 g/mol)</span>
          </div>
        </div>
      </div>
      <div class="diagram-caption">Higher temperature &#8594; peak shifts right and flattens. Lighter molecules &#8594; peak at higher speeds. Most probable speed (peak) = &#8730;(2RT/M).</div>
    </div>`;
    const canvas = document.getElementById('mb-canvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('mb-slider');
    const tempLabel = document.getElementById('mb-T');
    const gases = [{M:0.002,color:'#4f8ef7'},{M:0.028,color:'#34d399'},{M:0.040,color:'#fbbf24'}];
    const W=560,H=270,padL=48,padR=16,padT=16,padB=40;
    function mbf(v,M,T){const R=8.314;const a=M/(2*Math.PI*R*T);return 4*Math.PI*Math.pow(a,1.5)*v*v*Math.exp(-M*v*v/(2*R*T));}
    function drawMB(T){
      ctx.clearRect(0,0,W,H);ctx.fillStyle='#111527';ctx.fillRect(0,0,W,H);
      const vMax=Math.max(5000,Math.sqrt(2*8.314*T/0.002)*3.5);
      let yMax=0;
      gases.forEach(g=>{for(let v=0;v<=vMax;v+=vMax/500){const f=mbf(v,g.M,T);if(f>yMax)yMax=f;}});
      const plotW=W-padL-padR,plotH=H-padT-padB;
      ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;
      for(let i=0;i<=4;i++){const y=padT+plotH*(1-i/4);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+plotW,y);ctx.stroke();}
      ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,padT+plotH);ctx.lineTo(padL+plotW,padT+plotH);ctx.stroke();
      ctx.fillStyle='#4a5568';ctx.font='11px Inter';ctx.textAlign='center';
      for(let i=0;i<=5;i++){const v=Math.round(vMax*i/5);const x=padL+plotW*i/5;ctx.fillText((v/1000).toFixed(1)+'k',x,H-8);}
      ctx.fillText('speed (m/s)',padL+plotW/2,H-2);
      gases.forEach(g=>{
        ctx.beginPath();let first=true;
        for(let i=0;i<=500;i++){const v=vMax*i/500;const f=mbf(v,g.M,T);const x=padL+plotW*i/500;const y=padT+plotH*(1-f/yMax);
          if(first){ctx.moveTo(x,y);first=false;}else ctx.lineTo(x,y);}
        ctx.strokeStyle=g.color;ctx.lineWidth=2.5;ctx.stroke();
        ctx.lineTo(padL+plotW,padT+plotH);ctx.lineTo(padL,padT+plotH);ctx.closePath();
        ctx.fillStyle=g.color+'18';ctx.fill();
        const vMp=Math.sqrt(2*8.314*T/g.M);const fMp=mbf(vMp,g.M,T);
        const px=padL+plotW*(vMp/vMax);const py=padT+plotH*(1-fMp/yMax);
        ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fillStyle=g.color;ctx.fill();
        ctx.setLineDash([3,4]);ctx.strokeStyle=g.color+'60';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,padT+plotH);ctx.stroke();ctx.setLineDash([]);
      });
    }
    slider.addEventListener('input',()=>{const T=+slider.value;tempLabel.textContent=T+' K';drawMB(T);});
    drawMB(300);
  },

      const elecColor=isLow?'var(--acc)':'var(--gr)';

      if(!isLow){

          svg+=`<text x="${p.x-4}" y="${t2gY-3}" fill="${elecColor}" font-size="12" text-anchor="middle">&#8593;</text>`;

  rateOrders: function(id){
    const el=document.getElementById(id); if(!el) return;
    let order=1;
    function draw(){
      const W=560,H=260,padL=56,padB=40,padT=20,padR=20;
      const plotW=W-padL-padR,plotH=H-padB-padT;
      const k=0.05, A0=1.0, tMax=60;
      const conc=t=>{if(order===0)return Math.max(0,A0-k*t);if(order===1)return A0*Math.exp(-k*t);return A0/(1+k*A0*t);};
      let svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="background:var(--bg3);border-radius:8px">
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
        <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" stroke="rgba(255,255,255,.2)" stroke-width="1.5"/>
        <text x="${padL+plotW/2}" y="${H-4}" fill="#4a5568" font-size="11" text-anchor="middle">Time (s)</text>
        <text x="14" y="${padT+plotH/2}" fill="#4a5568" font-size="11" text-anchor="middle" transform="rotate(-90,14,${padT+plotH/2})">[A] (M)</text>`;
      for(let i=0;i<=5;i++){const x=padL+plotW*i/5;svg+=`<text x="${x}" y="${H-6}" fill="#4a5568" font-size="9" text-anchor="middle">${Math.round(tMax*i/5)}</text>`;}
      for(let i=0;i<=4;i++){const y=padT+plotH*i/4;svg+=`<text x="${padL-6}" y="${y+4}" fill="#4a5568" font-size="9" text-anchor="end">${(A0*(1-i/4)).toFixed(2)}</text><line x1="${padL}" y1="${y}" x2="${padL+plotW}" y2="${y}" stroke="rgba(255,255,255,.04)" stroke-width="1"/>`;}
      const colors=['#f87171','#4f8ef7','#34d399'];
      [0,1,2].forEach(ord=>{
        let pts=[];
        for(let i=0;i<=100;i++){const t=tMax*i/100;const c=ord===0?Math.max(0,A0-k*t):ord===1?A0*Math.exp(-k*t):A0/(1+k*A0*t);const x=padL+plotW*i/100;const y=padT+plotH*(1-c/A0);pts.push(`${x},${y}`);}
        svg+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${colors[ord]}" stroke-width="${ord===order?3:1.5}" stroke-dasharray="${ord===order?'none':'4,3'}" opacity="${ord===order?1:.4}"/>`;
        const label=['0th order','1st order','2nd order'][ord];
        const labelY=padT+10+ord*18;
        svg+=`<text x="${padL+plotW-10}" y="${labelY}" fill="${colors[ord]}" font-size="10" text-anchor="end" opacity="${ord===order?1:.4}">${label}</text>`;
      });
      svg+='</svg>';
      const w=document.getElementById('ro-svg');if(w)w.innerHTML=svg;
    }
    el.innerHTML=`<div class="diagram-wrap">
      <div class="diagram-head"><span>&#128200;</span><span class="diagram-head-title">Concentration vs Time &#8212; Reaction Orders</span><span class="diagram-head-sub">interactive &#8212; select the order</span></div>
      <div class="diagram-body">
        <div id="ro-svg" style="width:100%;max-width:560px"></div>
        <div class="diagram-controls">
          <button onclick="switchOrder(0,this)">0th Order</button>
          <button class="active" onclick="switchOrder(1,this)">1st Order</button>
          <button onclick="switchOrder(2,this)">2nd Order</button>
        </div>
      </div>
      <div class="diagram-caption">Each reaction order gives a characteristic curve shape. Linearizing the data (ln[A] vs t for 1st order, 1/[A] vs t for 2nd order) lets you determine order from a straight-line graph.</div>
    </div>`;
    window.switchOrder=function(o,btn){order=o;document.querySelectorAll('#'+id+' .diagram-controls button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');draw();};
    draw();
  },

       <div class="card"><div class="card-accent" style="background:var(--dim)"></div><div class="card-icon">&#9899;</div><h3>Dalton (1803)</h3><p>Atoms are indivisible spheres. All atoms of one element are identical. Explained law of definite proportions and mass conservation.</p></div>

    {id:"1.2",title:"Quantum Numbers & Orbitals",diagram:"orbitalShapes",
     content:`
     <p class="intro-text">The quantum mechanical model describes electrons using <strong>wave functions (&#968;)</strong>. &#968;&#178; gives the probability of finding an electron at a given point &#8212; this probability distribution defines the shape of an <strong>orbital</strong>.</p>
     <div class="term-def"><div class="term-icon">&#128218;</div><div><div class="term-name">Heisenberg Uncertainty Principle</div><div class="term-body">Impossible to know both exact position and exact momentum of an electron simultaneously.<div class="term-eq">&#916;x &#183; &#916;p &#8805; &#8463;/2 &nbsp;(&#8463; = h/2&#960;)</div>This is why orbitals (probability regions) replace exact orbits.</div></div></div>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(167,139,250,.12)">&#128290;</div><div class="sec-title">The Four Quantum Numbers</div></div>

       <div class="card"><div class="card-accent" style="background:var(--acc)"></div><div class="card-icon">1&#65039;&#8419;</div><h3>Principal (n)</h3><p>Specifies the <strong>shell</strong>. n = 1,2,3&#8230; Higher n = larger orbital = higher energy = farther from nucleus. Max electrons in shell = <strong>2n&#178;</strong>.</p></div>

    {id:"1.3",title:"Electron Configuration",
     content:`
     <p class="intro-text">Electron configuration describes how electrons are distributed among orbitals. Three rules govern filling, and exceptions reveal how stability truly works.</p>
     <div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(79,142,247,.12)">&#128203;</div><div class="sec-title">Three Filling Rules</div></div>
     <div class="steps">
       <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Aufbau Principle</h4><p>Fill orbitals in order of increasing energy: 1s &#8594; 2s &#8594; 2p &#8594; 3s &#8594; 3p &#8594; <strong>4s &#8594; 3d</strong> &#8594; 4p &#8594; 5s &#8594; 4d &#8230; The 4s fills before 3d because it has lower energy in the free atom. Memorize using the diagonal rule or periodic table blocks.</p></div></div>
       <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Pauli Exclusion Principle</h4><p>No two electrons in the same atom can have the same four quantum numbers. Each orbital holds a maximum of 2 electrons with opposite spins (&#8593;&#8595;).</p></div></div>
       <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Hund's Rule of Maximum Multiplicity</h4><p>Within a subshell, place one electron in each orbital before pairing. All singly occupied orbitals have the same spin. This minimizes electron-electron repulsion. Carbon = 1s&#178;2s&#178;2p&#185;2p&#185; (two separate 2p orbitals), NOT 2p&#178;&#8593;&#8595; in one orbital.</p></div></div>
     </div></div>

       <div class="card"><div class="card-accent" style="background:var(--pu)"></div><div class="card-icon">&#128203;</div><h3>Cation Configurations</h3><p>Transition metals lose 4s electrons <strong>first</strong> when forming cations. Fe&#179;&#8314;: [Ar] 3d&#8309;. The 4s is higher energy in a cation.</p></div>
       <div class="card"><div class="card-accent" style="background:var(--cy)"></div><div class="card-icon">&#128203;</div><h3>Paramagnetism</h3><p><strong>Paramagnetic:</strong> unpaired electrons &#8594; attracted to magnetic field. <strong>Diamagnetic:</strong> all paired &#8594; weakly repelled. Count unpaired e&#8315; from electron config.</p></div>
