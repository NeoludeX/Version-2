<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChemMaster — USNCO Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07090f;--bg2:#0c0f1d;--bg3:#111527;--bg4:#181d35;--bg5:#1f2544;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#e2e8f7;--muted:#7a85a3;--dim:#3d4566;
  --accent:#4f8ef7;--accent-soft:rgba(79,142,247,.12);
  --cyan:#38d9d9;--green:#34d399;--amber:#fbbf24;
  --purple:#a78bfa;--pink:#f472b6;--red:#f87171;--orange:#fb923c;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.65;min-height:100vh;overflow-x:hidden}
.shell{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{width:272px;min-width:272px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;display:flex;flex-direction:column;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:99px}
.logo-wrap{padding:24px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo-icon{width:34px;height:34px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo-text{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.2px}
.logo-sub{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.prog-wrap{background:var(--bg3);border-radius:10px;padding:12px 14px}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:7px}
.prog-track{height:3px;background:var(--border2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
.nav-section{padding:12px 20px 6px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;transition:all .15s;margin:1px 8px;user-select:none}
.nav-item:hover{background:var(--bg3)}
.nav-item.active{background:var(--accent-soft);border:1px solid rgba(79,142,247,.22)}
.nav-num{width:24px;height:24px;border-radius:6px;background:var(--bg4);font-size:11px;font-weight:600;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;transition:all .15s}
.nav-item.active .nav-num{background:var(--accent);color:#fff}
.nav-item.done .nav-num{background:var(--green);color:#000}
.nav-label{font-size:12.5px;color:var(--muted);line-height:1.3;transition:color .15s}
.nav-item.active .nav-label,.nav-item:hover .nav-label{color:var(--text)}
.sidebar-foot{margin-top:auto;padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--dim);flex-shrink:0}

/* MAIN */
.main{margin-left:272px;flex:1;display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 36px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:16px}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;padding:7px;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;flex-shrink:0}
.hamburger span{width:16px;height:1.5px;background:var(--muted);border-radius:99px;display:block}
.topbar-info{min-width:0}
.tb-crumb{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.tb-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;gap:8px;flex-shrink:0}
.btn{padding:7px 16px;border-radius:7px;font-size:12.5px;font-weight:500;cursor:pointer;transition:all .15s;border:none;font-family:'Inter',sans-serif;white-space:nowrap}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2)}
.btn-ghost:hover{color:var(--text);background:var(--bg3)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#6fa3ff}
.btn-done{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.btn-done:hover{background:rgba(52,211,153,.25)}

/* CONTENT */
.content-wrap{padding:36px 40px;max-width:940px;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* HERO */
.unit-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid rgba(79,142,247,.2);color:var(--accent);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:5px 12px;border-radius:99px;margin-bottom:14px}
.unit-hero h1{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.18;margin-bottom:12px}
.unit-hero p.lead{font-size:15.5px;color:var(--muted);line-height:1.7;max-width:700px;margin-bottom:20px}
.hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:32px}
.htag{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:4px 12px;border-radius:99px}

/* SECTION */
.section{margin-bottom:44px}
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.sec-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.sec-title{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.divider{height:1px;background:var(--border);margin:36px 0}

/* CARDS */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:18px;transition:all .18s;cursor:default}
.card:hover{background:var(--bg3);border-color:var(--border2);transform:translateY(-2px)}
.card-icon{font-size:20px;margin-bottom:10px}
.card h3{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin-bottom:7px;color:var(--text)}
.card p{font-size:12.5px;color:var(--muted);line-height:1.6}

/* FORMULAS */
.formula-list{display:flex;flex-direction:column;gap:10px}
.formula-row{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:16px 20px;display:flex;align-items:flex-start;gap:16px}
.formula-row:hover{border-color:var(--border2)}
.feq{font-family:'JetBrains Mono',monospace;font-size:14.5px;font-weight:500;color:var(--cyan);min-width:220px;flex-shrink:0;line-height:1.5}
.fdesc{font-size:12.5px;color:var(--muted);line-height:1.6}
.fdesc strong{color:var(--text);font-weight:500}

/* TABLE */
.tbl-wrap{overflow-x:auto;border-radius:11px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--bg3);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:500;padding:10px 14px;text-align:left;white-space:nowrap}
td{padding:9px 14px;border-top:1px solid var(--border);color:var(--text);vertical-align:top}
tr:hover td{background:var(--bg2)}

/* HIGHLIGHT BOXES */
.hbox{border-radius:11px;padding:16px 20px;margin-bottom:14px;border-left:3px solid}
.hbox-blue{background:rgba(79,142,247,.06);border-color:var(--accent)}
.hbox-green{background:rgba(52,211,153,.06);border-color:var(--green)}
.hbox-amber{background:rgba(251,191,36,.06);border-color:var(--amber)}
.hbox-purple{background:rgba(167,139,250,.06);border-color:var(--purple)}
.hbox-red{background:rgba(248,113,113,.06);border-color:var(--red)}
.hbox-cyan{background:rgba(56,217,217,.06);border-color:var(--cyan)}
.hbox h4{font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}
.hbox-blue h4{color:var(--accent)} .hbox-green h4{color:var(--green)} .hbox-amber h4{color:var(--amber)}
.hbox-purple h4{color:var(--purple)} .hbox-red h4{color:var(--red)} .hbox-cyan h4{color:var(--cyan)}
.hbox p,.hbox li{font-size:13px;color:var(--muted);line-height:1.65}
.hbox ul{padding-left:18px}.hbox li{margin-bottom:4px}

/* STEPS */
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:16px;position:relative}
.step:not(:last-child)::before{content:'';position:absolute;left:14px;top:32px;bottom:0;width:1px;background:var(--border2)}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);font-size:12px;font-weight:600;font-family:'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0;margin-top:2px}
.step-body{padding-bottom:24px;flex:1}
.step-body h4{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;margin-bottom:5px}
.step-body p{font-size:12.5px;color:var(--muted);line-height:1.6}

/* TAGS */
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:500}
.pill-blue{background:rgba(79,142,247,.15);color:var(--accent)}
.pill-green{background:rgba(52,211,153,.15);color:var(--green)}
.pill-amber{background:rgba(251,191,36,.15);color:var(--amber)}
.pill-red{background:rgba(248,113,113,.15);color:var(--red)}
.pill-purple{background:rgba(167,139,250,.15);color:var(--purple)}
.pill-cyan{background:rgba(56,217,217,.15);color:var(--cyan)}

/* HOME */
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.home-card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:18px 20px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.home-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .2s}
.home-card:hover{background:var(--bg3);border-color:var(--border2);transform:translateY(-2px)}
.home-card:hover::before{opacity:1}
.hc-num{font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.hc-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--text)}
.hc-topics{font-size:12px;color:var(--muted);line-height:1.5}
.hc-badge{display:inline-block;margin-top:10px;font-size:10.5px;padding:3px 9px;border-radius:99px}
.done-badge{background:rgba(52,211,153,.15);color:var(--green)}
.todo-badge{background:var(--bg4);color:var(--dim)}

/* DEEP DIVE LESSONS */
.lesson-map{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:24px}
.map-node{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;position:relative;min-height:88px}
.map-node::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--cyan));opacity:.65}
.map-kicker{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:6px}
.map-node h4{font-family:'Space Grotesk',sans-serif;font-size:13px;line-height:1.25;margin-bottom:5px}
.map-node p{font-size:12px;color:var(--muted);line-height:1.45}
.sublesson{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px}
.sublesson h3{font-family:'Space Grotesk',sans-serif;font-size:15px;margin-bottom:8px}
.sublesson p{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px}
.sublesson ul{padding-left:18px;margin-top:6px}
.sublesson li{font-size:12.5px;color:var(--muted);line-height:1.65;margin-bottom:5px}
.worked-example{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:12px}
.worked-example h4{font-family:'Space Grotesk',sans-serif;color:var(--green);font-size:12px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
.worked-example p{font-size:12.5px;margin-bottom:0}
.diagram-card{background:radial-gradient(circle at top left,rgba(79,142,247,.12),transparent 38%),var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;overflow:hidden}
.diagram-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.diagram-head h3{font-family:'Space Grotesk',sans-serif;font-size:15px;margin-bottom:4px}
.diagram-head p{font-size:12.5px;color:var(--muted);line-height:1.55}
.diagram-controls{display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0}
.diagram-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--muted);border-radius:7px;padding:5px 9px;font-size:11px;cursor:pointer}
.diagram-btn.active,.diagram-btn:hover{color:var(--text);background:var(--accent-soft);border-color:rgba(79,142,247,.35)}
.visual-stage{min-height:230px;border:1px solid var(--border);border-radius:10px;background:linear-gradient(180deg,rgba(17,21,39,.72),rgba(7,9,15,.5));position:relative;display:flex;align-items:center;justify-content:center;padding:16px}
.visual-stage svg{width:min(100%,620px);height:220px;display:block;overflow:visible}
.diagram-note{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:12px;min-height:40px}
.concept-glossary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.glossary-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.glossary-item h4{font-family:'Space Grotesk',sans-serif;font-size:12.5px;color:var(--cyan);margin-bottom:6px}
.glossary-item p{font-size:12.5px;color:var(--muted);line-height:1.6}
.floaty{animation:floaty 3.4s ease-in-out infinite}
.pulse-dot{animation:pulseDot 1.8s ease-in-out infinite}
.spin-slow{transform-origin:center;animation:spinSlow 14s linear infinite}
.wave-line{stroke-dasharray:6 8;animation:dashFlow 2.6s linear infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulseDot{0%,100%{opacity:.45;r:4}50%{opacity:1;r:7}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes dashFlow{to{stroke-dashoffset:-42}}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
.overlay.show{display:block}

/* RESPONSIVE */
@media(max-width:800px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .content-wrap{padding:24px 18px}
  .unit-hero h1{font-size:26px}
  .topbar{padding:12px 18px}
  .hamburger{display:flex}
  .formula-row{flex-direction:column;gap:6px}
  .feq{min-width:unset}
  .diagram-head{flex-direction:column}
  .visual-stage{min-height:200px;padding:10px}
  .visual-stage svg{height:190px}
}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="shell">

<nav class="sidebar" id="sidebar">
  <div class="logo-wrap">
    <div class="logo-row">
      <div class="logo-icon">⚗️</div>
      <div><div class="logo-text">ChemMaster</div><div class="logo-sub">USNCO Prep</div></div>
    </div>
    <div class="prog-wrap">
      <div class="prog-row"><span>Progress</span><span id="prog-text">0 / 15</span></div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    </div>
  </div>
  <div class="nav-section">15 Units</div>
  <div id="nav-list"></div>
  <div class="sidebar-foot">USNCO Chemistry · Study Guide</div>
</nav>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <div class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></div>
      <div class="topbar-info"><div class="tb-crumb" id="tb-crumb">USNCO Prep</div><div class="tb-title" id="tb-title">All Units</div></div>
    </div>
    <div class="topbar-right">
      <button class="btn btn-ghost" id="btn-prev" onclick="navUnit(-1)">← Prev</button>
      <button class="btn btn-done" id="btn-done" onclick="toggleDone()">✓ Mark Done</button>
      <button class="btn btn-primary" id="btn-next" onclick="navUnit(1)">Next →</button>
    </div>
  </header>
  <div id="content-area"></div>
</div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const UNITS = [
  {
    id:1, title:"Atomic Structure & Periodicity", emoji:"⚛️",
    topics:["Structure of the atom","Subatomic particles","Isotopes","Quantum numbers","Electron configuration","Orbital shapes","Effective nuclear charge","Periodic trends","Photoelectron spectroscopy"],
    lead:"The foundation of all chemistry. Understand how electrons are arranged, how atoms differ, and how position on the periodic table predicts behavior.",
    content:`
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(79,142,247,.12)">🧱</div><div class="sec-title">Core Concepts</div></div>
      <div class="card-grid">
        <div class="card"><div class="card-icon">🔢</div><h3>Subatomic Particles</h3><p>Proton (+1, in nucleus), neutron (0, in nucleus), electron (−1, around nucleus). Atomic number Z = proton count. Mass number A = protons + neutrons. Electrons = protons in neutral atom.</p></div>
        <div class="card"><div class="card-icon">⚖️</div><h3>Isotopes & Mass</h3><p>Same element, different neutron count. Average atomic mass = Σ(isotope mass × natural abundance as decimal). Mass spectrometry separates by mass-to-charge ratio (m/z).</p></div>
        <div class="card"><div class="card-icon">🌊</div><h3>Quantum Numbers</h3><p><strong>n</strong>: principal (shell, energy level, 1,2,3…) · <strong>ℓ</strong>: angular momentum (0=s, 1=p, 2=d, 3=f) · <strong>mℓ</strong>: magnetic (−ℓ to +ℓ) · <strong>ms</strong>: spin (+½ or −½). No two electrons share all four.</p></div>
        <div class="card"><div class="card-icon">📐</div><h3>Orbital Shapes</h3><p>s orbitals: spherical. p orbitals: dumbbell along x, y, or z axes (3 total). d orbitals: 5 complex shapes. f orbitals: 7 shapes. Higher n → larger, higher energy orbital.</p></div>
        <div class="card"><div class="card-icon">⚡</div><h3>Effective Nuclear Charge</h3><p>Z<sub>eff</sub> = Z − σ (shielding). Inner electrons shield outer electrons from the full nuclear charge. Increases across a period → explains most periodic trends.</p></div>
        <div class="card"><div class="card-icon">📉</div><h3>Photoelectron Spectroscopy</h3><p>Measures binding energy of electrons in each subshell. Peak position = binding energy (closer to nucleus = higher). Peak height ∝ electron count. Lower binding = outermost electrons.</p></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(56,217,217,.12)">📐</div><div class="sec-title">Key Formulas</div></div>
      <div class="formula-list">
        <div class="formula-row"><div class="feq">E = hν = hc/λ</div><div class="fdesc"><strong>Photon energy.</strong> h = 6.626×10⁻³⁴ J·s, ν = frequency (Hz), c = 3.0×10⁸ m/s, λ = wavelength. Higher frequency = higher energy.</div></div>
        <div class="formula-row"><div class="feq">avg mass = Σ(mᵢ × fᵢ)</div><div class="fdesc"><strong>Weighted average atomic mass.</strong> mᵢ = mass of isotope i, fᵢ = fractional abundance (percent ÷ 100).</div></div>
        <div class="formula-row"><div class="feq">Z_eff ≈ Z − σ</div><div class="fdesc"><strong>Effective nuclear charge.</strong> σ = shielding constant (sum of inner electron contributions). Slater's rules give σ for each electron precisely.</div></div>
        <div class="formula-row"><div class="feq">n = 1, 2, 3 … shells: 2n² e⁻</div><div class="fdesc"><strong>Max electrons per shell.</strong> n=1→2, n=2→8, n=3→18, n=4→32. Subshell capacity: s=2, p=6, d=10, f=14.</div></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(167,139,250,.12)">📋</div><div class="sec-title">Electron Configuration Rules</div></div>
      <div class="steps">
        <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Aufbau Principle</h4><p>Fill lowest energy orbitals first. Order: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p 6s 4f 5d 6p … (use diagonal arrow rule or memorize).</p></div></div>
        <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Pauli Exclusion Principle</h4><p>Each orbital holds max 2 electrons with opposite spins (↑↓). No two electrons in the same atom share all four quantum numbers.</p></div></div>
        <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Hund's Rule</h4><p>Within a subshell, place one electron in each orbital before pairing. All singly occupied orbitals have same spin. Minimizes repulsion.</p></div></div>
        <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Key Exceptions</h4><p>Cr = [Ar] 3d⁵ 4s¹ and Cu = [Ar] 3d¹⁰ 4s¹ — half-filled and full d subshells are extra stable. Know Mo, Ag similarly.</p></div></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(251,191,36,.12)">📊</div><div class="sec-title">Periodic Trends</div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Property</th><th>Across Period →</th><th>Down Group ↓</th><th>Reason</th></tr></thead><tbody>
        <tr><td>Atomic Radius</td><td>Decreases</td><td>Increases</td><td>More protons pull electrons in; more shells add size</td></tr>
        <tr><td>1st Ionization Energy</td><td>Increases (exceptions: B&lt;Be, O&lt;N)</td><td>Decreases</td><td>Higher Z_eff holds electrons more tightly</td></tr>
        <tr><td>Electron Affinity</td><td>Generally increases</td><td>Generally decreases</td><td>Halogens highest; noble gases anomalous</td></tr>
        <tr><td>Electronegativity</td><td>Increases</td><td>Decreases</td><td>F = 4.0 (highest); Fr lowest</td></tr>
        <tr><td>Ionic Radius (cation)</td><td>Smaller than parent atom</td><td>Increases</td><td>Losing electrons → less shielding, more nuclear pull</td></tr>
      </tbody></table></div>
    </div>
    <div class="hbox hbox-amber"><h4>⚠ USNCO Exam Tips</h4><ul>
      <li>IE exceptions: B &lt; Be (2p easier to remove than 2s) and O &lt; N (paired 2p electron easier to remove)</li>
      <li>PES: always identify subshells from right (lowest BE = outermost); peak area = relative electron count</li>
      <li>Isoelectronic species: same e⁻ count, different Z → compare radius using nuclear charge</li>
      <li>Transition metals: fill 4s before 3d, but lose 4s electrons FIRST when forming cations</li>
    </ul></div>`

    lead:"From electron transfer to electron sharing — understand how and why atoms bond, how to visualize molecular geometry, and how structure drives properties.",
    content:`
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(56,217,217,.12)">🔗</div><div class="sec-title">Bond Types</div></div>
      <div class="card-grid">
        <div class="card"><div class="card-icon">🔵</div><h3>Ionic Bonding</h3><p>Electron transfer from metal to nonmetal. Held together by electrostatic attraction. Hard, high-melting, brittle solids. Conduct electricity when molten or dissolved. Strength ∝ charge²/radius (lattice energy).</p></div>
        <div class="card"><div class="card-icon">🤝</div><h3>Covalent Bonding</h3><p>Electron sharing between nonmetals. Single (σ), double (σ+π), triple (σ+2π). Higher bond order → shorter, stronger bond. Bond polarity determined by electronegativity difference.</p></div>
        <div class="card"><div class="card-icon">🪨</div><h3>Metallic Bonding</h3><p>Cations in a delocalized "electron sea." Explains electrical conductivity, thermal conductivity, malleability, and luster. Stronger with higher charge density.</p></div>
        <div class="card"><div class="card-icon">↔️</div><h3>Resonance</h3><p>When multiple valid Lewis structures exist, the real structure is a hybrid. Electron density is delocalized. All resonance structures contribute; most stable = lowest formal charges on most electronegative atoms.</p></div>
        <div class="card"><div class="card-icon">🔢</div><h3>Formal Charge</h3><p>FC = (valence e⁻) − (lone pair e⁻) − ½(bonding e⁻). Best structure minimizes formal charges. Negative FC goes on most electronegative atom. Sum of FCs = overall charge.</p></div>
        <div class="card"><div class="card-icon">🏗️</div><h3>Hybridization</h3><p>sp: linear (180°) · sp²: trigonal planar (120°) · sp³: tetrahedral (109.5°) · sp³d: trigonal bipyramidal · sp³d²: octahedral. Count electron domains (bonds + lone pairs) on central atom to determine.</p></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(79,142,247,.12)">📐</div><div class="sec-title">VSEPR Geometry Table</div></div>
      <div class="tbl-wrap"><table><thead><tr><th>e⁻ Domains</th><th>Lone Pairs</th><th>Molecular Shape</th><th>Bond Angle</th><th>Example</th></tr></thead><tbody>
        <tr><td>2</td><td>0</td><td>Linear</td><td>180°</td><td>CO₂, BeCl₂</td></tr>
        <tr><td>3</td><td>0</td><td>Trigonal planar</td><td>120°</td><td>BF₃, SO₃</td></tr>
        <tr><td>3</td><td>1</td><td>Bent</td><td>&lt;120°</td><td>SO₂, O₃</td></tr>
        <tr><td>4</td><td>0</td><td>Tetrahedral</td><td>109.5°</td><td>CH₄, NH₄⁺</td></tr>
        <tr><td>4</td><td>1</td><td>Trigonal pyramidal</td><td>&lt;109.5°</td><td>NH₃, PCl₃</td></tr>
        <tr><td>4</td><td>2</td><td>Bent</td><td>&lt;109.5°</td><td>H₂O, H₂S</td></tr>
        <tr><td>5</td><td>0</td><td>Trigonal bipyramidal</td><td>90°/120°</td><td>PCl₅</td></tr>
        <tr><td>5</td><td>1</td><td>See-saw</td><td>&lt;90°/120°</td><td>SF₄</td></tr>
        <tr><td>5</td><td>2</td><td>T-shaped</td><td>&lt;90°</td><td>ClF₃</td></tr>
        <tr><td>6</td><td>0</td><td>Octahedral</td><td>90°</td><td>SF₆</td></tr>
        <tr><td>6</td><td>1</td><td>Square pyramidal</td><td>&lt;90°</td><td>BrF₅</td></tr>
        <tr><td>6</td><td>2</td><td>Square planar</td><td>90°</td><td>XeF₄, [PtCl₄]²⁻</td></tr>
      </tbody></table></div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(251,191,36,.12)">🧲</div><div class="sec-title">Intermolecular Forces (Strongest → Weakest)</div></div>
      <div class="card-grid">
        <div class="card"><div class="card-icon">⊕</div><h3>Ion-Dipole</h3><p>Ion + polar molecule. Strongest IMF. Drives dissolution of ionic compounds in polar solvents. Critical in aqueous solutions.</p></div>
        <div class="card"><div class="card-icon">💧</div><h3>Hydrogen Bonding</h3><p>H bonded to F, O, or N interacting with lone pair on F, O, or N of another molecule. ~20 kJ/mol. Explains water's anomalously high bp, surface tension, ice density.</p></div>
        <div class="card"><div class="card-icon">↕️</div><h3>Dipole-Dipole</h3><p>Between permanent dipoles. Requires polar molecule. Positive end attracts negative end of neighbor. Stronger for larger dipole moments.</p></div>
        <div class="card"><div class="card-icon">🌐</div><h3>London Dispersion Forces</h3><p>Temporary dipoles in ALL molecules. Strength ∝ molar mass and surface area. Branching decreases surface area → lower LDF → lower boiling point.</p></div>
      </div>
    </div>
    <div class="hbox hbox-blue"><h4>💡 Lattice Energy</h4><ul>
      <li>Energy released when gaseous ions form a crystalline solid</li>
      <li>Larger lattice energy = harder, higher melting, less soluble solid</li>
      <li>Lattice energy ∝ |charge₁ × charge₂| / (r₊ + r₋) (Born-Landé concept)</li>
      <li>MgO &gt; NaF (2+ and 2− charges vs 1+ and 1−, similar radii)</li>
      <li>Determined experimentally using Born-Haber cycle (Hess's Law)</li>
    </ul></div>
    <div class="hbox hbox-amber"><h4>⚠ USNCO Tips</h4><ul>
      <li>Expanded octets only for Period 3+ central atoms (S, P, Cl, Xe, etc.)</li>
      <li>CO₂ linear → dipoles cancel → nonpolar. H₂O bent → dipoles don't cancel → polar</li>
      <li>Hybridization: count σ bonds + lone pairs on central atom (π bonds don't count)</li>
      <li>For USNCO: know bond angles deviate because lone pair-lone pair > lone pair-bond > bond-bond repulsion</li>
    </ul></div>`

    lead:"The language of chemistry — quantitative relationships between reactants and products, types of reactions, and how to balance and use them for calculations.",
    content:`
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(52,211,153,.12)">🔢</div><div class="sec-title">Key Formulas</div></div>
      <div class="formula-list">
        <div class="formula-row"><div class="feq">n = m / M</div><div class="fdesc"><strong>Moles = mass / molar mass.</strong> M in g/mol. Foundation of all stoichiometry. Always check units.</div></div>
        <div class="formula-row"><div class="feq">% yield = (actual / theoretical) × 100</div><div class="fdesc"><strong>Percent yield.</strong> Theoretical from limiting reagent calc. Actual measured experimentally.</div></div>
        <div class="formula-row"><div class="feq">M = n / V(L)</div><div class="fdesc"><strong>Molarity.</strong> Moles of solute per liter of solution. Most common AP/USNCO concentration unit.</div></div>
        <div class="formula-row"><div class="feq">M₁V₁ = M₂V₂</div><div class="fdesc"><strong>Dilution equation.</strong> Moles are conserved. Solve for any unknown given the other three.</div></div>
        <div class="formula-row"><div class="feq">% comp = (mass element / molar mass) × 100</div><div class="fdesc"><strong>Percent composition.</strong> First step to finding empirical formula from gravimetric data.</div></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(52,211,153,.12)">🔥</div><div class="sec-title">Reaction Types</div></div>
      <div class="card-grid">
        <div class="card"><div class="card-icon">🔄</div><h3>Redox</h3><p>Electron transfer. OIL RIG. Oxidizing agent is reduced; reducing agent is oxidized. Assign oxidation states to identify. Balance by half-reaction method in acidic or basic solution.</p></div>
        <div class="card"><div class="card-icon">🧪</div><h3>Acid-Base</h3><p>Proton transfer (Brønsted-Lowry). Strong acids/bases fully dissociate. Weak ones partially. Neutralization: acid + base → salt + water. Net ionic for strong+strong: H⁺ + OH⁻ → H₂O.</p></div>
        <div class="card"><div class="card-icon">⬇️</div><h3>Precipitation</h3><p>Two soluble ionic compounds mix → insoluble product forms. Use solubility rules to identify precipitate. Write net ionic equation by removing spectator ions.</p></div>
        <div class="card"><div class="card-icon">💨</div><h3>Combustion</h3><p>Hydrocarbon + O₂ → CO₂ + H₂O (complete). Incomplete combustion also produces CO or C(s). Always exothermic. Balance C first, then H, then O.</p></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(79,142,247,.12)">⚙️</div><div class="sec-title">Limiting Reagent — Method</div></div>
      <div class="steps">
        <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Balance the equation</h4><p>Correct mole ratios are essential — don't skip this.</p></div></div>
        <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Convert all reactants to moles</h4><p>Use molar mass (g → mol) or M × V (solution → mol).</p></div></div>
        <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Divide by stoichiometric coefficient</h4><p>The reactant with the smallest moles-per-coefficient value is the limiting reagent.</p></div></div>
        <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Calculate product from limiting reagent only</h4><p>Use mole ratio → moles of product → grams of product (theoretical yield).</p></div></div>
        <div class="step"><div class="step-n">5</div><div class="step-body"><h4>Find excess reagent remaining</h4><p>Moles LR used × (coeff excess / coeff LR) = moles excess used. Remaining = initial − used.</p></div></div>
      </div>
    </div>
    <div class="hbox hbox-green"><h4>✓ Solubility Rules (Memorize)</h4><ul>
      <li>Always soluble: NO₃⁻, CH₃COO⁻, ClO₄⁻, Group 1 cations, NH₄⁺</li>
      <li>Usually soluble: Cl⁻, Br⁻, I⁻ — except with Ag⁺, Pb²⁺, Hg₂²⁺</li>
      <li>Usually soluble: SO₄²⁻ — except BaSO₄, PbSO₄, CaSO₄, Ag₂SO₄</li>
      <li>Usually insoluble: CO₃²⁻, PO₄³⁻, S²⁻, OH⁻, CrO₄²⁻ — except Group 1 + NH₄⁺</li>
    </ul></div>
    <div class="hbox hbox-purple"><h4>🔄 Balancing Redox (Acidic Solution)</h4><ul>
      <li>1. Write unbalanced half-reactions</li>
      <li>2. Balance atoms (except O and H)</li>
      <li>3. Add H₂O to balance O</li>
      <li>4. Add H⁺ to balance H</li>
      <li>5. Add e⁻ to balance charge</li>
      <li>6. Multiply half-reactions so electrons cancel; add together</li>
      <li>Basic solution: after step 6, add OH⁻ to both sides to cancel H⁺</li>
    </ul></div>
    <div class="hbox hbox-amber"><h4>⚠ USNCO Tips</h4><ul>
      <li>Empirical formula: divide percent comp by atomic mass → divide by smallest → get whole numbers</li>
      <li>Molecular formula: (empirical formula) × n where n = molar mass / empirical formula mass</li>
      <li>Oxidation state rules: O = −2 (except peroxides −1, OF₂ +2); H = +1 (except metal hydrides −1); sum = charge</li>
    </ul></div>`

    lead:"Model gas behavior with powerful laws — from the ideal case to real gas corrections. Understand the molecular basis of pressure, temperature, and diffusion.",
    content:`
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(79,142,247,.12)">💨</div><div class="sec-title">Key Gas Laws & Formulas</div></div>
      <div class="formula-list">
        <div class="formula-row"><div class="feq">PV = nRT</div><div class="fdesc"><strong>Ideal Gas Law.</strong> R = 0.08206 L·atm/mol·K or 8.314 J/mol·K. T must be in Kelvin. STP: 0°C, 1 atm → 22.4 L/mol.</div></div>
        <div class="formula-row"><div class="feq">P₁V₁/T₁ = P₂V₂/T₂</div><div class="fdesc"><strong>Combined Gas Law.</strong> For a fixed amount of gas. Remove variables that stay constant (e.g., constant T → Boyle's Law: P₁V₁ = P₂V₂).</div></div>
        <div class="formula-row"><div class="feq">Pₜₒₜₐₗ = P₁ + P₂ + P₃ + …</div><div class="fdesc"><strong>Dalton's Law of Partial Pressures.</strong> Each gas exerts pressure independently. Mole fraction: χᵢ = nᵢ/nₜₒₜₐₗ, so Pᵢ = χᵢ × Pₜₒₜₐₗ.</div></div>
        <div class="formula-row"><div class="feq">KE_avg = (3/2)RT</div><div class="fdesc"><strong>Average kinetic energy per mole.</strong> Depends ONLY on temperature. All gases at same T have same average KE, regardless of molar mass.</div></div>
        <div class="formula-row"><div class="feq">u_rms = √(3RT/M)</div><div class="fdesc"><strong>Root-mean-square speed.</strong> M = molar mass in kg/mol. Lighter gases move faster. Explains Graham's law of effusion: rate ∝ 1/√M.</div></div>
        <div class="formula-row"><div class="feq">(P + an²/V²)(V − nb) = nRT</div><div class="fdesc"><strong>van der Waals equation.</strong> a corrects for intermolecular attractions (reduces pressure); b corrects for molecular volume. Real gases deviate most at high P, low T.</div></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(56,217,217,.12)">⚡</div><div class="sec-title">Kinetic Molecular Theory (KMT)</div></div>
      <div class="card-grid">
        <div class="card"><div class="card-icon">🎯</div><h3>5 Postulates</h3><p>1) Gas particles are tiny with negligible volume. 2) Particles in constant random motion. 3) No intermolecular forces. 4) Elastic collisions. 5) Average KE ∝ absolute temperature.</p></div>
        <div class="card"><div class="card-icon">📊</div><h3>Maxwell-Boltzmann Distribution</h3><p>Bell-curve-shaped distribution of molecular speeds. Higher T → peak shifts right (faster) and broadens. Heavier molecules → peak shifts left. Area under curve = 1 (all molecules).</p></div>
        <div class="card"><div class="card-icon">🌡️</div><h3>Pressure Explained</h3><p>Pressure = force of molecular collisions per unit area. More collisions (higher T, more molecules, smaller volume) → higher pressure. Directly proportional to temperature at constant V and n.</p></div>
        <div class="card"><div class="card-icon">💨</div><h3>Diffusion vs Effusion</h3><p>Diffusion: gas spreading through space. Effusion: gas escaping through a small hole. Graham's Law: rate of effusion ∝ 1/√M. Lighter gases effuse faster.</p></div>
      </div>
    </div>
    <div class="hbox hbox-blue"><h4>💡 Real vs Ideal Gases</h4><ul>
      <li>Ideal behavior: high T, low P (molecules far apart, moving fast — KMT assumptions hold)</li>
      <li>Real gas deviates at: high P (volume correction, b), low T (attraction correction, a)</li>
      <li>At very high P, Z = PV/nRT > 1 (repulsions dominate — molecules take up space)</li>
      <li>At moderate P and low T, Z &lt; 1 (attractions dominate — lower pressure than ideal)</li>
      <li>Noble gases: smallest a and b (weakest IMFs, smallest size)</li>
    </ul></div>
    <div class="hbox hbox-amber"><h4>⚠ USNCO Tips</h4><ul>
      <li>Mole fraction is dimensionless: χ = n_gas / n_total — useful for partial pressure calculations</li>
      <li>When collecting gas over water: P_gas = P_total − P_water (water vapor pressure is given or known)</li>
      <li>Root-mean-square speed ≠ average speed, but both ∝ √T and ∝ 1/√M</li>
      <li>USNCO loves Maxwell-Boltzmann: know what shifts the peak and what changes the width</li>
    </ul></div>`
  },

    lead:"Quantify heat flow in chemical reactions. From calorimetry to Hess's law and standard enthalpies — understand energy changes at constant pressure and volume.",
    content:`
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(251,191,36,.12)">🌡️</div><div class="sec-title">Key Formulas</div></div>
      <div class="formula-list">
        <div class="formula-row"><div class="feq">q = mcΔT</div><div class="fdesc"><strong>Heat transfer.</strong> m = mass (g), c = specific heat capacity (J/g·K), ΔT = T_final − T_initial. For water: c = 4.184 J/g·K.</div></div>
        <div class="formula-row"><div class="feq">q_rxn = −q_calorimeter</div><div class="fdesc"><strong>Conservation of energy.</strong> Heat lost by reaction = heat gained by solution (or vice versa). Exothermic rxn: q_rxn &lt; 0, q_cal &gt; 0.</div></div>
        <div class="formula-row"><div class="feq">ΔH°_rxn = Σ ΔH°f(products) − Σ ΔH°f(reactants)</div><div class="fdesc"><strong>Standard enthalpy from formation enthalpies.</strong> ΔH°f of elements in standard state = 0.</div></div>
        <div class="formula-row"><div class="feq">ΔH_rxn = Σ BE(bonds broken) − Σ BE(bonds formed)</div><div class="fdesc"><strong>Bond energy method.</strong> Breaking bonds requires energy; forming bonds releases. Approximate (gas phase only).</div></div>
        <div class="formula-row"><div class="feq">q_bomb = C_cal × ΔT</div><div class="fdesc"><strong>Bomb calorimeter.</strong> C_cal = heat capacity of calorimeter (J/°C or J/K). Measures ΔE (constant volume), not ΔH directly.</div></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(251,191,36,.12)">⚖️</div><div class="sec-title">Calorimetry Comparison</div></div>
      <div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Conditions</th><th>Measures</th><th>Use case</th></tr></thead><tbody>
        <tr><td>Coffee-cup calorimeter</td><td>Constant pressure, open</td><td>q_p ≈ ΔH</td><td>Aqueous reactions, neutralization</td></tr>
        <tr><td>Bomb calorimeter</td><td>Constant volume, sealed</td><td>q_v = ΔE</td><td>Combustion reactions, foods</td></tr>
      </tbody></table></div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(167,139,250,.12)">🗺️</div><div class="sec-title">Hess's Law</div></div>
      <div class="steps">
        <div class="step"><div class="step-n">1</div><div class="step-body"><h4>Write target reaction</h4><p>Identify what you're solving for.</p></div></div>
        <div class="step"><div class="step-n">2</div><div class="step-body"><h4>Arrange given reactions</h4><p>Flip reactions as needed (flip sign of ΔH). Multiply as needed (scale ΔH by same factor).</p></div></div>
        <div class="step"><div class="step-n">3</div><div class="step-body"><h4>Cancel intermediates</h4><p>Species that appear on both sides cancel. What remains should match target reaction.</p></div></div>
        <div class="step"><div class="step-n">4</div><div class="step-body"><h4>Sum the ΔH values</h4><p>ΔH_total = sum of all modified ΔH values. Enthalpy is a state function — path doesn't matter.</p></div></div>
      </div>
    </div>
    <div class="hbox hbox-blue"><h4>💡 Heating Curves</h4><ul>
      <li>Sloped region: q = mcΔT (temperature changes, single phase)</li>
      <li>Flat region (phase change): q = n × ΔH_fus or n × ΔH_vap (T constant, state changing)</li>
      <li>Melting point: solid ⇌ liquid equilibrium. Boiling point: liquid ⇌ gas at 1 atm.</li>
      <li>Specific heats differ by phase: water(s)=2.09, water(l)=4.18, water(g)=2.01 J/g·K</li>
    </ul></div>
    <div class="hbox hbox-amber"><h4>⚠ USNCO Tips</h4><ul>
      <li>State function: ΔH depends only on initial and final state, not pathway</li>
      <li>Endothermic: ΔH &gt; 0 (absorbs heat). Exothermic: ΔH &lt; 0 (releases heat)</li>
      <li>Born-Haber cycle uses Hess's Law to find lattice energy indirectly</li>
      <li>Bond energies are averages — less accurate than ΔH°f method</li>
    </ul></div>`

    content:`
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(52,211,153,.12)">📏</div><div class="sec-title">Significant Figures</div></div>
      <div class="card-grid">
        <div class="card"><div class="card-icon">🔢</div><h3>Sig Fig Rules</h3><p>All non-zero digits are significant. Zeros between sig figs are significant. Leading zeros (0.002) are NOT. Trailing zeros after decimal ARE (2.50). Trailing zeros without decimal are ambiguous (use scientific notation).</p></div>
        <div class="card"><div class="card-icon">✖️</div><h3>Multiplication/Division</h3><p>Answer has the same number of sig figs as the measurement with the fewest sig figs. Example: 4.52 × 3.1 = 14 (2 sig figs).</p></div>
        <div class="card"><div class="card-icon">➕</div><h3>Addition/Subtraction</h3><p>Answer has the same number of decimal places as the measurement with the fewest decimal places. Example: 12.11 + 18.0 = 30.1 (1 decimal place).</p></div>
        <div class="card"><div class="card-icon">📊</div><h3>Reading Equipment</h3><p>Estimate one digit beyond the smallest graduation. Buret: read to 0.01 mL. Thermometer: read to 0.1°C. Analytical balance: read to 0.0001 g (4 decimal places).</p></div>
      </div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(52,211,153,.12)">🎯</div><div class="sec-title">Error Analysis</div></div>
      <div class="formula-list">
        <div class="formula-row"><div class="feq">% error = |exp − true| / true × 100</div><div class="fdesc"><strong>Percent error.</strong> Measures accuracy (closeness to true value). Always positive (use absolute value).</div></div>
        <div class="formula-row"><div class="feq">% RSD = (std dev / mean) × 100</div><div class="fdesc"><strong>Relative standard deviation (% RSD).</strong> Measures precision (reproducibility). Lower = more precise.</div></div>
      </div>
      <div class="tbl-wrap" style="margin-top:16px"><table><thead><tr><th>Error Type</th><th>Definition</th><th>Effect</th><th>Can be corrected?</th></tr></thead><tbody>
        <tr><td>Systematic error</td><td>Consistent bias in one direction</td><td>Affects accuracy</td><td>Yes, by calibration or method correction</td></tr>
        <tr><td>Random error</td><td>Random fluctuations around true value</td><td>Affects precision</td><td>Minimized by averaging; never fully eliminated</td></tr>
        <tr><td>Gross error</td><td>Blunder (wrong reading, contamination)</td><td>Large deviation</td><td>Yes, by repeating and discarding outlier</td></tr>
      </tbody></table></div>
    </div>
    <div class="section">
      <div class="sec-hdr"><div class="sec-icon" style="background:rgba(56,217,217,.12)">🧪</div><div class="sec-title">Key Lab Techniques</div></div>
      <div class="card-grid">
        <div class="card"><div class="card-icon">🫧</div><h3>Buret Reading</h3><p>Read from top (0) to bottom (50 mL). Volume dispensed = final − initial reading. Read bottom of meniscus for clear liquids, top for dark (e.g., KMnO₄). Estimate to ±0.01 mL.</p></div>
        <div class="card"><div class="card-icon">🌡️</div><h3>Calorimetry</h3><p>Minimize heat loss (styrofoam cup, lid). Record initial T before mixing. Record final T (maximum or plateau). Assume density of dilute solutions = 1.00 g/mL. q = mcΔT where m = mass of solution.</p></div>
        <div class="card"><div class="card-icon">💧</div><h3>Distillation</h3><p>Separates liquids by boiling point. Simple distillation: &gt;25°C bp difference. Fractional: close boiling points, uses fractionating column. Collect fractions by temperature ranges.</p></div>
        <div class="card"><div class="card-icon">📡</div><h3>Spectrophotometry</h3><p>Zero instrument with blank (solvent only). Measure A at λ_max. Use calibration curve (A vs c) for concentration. Higher concentration → higher absorbance (Beer-Lambert).</p></div>
      </div>
    </div>
    <div class="hbox hbox-blue"><h4>💡 Good Experimental Design</h4><ul>
      <li>Control variables: change only one independent variable at a time</li>
      <li>Repeat trials: 3+ measurements to assess precision and spot gross errors</li>
      <li>Blank/control: includes all reagents except analyte — corrects for background signal</li>
      <li>Calibration standards: known concentrations/amounts run alongside unknowns</li>
      <li>Random sampling: ensures representative sample of heterogeneous materials</li>
    </ul></div>
    <div class="hbox hbox-amber"><h4>⚠ USNCO Lab Tips</h4><ul>
      <li>Buret: always check for air bubbles before titrating; rinse with titrant solution, not water</li>
      <li>Volumetric glassware (pipet, buret, volumetric flask) is more precise than graduated cylinder</li>
      <li>Overshooting equivalence point: systematic error, makes volume dispensed too large</li>
      <li>If asked for sources of error — identify specific, realistic errors that affect result in a specific direction</li>
      <li>Filtration: filter paper, Buchner funnel + vacuum for faster; wash precipitate with cold solvent to reduce solubility losses</li>
    </ul></div>`
  }

  9:{diagram:'gibbs',terms:[['Entropy','A measure related to energy dispersal and accessible microstates.'],['Spontaneous','Thermodynamically favorable, not necessarily fast.'],['Gibbs free energy','The direction criterion at constant temperature and pressure.']],focus:['Entropy usually increases when particles or energy spread out.','Delta G = Delta H - T Delta S decides thermodynamic favorability.','Thermodynamics predicts direction; kinetics predicts speed.']},
  10:{diagram:'kinetics',terms:[['Rate law','An experimental equation relating rate to concentration.'],['Intermediate','A species formed in one mechanism step and consumed later.'],['Activation energy','The energy barrier particles must overcome to react.']],focus:['Rate laws come from data unless a step is elementary.','The slow mechanism step often controls the rate.','Catalysts lower activation energy without changing Delta G.']},
  11:{diagram:'electro',terms:[['Anode','Electrode where oxidation occurs.'],['Cathode','Electrode where reduction occurs.'],['Nernst equation','Relates cell voltage to nonstandard concentrations.']],focus:['Oxidation is electron loss; reduction is electron gain.','Electrons flow from anode to cathode in a galvanic cell.','Cell voltage connects to Delta G through Delta G = -nFE.']},
  12:{diagram:'coordination',terms:[['Ligand','An ion or molecule donating an electron pair to a metal.'],['Coordination number','Number of donor atoms attached to the metal.'],['Crystal field splitting','Ligand-caused separation of d-orbital energies.']],focus:['Metal-ligand bonding is Lewis acid-base chemistry.','Geometry depends strongly on coordination number and metal identity.','Color and magnetism often come from d-orbital splitting.']},
  13:{diagram:'organic',terms:[['Nucleophile','Electron-pair donor.'],['Electrophile','Electron-pair acceptor.'],['Carbocation','A positively charged carbon; stability controls many pathways.']],focus:['Functional groups are reaction handles.','Curved arrows show electron-pair movement, not atom movement.','SN1, SN2, E1, and E2 choices depend on substrate, base/nucleophile, solvent, and heat.']},
  14:{diagram:'beer',terms:[['Absorbance','A log measure of how much light a sample absorbs.'],['Calibration curve','A standards plot used to find an unknown concentration.'],['Endpoint','The observed signal telling you to stop a titration.']],focus:['Analytical chemistry turns measured signal into amount.','Equivalence point is stoichiometric; endpoint is observed.','Different spectra answer different questions: UV-Vis quantity, IR functional groups, MS mass.']},
  15:{diagram:'lab',terms:[['Meniscus','The curved liquid surface read in glassware.'],['Systematic error','Consistent bias that hurts accuracy.'],['Random error','Scatter that hurts precision.']],focus:['Read instruments to the justified precision.','Accuracy and precision are different and diagnose different problems.','Good experimental design changes one variable and controls the rest.']}
};

function renderDeepDive(u){
  const d = LESSON_EXTRAS[u.id];
  const sub = u.topics.slice(0,6).map((topic,i)=>({title:`Sub-lesson ${i+1}: ${topic}`,focus:d.focus[i%d.focus.length],bullets:[`First ask what model this topic uses, then list the quantities or particles that model tracks.`,`Use this as a bridge to later topics: ${d.focus[(i+1)%d.focus.length]}`,`On USNCO-style questions, explain the cause before reaching for a formula.`]}));
  return `<div class="divider"></div><div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(79,142,247,.12)">+</div><div class="sec-title">Deeper Lesson Path</div></div><div class="lesson-map">${sub.map((s,i)=>`<div class="map-node"><div class="map-kicker">Sub-lesson ${i+1}</div><h4>${u.topics[i]}</h4><p>${s.focus}</p></div>`).join('')}</div>${sub.map(s=>`<div class="sublesson"><h3>${s.title}</h3><p>${s.focus}</p><ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul><div class="worked-example"><h4>How to use this on a problem</h4><p>Name the concept, identify the givens, write the relationship, then check whether the answer matches the chemistry story.</p></div></div>`).join('')}</div>${renderDiagram(d.diagram)}<div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(56,217,217,.12)">?</div><div class="sec-title">Symbols, Laws, and Terms Introduced Here</div></div><div class="concept-glossary">${d.terms.map(t=>`<div class="glossary-item"><h4>${t[0]}</h4><p>${t[1]}</p></div>`).join('')}</div></div>`;
}

function renderDiagram(type){
  const labels = {atom:['Shells','PES','Trend'],bond:['Nonpolar','Polar','Resonance'],stoich:['Mass','Moles','Yield'],gas:['Low P','High T','Mixture'],enthalpy:['Exothermic','Endothermic','Hess'],solution:['Dissolve','Dilute','Particles'],equilibrium:['Q < K','Q = K','Q > K'],acid:['Buffer','Half-eq','Equiv'],gibbs:['Low T','High T','Equil'],kinetics:['Slow','Fast','Catalyst'],electro:['Galvanic','Nernst','Electrolysis'],coordination:['Weak','Strong','Color'],organic:['SN2','SN1','E2'],beer:['Standards','Unknown','Limit'],lab:['Precise','Accurate','Both']};
  const title = {atom:'Electron energy model',bond:'Bond polarity and shape',stoich:'Stoichiometry flow',gas:'Gas particle model',enthalpy:'Reaction energy profile',solution:'Solvation model',equilibrium:'Equilibrium shift board',acid:'Titration curve',gibbs:'Free-energy decision map',kinetics:'Collision and barrier model',electro:'Electrochemical cell',coordination:'Crystal field picture',organic:'Mechanism map',beer:'Calibration curve',lab:'Accuracy and precision target'};
  return `<div class="section"><div class="sec-hdr"><div class="sec-icon" style="background:rgba(167,139,250,.12)">~</div><div class="sec-title">Visual Model</div></div><div class="diagram-card" data-diagram="${type}"><div class="diagram-head"><div><h3>${title[type]}</h3><p>Use the controls to see how the main idea changes under common exam conditions.</p></div><div class="diagram-controls">${labels[type].map((m,i)=>`<button class="diagram-btn ${i===0?'active':''}" onclick="setDiagramMode(this,${i})">${m}</button>`).join('')}</div></div><div class="visual-stage">${diagramSvg(type,0)}</div><div class="diagram-note">${diagramNote(type,0)}</div></div></div>`;
}

function diagramNote(type,mode){
  const notes = {atom:['Inner electrons have higher binding energy; outer electrons are removed first.','PES peak area tracks electron count, while position tracks attraction.','Across a period, Zeff rises and atomic radius usually shrinks.'],bond:['Symmetric bond dipoles can cancel.','Uneven electron pull creates partial charges and a molecular dipole.','Resonance spreads electron density across several atoms.'],stoich:['Convert measured mass to moles before using coefficients.','Coefficients compare moles between substances.','Percent yield compares actual product to theoretical product.'],gas:['Low pressure improves ideal behavior.','Higher temperature raises average kinetic energy.','Each gas contributes a partial pressure.'],enthalpy:['Products lower than reactants means heat was released.','Products higher than reactants means heat was absorbed.','Hess law adds energy steps because enthalpy is a state function.'],solution:['Solvation replaces old attractions with new solute-solvent attractions.','Dilution changes concentration but not moles of solute.','Colligative effects grow with particle count.'],equilibrium:['Q < K shifts forward.','Q = K is equilibrium.','Q > K shifts backward.'],acid:['Buffers flatten pH change.','At half-equivalence, pH = pKa.','Near equivalence, pH changes sharply.'],gibbs:['At low temperature, enthalpy can dominate.','At high temperature, entropy can dominate.','At equilibrium, Delta G equals zero.'],kinetics:['A high barrier gives fewer successful collisions.','More energetic collisions increase rate.','A catalyst lowers the barrier using a different path.'],electro:['Galvanic cells make electrical work from spontaneous redox.','Nernst corrects voltage for nonstandard concentrations.','Electrolysis drives nonspontaneous redox.'],coordination:['Weak-field ligands often leave more unpaired electrons.','Strong-field ligands often force pairing.','Color comes from absorbing light matching the d-orbital gap.'],organic:['SN2 is one concerted backside attack.','SN1 forms a carbocation before attack.','E2 removes a beta hydrogen as the leaving group departs.'],beer:['Standards define the signal-concentration line.','Unknown concentration is read from measured signal.','Beer-Lambert can fail at high concentration.'],lab:['Precise trials cluster together.','Accurate trials center near the true value.','Best data are both centered and tightly clustered.']};
  return notes[type][mode];
}

function setDiagramMode(btn,mode){
  const card = btn.closest('.diagram-card');
  const type = card.dataset.diagram;
  card.querySelectorAll('.diagram-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  card.querySelector('.visual-stage').innerHTML = diagramSvg(type,mode);
  card.querySelector('.diagram-note').textContent = diagramNote(type,mode);
}
let current = null;
const DONE_KEY = 'usnco_done';
function getDone(){try{return JSON.parse(localStorage.getItem(DONE_KEY))||[];}catch{return[];}}
function setDone(arr){localStorage.setItem(DONE_KEY,JSON.stringify(arr));}

// ─── RENDER NAV ──────────────────────────────────────────────────────────────
function renderNav(){
  const done = getDone();
  const nav = document.getElementById('nav-list');
  nav.innerHTML = UNITS.map(u=>`
    <div class="nav-item ${current===u.id?'active':''} ${done.includes(u.id)?'done':''}"
         onclick="loadUnit(${u.id})">
      <div class="nav-num">${done.includes(u.id)?'✓':u.id}</div>
      <div class="nav-label">${u.title}</div>
    </div>
  `).join('');
  // Progress
  const n = done.length;
  document.getElementById('prog-text').textContent = `${n} / 15`;
  document.getElementById('prog-fill').style.width = (n/15*100)+'%';
}

// ─── LOAD UNIT ───────────────────────────────────────────────────────────────
function loadUnit(id){
  current = id;
  closeSidebar();
  const u = UNITS.find(x=>x.id===id);
  const done = getDone();
  document.getElementById('tb-crumb').textContent = `Unit ${id} of 15`;
  document.getElementById('tb-title').textContent = u.title;
  document.getElementById('btn-done').textContent = done.includes(id) ? '✓ Completed' : '✓ Mark Done';
  document.getElementById('btn-prev').style.opacity = id===1?'0.3':'1';
  document.getElementById('btn-next').style.opacity = id===15?'0.3':'1';
  const area = document.getElementById('content-area');
  area.innerHTML = `
    <div class="content-wrap">
      <div class="unit-hero">
        <div class="unit-badge">${u.emoji} Unit ${u.id}</div>
        <h1>${u.title}</h1>
        <p class="lead">${u.lead}</p>
        <div class="hero-tags">${u.topics.map(t=>`<span class="htag">${t}</span>`).join('')}</div>
      </div>
      ${u.content}
      ${renderDeepDive(u)}
    </div>`;
  renderNav();
  window.scrollTo(0,0);
}

// ─── TOGGLE DONE ─────────────────────────────────────────────────────────────
function toggleDone(){
  if(!current) return;
  let done = getDone();
  if(done.includes(current)) done = done.filter(x=>x!==current);
  else done.push(current);
  setDone(done);
  document.getElementById('btn-done').textContent = done.includes(current)?'✓ Completed':'✓ Mark Done';
  renderNav();
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
function navUnit(dir){
  const next = (current||0) + dir;
  if(next>=1 && next<=15) loadUnit(next);
}

// ─── HOME SCREEN ─────────────────────────────────────────────────────────────
function loadHome(){
  current = null;
  document.getElementById('tb-crumb').textContent = 'USNCO Prep';
  document.getElementById('tb-title').textContent = 'All Units';
  document.getElementById('btn-prev').style.opacity='0.3';
  document.getElementById('btn-next').style.opacity='1';
  const done = getDone();
  const area = document.getElementById('content-area');
  area.innerHTML = `
    <div class="content-wrap">
      <div class="unit-hero">
        <div class="unit-badge">🏆 USNCO</div>
        <h1>Chemistry Master Guide</h1>
        <p class="lead">All 15 USNCO topics — key concepts, formulas, tables, and exam tips. Select a unit to begin studying, or pick up where you left off.</p>
        <div class="hero-tags">
          <span class="htag">${done.length} of 15 completed</span>
          <span class="htag">60+ Key Formulas</span>
          <span class="htag">15 Interactive Diagrams</span>
          <span class="htag">90 Sub-lessons</span>
        </div>
      </div>
      <div class="home-grid">
        ${UNITS.map(u=>`
          <div class="home-card" onclick="loadUnit(${u.id})">
            <div class="hc-num">Unit ${u.id}</div>
            <div class="hc-title">${u.emoji} ${u.title}</div>
            <div class="hc-topics">${u.topics.slice(0,3).join(' · ')}${u.topics.length>3?'…':''}</div>
            <span class="hc-badge ${done.includes(u.id)?'done-badge':'todo-badge'}">${done.includes(u.id)?'✓ Done':'Not started'}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
  renderNav();
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

// ─── LOGO CLICK ──────────────────────────────────────────────────────────────
document.querySelector('.logo-wrap').style.cursor='pointer';
document.querySelector('.logo-wrap').addEventListener('click',loadHome);

// ─── INIT ────────────────────────────────────────────────────────────────────
renderNav();
loadHome();
</script>
